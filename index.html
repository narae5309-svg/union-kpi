<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>UNION-CRM 계약관리</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg:#f4f7f8; --grid:#dbe4e6; --grid-strong:#b7c6c9; --header-fill:#e3f6f5;
    --accent:#0fb4ae; --accent-dark:#0b8f8a; --accent2:#2d6ae3;
    --warn:#b3261e; --warn-bg:#fdecea;
    --ink:#1f2b2b; --ink-soft:#5c7273; --card:#ffffff; --radius:6px;
  }
  *{box-sizing:border-box;} body{margin:0;}
  .app{font-family:'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif; color:var(--ink); background:var(--bg); min-height:100vh; font-size:13px;}
  .num{font-family:Consolas,'SF Mono',monospace; font-variant-numeric:tabular-nums;}
  h1,h2,h3{margin:0; font-weight:600;}

  .login-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(160deg,#eaf7f6 0%,#f4f7f8 55%,#eef2f0 100%);}
  .login-card{background:#fff; width:380px; padding:44px 36px; border-radius:14px; box-shadow:0 20px 45px rgba(15,180,174,.14), 0 2px 8px rgba(0,0,0,.04); text-align:center;}
  .login-card .logo{font-size:26px; font-weight:800; letter-spacing:1px; color:var(--ink); margin-bottom:22px; font-style:italic;}
  .login-card h1{font-size:17px; font-weight:700;}
  .login-card h1 .accent-word{color:var(--accent);}
  .login-card p.sub{color:var(--ink-soft); font-size:12px; margin:6px 0 24px;}
  .login-card input{width:100%; padding:12px 14px; font-size:14px; border:1px solid transparent; background:#eef4f5; margin-bottom:12px; border-radius:8px; font-family:inherit;}
  .login-card input:focus{outline:none; border-color:var(--accent); background:#fff;}
  .btn-primary{background:var(--accent); color:#fff; border:none; padding:10px 18px; font-size:14px; font-weight:600; cursor:pointer; width:100%; border-radius:var(--radius);}
  .btn-primary:hover{background:var(--accent-dark);}
  .login-note{font-size:11px; color:#8a8f98; margin-top:16px; line-height:1.5;}

  .shell{display:flex; min-height:100vh;}
  .sidebar{width:200px; background:#1b2733; color:#cfd6dd; flex-shrink:0; display:flex; flex-direction:column; padding:20px 0;}
  .brand{padding:0 18px 16px; border-bottom:1px solid #2e3c4a; margin-bottom:6px;}
  .brand h2{font-size:16px; color:#fff;}
  .brand .who{font-size:11px; color:#8b95a1; margin-top:5px;}
  .nav-item{padding:10px 18px; cursor:pointer; font-size:13px; border-left:3px solid transparent;}
  .nav-item:hover{background:#243342;}
  .nav-item.active{background:#243342; color:#fff; border-left:3px solid var(--accent);}
  .nav-footer{margin-top:auto; padding:14px 18px 0; border-top:1px solid #2e3c4a;}
  .logout-link{color:#8b95a1; font-size:11px; cursor:pointer;}
  .logout-link:hover{color:#fff;}

  .main{flex:1; padding:26px 34px; overflow-x:auto;}
  .page-title{font-size:19px; margin-bottom:3px; font-weight:700;}
  .page-sub{color:var(--ink-soft); font-size:12px; margin-bottom:20px;}

  .card{background:var(--card); border:1px solid var(--grid); border-radius:var(--radius); padding:20px; margin-bottom:18px;}
  .card h3{font-size:13px; margin-bottom:14px; text-transform:uppercase; letter-spacing:.4px; color:var(--accent-dark);}

  .field label{display:block; font-size:11px; color:var(--ink-soft); margin-bottom:4px;}
  .field select, .field input, .field textarea{width:100%; padding:7px 9px; border:1px solid var(--grid-strong); font-size:13px; border-radius:var(--radius); font-family:inherit; background:#fff;}
  .field{margin-bottom:12px;}

  table{width:100%; border-collapse:separate; border-spacing:0; font-size:12.5px; border:1px solid var(--grid);}
  th{text-align:left; padding:7px 6px; background:var(--header-fill); border-right:1px solid var(--grid); border-bottom:1px solid var(--grid); font-weight:700; color:var(--accent-dark); font-size:11.5px; white-space:nowrap; position:sticky; top:0; z-index:3;}
  td{padding:6px; border-right:1px solid var(--grid); border-bottom:1px solid var(--grid); vertical-align:middle;}
  th:last-child, td:last-child{border-right:none;}
  tbody tr:last-child td{border-bottom:none;}
  tr:hover td{background:#dcf3f1;}

  .btn-sm{background:#fff; border:1.5px solid var(--accent); color:var(--accent-dark); font-weight:700; padding:6px 12px; cursor:pointer; font-size:12px; border-radius:var(--radius); transition:background .15s,color .15s;}
  .btn-sm:hover{background:var(--accent); color:#fff;}
  .btn-danger{color:#b3261e; background:#fff; border:1.5px solid #b3261e; font-weight:700;}
  .btn-danger:hover{background:#b3261e; color:#fff;}
  .btn-ghost{background:#fff; border:1.5px solid var(--accent-dark); color:var(--accent-dark); font-weight:700;}
  .btn-ghost:hover{background:var(--accent-dark); color:#fff;}
  .icon-btn{width:24px; height:24px; display:inline-flex; align-items:center; justify-content:center; border-radius:4px; border:1.5px solid var(--accent); background:#fff; color:var(--accent-dark); cursor:pointer; font-size:12px; padding:0; line-height:1; vertical-align:middle;}
  .icon-btn:hover{background:var(--accent); color:#fff;}
  .icon-btn.danger{border-color:#b3261e; color:#b3261e; font-weight:800; font-size:15px;}
  .icon-btn.danger:hover{background:#b3261e; color:#fff;}
  .icon-btn.copy{border-color:var(--accent2); color:var(--accent2);}
  .icon-btn.copy:hover{background:var(--accent2); color:#fff;}
  .omField{width:100%; padding:5px 7px; border:1px solid var(--grid-strong); border-radius:2px; font-family:inherit; font-size:12.5px; background:#fff; box-sizing:border-box;}
  .omField:focus{border-color:var(--accent); outline:none;}

  .toolbar{display:flex; gap:10px; margin-bottom:14px; align-items:center; flex-wrap:wrap;}
  .toolbar input, .toolbar select{padding:7px 9px; border:1px solid var(--grid-strong); border-radius:var(--radius); font-family:inherit; font-size:12.5px;}

  .tabs{display:flex; gap:4px; margin-bottom:14px; flex-wrap:wrap;}
  .tab-btn{padding:8px 16px; background:#fff; border:1px solid var(--grid); border-bottom:none; cursor:pointer; font-size:12.5px; font-weight:600; color:var(--ink-soft); border-radius:var(--radius) var(--radius) 0 0;}
  .tab-btn .cnt{color:var(--accent-dark); font-family:Consolas,monospace;}
  .tab-btn.active{background:var(--header-fill); color:var(--accent-dark); border-color:var(--grid-strong);}

  .badge{display:inline-block; padding:2px 8px; border-radius:10px; font-size:10.5px; font-weight:700;}
  .badge.blue{background:#e8edfb; color:var(--accent2);}
  .badge.green{background:#e7f3ec; color:var(--accent-dark);}
  .badge.warn{background:var(--warn-bg); color:var(--warn);}
  .badge.gold{background:#fff3d6; color:#8a6d1f;}

  .empty{text-align:center; padding:36px 20px; color:var(--ink-soft); font-size:12.5px;}

  .modal-bg{position:fixed; inset:0; background:rgba(20,25,30,.55); display:flex; align-items:flex-start; justify-content:center; z-index:200; overflow-y:auto; padding:30px 0;}
  .modal{background:#fff; width:680px; max-width:94vw; padding:0; border-radius:var(--radius); position:relative;}
  .modal-head{display:flex; justify-content:space-between; align-items:center; padding:14px 20px; border-bottom:1px solid var(--grid); background:var(--header-fill);}
  .modal-close{cursor:pointer; font-size:18px; color:var(--ink-soft); background:none; border:none;}
  .modal-body{padding:24px; max-height:78vh; overflow-y:auto;}
  .modal-actions{padding:14px 20px; border-top:1px solid var(--grid); display:flex; justify-content:flex-end; gap:8px;}

  .pick-row{display:flex; justify-content:space-between; align-items:center; padding:10px 12px; border:1px solid var(--grid); border-radius:var(--radius); margin-bottom:8px;}
  .pick-row .info{font-size:12.5px;}
  .pick-row .info .name{font-weight:700; margin-bottom:2px;}
  .pick-row .info .sub{color:var(--ink-soft); font-size:11.5px;}

  .alert-box{border:1px solid var(--warn); background:var(--warn-bg); border-radius:var(--radius); padding:14px 16px; margin-bottom:18px;}
  .alert-box-list{max-height:260px; overflow-y:auto; padding-right:4px;}
  .alert-box h4{margin:0 0 8px; font-size:12.5px; color:var(--warn);}
  .alert-item{display:flex; justify-content:space-between; font-size:12.5px; padding:4px 0; border-bottom:1px dashed #e6b3ae;}
  .alert-item:last-child{border-bottom:none;}

  .toast{position:fixed; bottom:26px; left:50%; transform:translateX(-50%); background:#1b2733; color:#fff; padding:11px 20px; border-radius:var(--radius); font-size:13px; z-index:500; box-shadow:0 8px 24px rgba(0,0,0,.3);}
  .hint{font-size:11px; color:var(--ink-soft); margin-top:6px; line-height:1.5;}
  .excel-fab{position:fixed; bottom:18px; right:18px; width:30px; height:30px; border-radius:50%; background:#1d6f42; color:#fff; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 3px 8px rgba(0,0,0,.28); font-size:9px; font-weight:800; z-index:150; letter-spacing:-0.5px;}
  .excel-fab:hover{background:#155a35; transform:scale(1.06);}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
(function(){
  const SUPABASE_URL = 'https://wqqwpqurxfomyolvresd.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_10_lrFOl0rxxagkvY7q8bA_9Ht86O-o';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const root = document.getElementById('app');
  const STAGES_CTR = ['계약','납품완료','청구완료','수금완료','유지보수'];
  const REQUEST_TYPES = ['없음','계산서 요청','완료'];
  const BILLING_CYCLES = ['연납','분기납','월납'];
  const RENEWAL_TYPES = ['자동갱신','수동갱신','종료예정'];
  const NAV = [['contracts','계약관리'],['maintenance','유지보수관리']];

  let state = {
    view:'login', user:null, userEmail:null, isAdmin:false, tab:'contracts', loading:true,
    customers:[], contracts:[], reps:[], maintenance:[],
    ctrStage:'전체', filterText:'',
    ctrFilterBiz:'전체', ctrFilterRep:'전체', ctrFilterRequest:'전체',
    mtFilterRep:'전체', mtFilterCycle:'전체', mtFilterRenewal:'전체',
    ctrExpandedId:null, mtExpandedId:null,
    modal:null, confirmModal:null, mtPickerOpen:false, mergePickerOpen:false, toast:null,
    selected:{contracts:new Set(), maintenance:new Set()},
    sortState:{},
    pagination:{contracts:1, maintenance:1},
    alertCollapsed:{ctr:true, mt:true},
    excelMenuOpen:false,
    attachUploadTarget:null, attachViewModal:null,
  };

  function showToast(m){ state.toast=m; render(); clearTimeout(showToast._t); showToast._t=setTimeout(()=>{state.toast=null; render();},2200); }
  function askConfirm(message,onYes,confirmLabel,danger){ state.confirmModal={message,onYes,confirmLabel:confirmLabel||'삭제',danger:danger!==false}; render(); }
  function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function excelDateToStr(val){
    if(val===undefined || val===null || val==='') return '';
    if(val instanceof Date && !isNaN(val)){
      return val.getFullYear()+'-'+String(val.getMonth()+1).padStart(2,'0')+'-'+String(val.getDate()).padStart(2,'0');
    }
    const s = String(val).trim();
    if(/^\d+(\.\d+)?$/.test(s)){
      const n = Number(s);
      if(n>20000 && n<80000){
        const epoch = new Date(Date.UTC(1899,11,30));
        const d = new Date(epoch.getTime() + n*86400000);
        return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');
      }
    }
    return s;
  }
  function esc(s){ return (s||'').toString().replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
  function won(n){ return '₩'+Math.round(Number(n||0)).toLocaleString('ko-KR'); }
  function daysUntil(dateStr){ if(!dateStr) return null; const d=new Date(dateStr+'T00:00:00'), now=new Date(todayStr()+'T00:00:00'); return Math.round((d-now)/86400000); }
  function nextCode(prefix, list){
    const compact = todayStr().replace(/-/g,'').slice(2);
    const n = list.filter(x=>x.code && x.code.startsWith(prefix+compact)).length+1;
    return prefix+compact+'-'+String(n).padStart(3,'0');
  }
  function buildRepOpts(current){
    const set = new Set(state.reps.map(r=>r.name).filter(Boolean));
    if(current) set.add(current);
    if(set.size===0) set.add(state.user);
    return [...set].sort((a,b)=>a.localeCompare(b,'ko'));
  }
  function sortedCustomers(){ return [...state.customers].sort((a,b)=>a.name.localeCompare(b.name,'ko')); }
  function sortedContracts(){ return [...state.contracts].sort((a,b)=>a.name.localeCompare(b.name,'ko')); }
  function custName(id){ const c=state.customers.find(x=>x.id===id); return c?c.name:'(미지정)'; }
  function contractCustomerName(id){ const c=state.contracts.find(x=>x.id===id); return c?custName(c.customerId):'-'; }
  function contractCode(id){ const c=state.contracts.find(x=>x.id===id); return c?c.code:'-'; }
  function contractVendor(id){ const c=state.contracts.find(x=>x.id===id); return c?c.bizType:'-'; }
  function contractEndUserName(id){ const c=state.contracts.find(x=>x.id===id); return c&&c.endUserName ? c.endUserName : '-'; }
  function contractVendorList(c){ return String(c.bizType||'').split(',').map(s=>s.trim()).filter(Boolean); }
  function allVendorNames(){ const set=new Set(); state.contracts.forEach(c=>contractVendorList(c).forEach(v=>set.add(v))); return [...set].sort((a,b)=>a.localeCompare(b,'ko')); }
  function expiringContracts(){
    return state.contracts.filter(c=>{
      if(c.alertDismissed || !c.expiryDate) return false;
      const d = daysUntil(c.expiryDate);
      return d!==null && d>=0 && d<=Number(c.alertDays||0);
    }).sort((a,b)=>daysUntil(a.expiryDate)-daysUntil(b.expiryDate));
  }
  // ---- 윈도우(브라우저) 알림: 만료일 30일 이내 계약 ----
  const NOTIFY_DAYS = 30;
  function notifySupported(){ return typeof window.Notification!=='undefined'; }
  function notifyPermission(){ return notifySupported() ? Notification.permission : 'unsupported'; }
  function notifiedKey(id){ return 'ctr-notified-'+id+'-'+todayStr(); }
  function wasNotifiedToday(id){ try{ return !!localStorage.getItem(notifiedKey(id)); }catch(e){ return false; } }
  function markNotified(id){ try{ localStorage.setItem(notifiedKey(id),'1'); }catch(e){} }
  function contractsDueForNotify(){
    return state.contracts.filter(c=>{
      if(c.alertDismissed || !c.expiryDate) return false;
      const d = daysUntil(c.expiryDate);
      return d!==null && d>=0 && d<=NOTIFY_DAYS;
    }).sort((a,b)=>daysUntil(a.expiryDate)-daysUntil(b.expiryDate));
  }
  function openContractFromNotice(id){
    window.focus();
    state.tab='contracts'; state.ctrStage='전체'; state.filterText='';
    state.ctrFilterBiz='전체'; state.ctrFilterRep='전체'; state.ctrFilterRequest='전체';
    state.alertCollapsed.ctr=false;
    if(id) state.ctrExpandedId=id;
    render();
  }
  function checkExpiryNotifications(force){
    if(notifyPermission()!=='granted') return 0;
    const due = contractsDueForNotify();
    const targets = force ? due : due.filter(c=>!wasNotifiedToday(c.id));
    if(targets.length===0){
      if(force) new Notification('계약 만료 알림', {body:'만료일 30일 이내인 계약이 없습니다.', tag:'ctr-expiry-none'});
      return 0;
    }
    if(targets.length>3){
      const first = targets[0];
      const n = new Notification(`만료 임박 계약 ${targets.length}건`, {
        body: targets.slice(0,3).map(c=>`· ${c.name} (D-${daysUntil(c.expiryDate)})`).join('\n')+`\n외 ${targets.length-3}건`,
        tag:'ctr-expiry-summary', requireInteraction:true,
      });
      n.onclick=()=>{ n.close(); openContractFromNotice(null); };
    } else {
      targets.forEach(c=>{
        const d = daysUntil(c.expiryDate);
        const n = new Notification(`계약 만료 ${d===0?'오늘':'D-'+d}`, {
          body: `${c.name} · ${custName(c.customerId)}\n만료일 ${c.expiryDate}`,
          tag:'ctr-expiry-'+c.id, requireInteraction:true,
        });
        n.onclick=()=>{ n.close(); openContractFromNotice(c.id); };
      });
    }
    targets.forEach(c=>markNotified(c.id));
    return targets.length;
  }
  function notifyButtonHTML(){
    const p = notifyPermission();
    if(p==='unsupported') return '';
    const label = p==='granted' ? '🔔 만료 알림 켜짐' : p==='denied' ? '🔕 알림 차단됨' : '🔔 만료 알림 켜기';
    const title = p==='granted' ? '누르면 지금 바로 만료 임박 계약 알림을 다시 보여줍니다'
      : p==='denied' ? '브라우저 주소창 왼쪽 자물쇠 → 사이트 권한 → 알림을 "허용"으로 바꿔주세요'
      : '만료일 30일 이내 계약을 윈도우 알림으로 받습니다';
    return `<div id="notifyToggleBtn" title="${title}" style="margin:10px 18px 0; padding:7px 10px; border:1px solid #2e3c4a; border-radius:var(--radius); font-size:12px; cursor:pointer; color:${p==='granted'?'#7fe0d9':'#cfd6dd'};">${label}</div>`;
  }

  function expiringMaintenance(){
    return state.maintenance.filter(m=>{
      if(m.alertDismissed || !m.endDate) return false;
      const d = daysUntil(m.endDate);
      return d!==null && d>=0 && d<=Number(m.alertDays||0);
    }).sort((a,b)=>daysUntil(a.endDate)-daysUntil(b.endDate));
  }
  async function dismissExpiryAlert(kind, id){
    askConfirm('이 항목을 만료 임박 목록에서 확인 처리할까요?', async ()=>{
      if(kind==='ctr'){
        const c = state.contracts.find(x=>x.id===id); if(!c) return;
        c.alertDismissed = true;
        const { error } = await sb.from('contracts').update({alert_dismissed:true}).eq('id', id);
        if(error){ alert('처리 실패: '+error.message); c.alertDismissed=false; return; }
      } else {
        const m = state.maintenance.find(x=>x.id===id); if(!m) return;
        m.alertDismissed = true;
        const { error } = await sb.from('maintenance_contracts').update({alert_dismissed:true}).eq('id', id);
        if(error){ alert('처리 실패: '+error.message); m.alertDismissed=false; return; }
      }
      render();
    }, '확인', false);
  }
  function compareValues(a,b){
    const an = Number(a), bn = Number(b);
    if(a!=='' && b!=='' && a!=null && b!=null && !isNaN(an) && !isNaN(bn)) return an-bn;
    return String(a||'').localeCompare(String(b||''),'ko');
  }
  function applySortState(list, tableKey, getters){
    const st = state.sortState[tableKey];
    if(!st || !st.key || !getters[st.key]) return list;
    const getter = getters[st.key];
    return [...list].sort((a,b)=>{ const cmp = compareValues(getter(a), getter(b)); return st.dir==='asc' ? cmp : -cmp; });
  }
  const PAGE_SIZE = 50;
  function paginateList(list, tableKey){
    if(!state.pagination[tableKey]) state.pagination[tableKey]=1;
    const totalPages = Math.max(1, Math.ceil(list.length/PAGE_SIZE));
    if(state.pagination[tableKey]>totalPages) state.pagination[tableKey]=totalPages;
    const page = state.pagination[tableKey];
    const start = (page-1)*PAGE_SIZE;
    return {items:list.slice(start, start+PAGE_SIZE), page, totalPages, total:list.length};
  }
  function renderPagination(tableKey, page, totalPages, total){
    if(totalPages<=1) return '';
    return `<div style="display:flex; justify-content:center; align-items:center; gap:12px; padding:12px; border-top:1px solid var(--grid);">
      <button class="btn-sm btn-ghost pageBtn" data-table="${tableKey}" data-page="1" ${page<=1?'disabled':''}>&laquo; 처음</button>
      <button class="btn-sm btn-ghost pageBtn" data-table="${tableKey}" data-page="${page-1}" ${page<=1?'disabled':''}>이전</button>
      <span style="font-size:12.5px; color:var(--ink-soft);">${page} / ${totalPages} 페이지 (전체 ${total}건)</span>
      <button class="btn-sm btn-ghost pageBtn" data-table="${tableKey}" data-page="${page+1}" ${page>=totalPages?'disabled':''}>다음</button>
      <button class="btn-sm btn-ghost pageBtn" data-table="${tableKey}" data-page="${totalPages}" ${page>=totalPages?'disabled':''}>마지막 &raquo;</button>
    </div>`;
  }
  function sortTh(label, tableKey, colKey, extraStyle){
    const st = state.sortState[tableKey] || {};
    const active = st.key===colKey;
    const arrow = active ? (st.dir==='asc'?'▲':'▼') : '▵';

  function bindTableCheckboxes(tableKey, rowClass, selectAllId){
    const set = state.selected[tableKey];
    const rowEls = [...document.querySelectorAll('.'+rowClass)];
    const visibleIds = rowEls.map(cb=>cb.dataset.id);
    const selAll = document.getElementById(selectAllId);
    if(selAll){
      selAll.checked = visibleIds.length>0 && visibleIds.every(id=>set.has(id));
      selAll.onchange = e=>{ visibleIds.forEach(id=> e.target.checked ? set.add(id) : set.delete(id)); render(); };
    }
    rowEls.forEach(cb=>{ cb.onchange = e=>{ if(e.target.checked) set.add(cb.dataset.id); else set.delete(cb.dataset.id); render(); }; });
  }
  function bindBulkDelete(tableKey, btnId, dbTable, stateField, label){
    const btn = document.getElementById(btnId);
    if(!btn) return;
    btn.onclick = ()=>{
      const set = state.selected[tableKey];
      if(set.size===0){ alert('삭제할 항목을 먼저 체크해주세요.'); return; }
      askConfirm(`선택한 ${label} ${set.size}건을 삭제할까요?`, async ()=>{
        const ids = [...set];
        for(const id of ids){ await sb.from(dbTable).delete().eq('id', id); }
        state[stateField] = state[stateField].filter(x=>!set.has(x.id));
        set.clear();
        render();
      });
    };
  }
  function bindFilterInput(id, tableKey){
    const el = document.getElementById(id); if(!el) return;
    let composing=false, timer=null;
    const scheduleRender = ()=>{ clearTimeout(timer); timer=setTimeout(()=>{ if(!composing) render(); }, 220); };
    el.addEventListener('compositionstart', ()=>{ composing=true; clearTimeout(timer); });
    el.addEventListener('compositionend', ()=>{ composing=false; state.filterText=el.value; state.selected[tableKey].clear(); state.pagination[tableKey]=1; scheduleRender(); });
    el.addEventListener('input', ()=>{ state.filterText=el.value; state.selected[tableKey].clear(); state.pagination[tableKey]=1; if(!composing) scheduleRender(); });
  }

  function bindCustomerSearchField(d, key, inputEl, suggEl){

  function bindRemarksLogField(d, key, logEl, inputEl){
    function splitEntries(){ return (d[key]||'').split('\n\n').filter(l=>l.trim()); }
    function refresh(){
      const lines = splitEntries();
      if(lines.length===0){
        logEl.innerHTML = '<span style="color:#b9c1c9;">등록된 비고가 없습니다.</span>';
      } else {
        logEl.innerHTML = lines.map((line,i)=>`<div style="display:flex; justify-content:space-between; align-items:flex-start; gap:6px; padding:3px 0; border-bottom:1px dashed var(--grid);"><span style="flex:1; white-space:pre-wrap;">${esc(line)}</span><button type="button" class="remarks-del-btn" data-idx="${i}" title="삭제" style="border:none; background:none; color:#b3261e; cursor:pointer; font-size:13px; font-weight:800; line-height:1; flex-shrink:0; padding:0 2px;">&times;</button></div>`).join('');
        logEl.querySelectorAll('.remarks-del-btn').forEach(btn=>{
          btn.onclick=()=>{ const arr = splitEntries(); arr.splice(Number(btn.dataset.idx),1); d[key] = arr.join('\n\n'); refresh(); };
        });
      }
    }
    refresh();
    function autoGrow(){ inputEl.rows = Math.min(6, Math.max(1, inputEl.value.split('\n').length)); }
    inputEl.addEventListener('input', autoGrow);
    inputEl.addEventListener('keydown', e=>{
      if(e.key==='Enter' && !e.shiftKey){
        e.preventDefault();
        const text = inputEl.value.trim();
        if(!text) return;
        const line = `[${todayStr()}] ${text}`;
        d[key] = d[key] ? line+'\n\n'+d[key] : line;
        inputEl.value=''; inputEl.rows = 1;
        refresh();
      }
    });
  }

  async function loadAll(){
    state.loading=true; render();
    // 고객사·담당자 데이터는 화면은 없지만 계약의 고객사 연결과 영업담당/관리자 권한 판정에 계속 사용됩니다.
    const [cu, cr, rp, mt] = await Promise.all([
      sb.from('customers').select('*').order('created_at',{ascending:false}),
      sb.from('contracts').select('*').order('created_at',{ascending:false}),
      sb.from('reps').select('*').order('created_at',{ascending:false}),
      sb.from('maintenance_contracts').select('*').order('created_at',{ascending:false}),
    ]);
    state.customers = (cu.data||[]).map(custFromRow);
    state.contracts = (cr.data||[]).map(ctrFromRow);
    state.reps = rp.data||[];
    state.maintenance = (mt.data||[]).map(mtFromRow);
    const myRep = state.reps.find(r=>r.email && state.userEmail && r.email.toLowerCase()===state.userEmail.toLowerCase());
    state.isAdmin = !!(myRep && myRep.is_admin);
    if(myRep && myRep.name) state.user = myRep.name;
    state.loading=false; render();
    checkExpiryNotifications();
  }

  function render(){
    const active = document.activeElement;
    let restoreId=null, selStart=null, selEnd=null;
    if(active && active.id && (active.tagName==='INPUT' || active.tagName==='TEXTAREA')){
      restoreId = active.id;
      try{ selStart=active.selectionStart; selEnd=active.selectionEnd; }catch(e){}
    }
    if(state.view==='login'){ root.innerHTML=renderLogin(); bindLogin(); return; }
    root.innerHTML=renderShell();
    bindShell();
    makeTablesResizable();
    if(restoreId){
      const el = document.getElementById(restoreId);
      if(el && el.focus){
        el.focus();
        if(selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
      }
    }
  }

  function makeTablesResizable(){
    document.querySelectorAll('.main table, .modal table').forEach(table=>{
      table.querySelectorAll('th').forEach(th=>{
        if(th.querySelector('.col-resize-handle')) return;
        if(getComputedStyle(th).position==='static') th.style.position='relative';
        const handle = document.createElement('span');
        handle.className='col-resize-handle';
        handle.style.cssText='position:absolute; top:0; right:0; width:6px; height:100%; cursor:col-resize; user-select:none; z-index:6;';
        th.appendChild(handle);
        handle.addEventListener('click', e=>e.stopPropagation());
        handle.addEventListener('mousedown', e=>{
          e.preventDefault(); e.stopPropagation();
          const startX = e.pageX, startWidth = th.offsetWidth;
          function onMove(ev){ th.style.width = Math.max(36, startWidth + (ev.pageX-startX)) + 'px'; }
          function onUp(){ document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); }
          document.addEventListener('mousemove', onMove);
          document.addEventListener('mouseup', onUp);
        });
      });
    });
  }

  function bindLogin(){
    let mode='login';
    const btn=document.getElementById('loginBtn'), emailEl=document.getElementById('loginEmail'), pwEl=document.getElementById('loginPassword'), nameEl=document.getElementById('loginName');
    const nameWrap=document.getElementById('signupNameWrap'), sub=document.getElementById('loginSub'), toggle=document.getElementById('toggleSignup'), errEl=document.getElementById('loginError');
    toggle.onclick=(e)=>{
      e.preventDefault();
      mode = mode==='login'?'signup':'login';
      nameWrap.style.display = mode==='signup'?'block':'none';
      sub.textContent = mode==='signup'?'이메일, 비밀번호, 이름을 입력해 가입하세요':'이메일과 비밀번호로 로그인하세요';
      btn.textContent = mode==='signup'?'가입하기':'로그인';
      toggle.textContent = mode==='signup'?'로그인으로 돌아가기':'회원가입';
      errEl.textContent='';
    };
    async function go(){
      const email=emailEl.value.trim(), password=pwEl.value;
      if(!email || !password){ errEl.textContent='이메일과 비밀번호를 입력하세요.'; return; }
      btn.disabled=true;
      if(mode==='signup'){
        const name=(nameEl.value||'').trim();
        const { data, error } = await sb.auth.signUp({ email, password, options:{ data:{ name: name||email } } });
        btn.disabled=false;
        if(error){ errEl.textContent=error.message; return; }
        if(!data.session){ errEl.textContent='가입 완료. 관리자가 이메일 인증을 켜둔 경우 인증 후 로그인해주세요.'; return; }
        state.user = name||email; state.userEmail = email; state.view='main'; loadAll();
      } else {
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        btn.disabled=false;
        if(error){ errEl.textContent='로그인 실패: '+error.message; return; }
        const u = data.user;
        state.user = (u.user_metadata && u.user_metadata.name) || u.email;
        state.userEmail = u.email;
        state.view='main'; loadAll();
      }
    }
    btn.onclick=go;
    pwEl.addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
    emailEl.focus();
  }

  function renderContracts(){
    let list = state.contracts;
    if(state.ctrStage!=='전체') list = list.filter(c=>c.stage===state.ctrStage);
    if(state.filterText) list = list.filter(c=>c.name.includes(state.filterText));
    if(state.ctrFilterBiz!=='전체') list = list.filter(c=>contractVendorList(c).includes(state.ctrFilterBiz));
    if(state.ctrFilterRep!=='전체') list = list.filter(c=>c.salesRep===state.ctrFilterRep);

  function bindContracts(){
    document.querySelectorAll('[data-stage]').forEach(el=>el.onclick=()=>{ state.ctrStage=el.dataset.stage; state.selected.contracts.clear(); state.pagination.contracts=1; render(); });
    bindFilterInput('ctrFilter','contracts');
    const bizSel=document.getElementById('ctrBizFilterSel'); if(bizSel) bizSel.onchange=e=>{ state.ctrFilterBiz=e.target.value; state.selected.contracts.clear(); state.pagination.contracts=1; render(); };
    const repSel=document.getElementById('ctrRepFilterSel'); if(repSel) repSel.onchange=e=>{ state.ctrFilterRep=e.target.value; state.selected.contracts.clear(); state.pagination.contracts=1; render(); };
    const reqSel=document.getElementById('ctrReqFilterSel'); if(reqSel) reqSel.onchange=e=>{ state.ctrFilterRequest=e.target.value; state.selected.contracts.clear(); state.pagination.contracts=1; render(); };
    const add=document.getElementById('addCtrBtn'); if(add) add.onclick=()=>openCtrModal(null);
    const excelInput=document.getElementById('ctrExcelInput');
    if(excelInput) excelInput.onchange=(e)=>{
      const file=e.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = async (ev)=>{
        try{
          const wb = XLSX.read(new Uint8Array(ev.target.result),{type:'array', cellDates:true});
          const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:''});
          const newCtrs = []; const newCustsAuto = [];
          function findOrCreateCustomer(nameStr){
            let cust = state.customers.find(c=>c.name===nameStr) || newCustsAuto.find(c=>c.name===nameStr);
            if(!cust){
              cust = makeCustomer(nameStr, [...state.customers,...newCustsAuto]);
              newCustsAuto.push(cust);
            }
            return cust;
          }
          rows.forEach((r,idx)=>{
            const name = String(r['계약명']||'').trim();
            const custNameStr = String(r['고객사명']||'').trim();
            if(!name || !custNameStr) return;
            const cust = findOrCreateCustomer(custNameStr);
            newCtrs.push({
              id:'cr_'+Date.now()+'_'+idx, code:nextCode('CR',[...state.contracts,...newCtrs]),
              name, customerId:cust.id, endUserName:String(r['앤드유저']||'').trim(), bizType:String(r['벤더사']||'').trim(),
              stage:STAGES_CTR[0], request:'없음',
              contractDate: r['계약일'] ? excelDateToStr(r['계약일']) : todayStr(), amount:Number(r['계약금액'])||0, profitAmount:Number(r['이익금액'])||0,
              expiryDate: excelDateToStr(r['만료일']), alertDays:30,
              buyerContact:String(r['구매담당자']||'').trim(), buyerEmail:String(r['구매담당자이메일']||'').trim(),
              invoiceDate: excelDateToStr(r['계산서발행일자']),
              salesRep:String(r['영업담당']||state.user).trim(), remarks:String(r['비고']||'').trim(),
              opportunityId:null, regDate:todayStr()
            });
          });
          if(newCtrs.length===0){ alert('등록할 데이터를 찾지 못했습니다. 계약명·고객사명을 확인해주세요.'); return; }
          if(newCustsAuto.length>0){
            const { error: custErr } = await sb.from('customers').insert(newCustsAuto.map(custToRow));
            if(custErr){ alert('고객사 자동생성 실패: '+custErr.message); return; }
            state.customers.unshift(...newCustsAuto);
          }
          const { error } = await sb.from('contracts').insert(newCtrs.map(ctrToRow));
          if(error){ alert('일괄등록 실패: '+error.message); return; }
          state.contracts.unshift(...newCtrs);
          showToast(newCtrs.length+'건 일괄등록되었습니다.'+(newCustsAuto.length>0?` (신규 고객사 ${newCustsAuto.length}건 자동생성)`:''));
          render();
        }catch(err){ alert('엑셀 파일을 읽는 중 오류가 발생했습니다.'); }
        finally{ excelInput.value=''; }
      };
      reader.readAsArrayBuffer(file);
    };
    document.querySelectorAll('.ctrNameToggle').forEach(el=>el.onclick=()=>{ state.ctrExpandedId = state.ctrExpandedId===el.dataset.id ? null : el.dataset.id; render(); });
    document.querySelectorAll('.editCtrBtn').forEach(b=>b.onclick=()=>openCtrModal(state.contracts.find(c=>c.id===b.dataset.id)));
    bindTableCheckboxes('contracts','ctrRowCheck','ctrSelectAll');
    bindBulkDelete('contracts','ctrBulkDelBtn','contracts','contracts','계약');
    const mergeBtn=document.getElementById('ctrMergeBtn'); if(mergeBtn) mergeBtn.onclick=()=>{
      if(state.selected.contracts.size<2){ alert('합칠 계약을 2건 이상 체크해주세요.'); return; }
      const selectedContracts = state.contracts.filter(c=>state.selected.contracts.has(c.id));
      const firstCust = selectedContracts[0].customerId;
      if(selectedContracts.some(c=>c.customerId!==firstCust)){ alert('고객사가 서로 다른 계약은 합칠 수 없습니다. 같은 고객사의 계약만 선택해주세요.'); return; }
      state.mergePickerOpen=true; render();
    };
  }
  function makeCustomer(nameStr, existing){

  function renderMergePicker(){

    return `<div class="modal-bg" id="mergePickBg"><div class="modal">
      <div class="modal-head"><h3>계약 합치기</h3><button class="modal-close" id="mergePickClose">&times;</button></div>

        <p class="hint" style="margin-top:0;">기준이 될 계약코드를 하나 선택하세요. 계약금액·이익금액이 합산되고 나머지 계약은 삭제됩니다.</p>
        ${selected.map((c,i)=>`<label class="pick-row" style="cursor:pointer; display:flex; align-items:center; gap:10px;">
          <input type="radio" name="mergeTarget" value="${c.id}" ${i===0?'checked':''}/>

  function bindMergePicker(){
    const bg=document.getElementById('mergePickBg'), close=document.getElementById('mergePickClose'), cancel=document.getElementById('mergePickCancel'), confirm=document.getElementById('mergePickConfirm');
    const closeFn=()=>{ state.mergePickerOpen=false; render(); };
    if(close) close.onclick=closeFn;
    if(cancel) cancel.onclick=closeFn;
    if(bg) bg.addEventListener('click', e=>{ if(e.target.id==='mergePickBg') closeFn(); });
    if(confirm) confirm.onclick=async ()=>{
      const targetRadio = document.querySelector('input[name="mergeTarget"]:checked');
      if(!targetRadio) return;
      const targetId = targetRadio.value;
      await mergeContracts(targetId, [...state.selected.contracts].filter(id=>id!==targetId));
    };
  }
  async function mergeContracts(targetId, otherIds){
    const target = state.contracts.find(c=>c.id===targetId);
    if(!target) return;
    const others = otherIds.map(id=>state.contracts.find(c=>c.id===id)).filter(Boolean);
    if(others.some(c=>c.customerId!==target.customerId)){ alert('고객사가 서로 다른 계약은 합칠 수 없습니다. 같은 고객사의 계약만 선택해주세요.'); return; }
    target.amount = Number(target.amount||0) + others.reduce((s,c)=>s+Number(c.amount||0),0);
    target.profitAmount = Number(target.profitAmount||0) + others.reduce((s,c)=>s+Number(c.profitAmount||0),0);
    const vendors = new Set(contractVendorList(target)); others.forEach(c=>contractVendorList(c).forEach(v=>vendors.add(v)));
    target.bizType = [...vendors].join(', ');
    const { error } = await sb.from('contracts').update(ctrToRow(target)).eq('id', target.id);
    if(error){ alert('계약 합치기 실패: '+error.message); return; }
    for(const c of others){ await sb.from('contracts').delete().eq('id', c.id); }
    state.contracts = state.contracts.filter(c=>c.id===target.id || !otherIds.includes(c.id));
    state.selected.contracts = new Set();
    state.mergePickerOpen = false;
    showToast(target.code+' 로 합쳐졌습니다.');
  }

    const repOpts = [...new Set(state.maintenance.map(m=>m.salesRep).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'));
    list = applySortState(list, 'maintenance', {code:m=>contractCode(m.contractId), name:m=>m.name, customer:m=>contractCustomerName(m.contractId), endUser:m=>contractEndUserName(m.contractId), vendor:m=>contractVendor(m.contractId), startDate:m=>m.startDate, endDate:m=>m.endDate, billingCycle:m=>m.billingCycle, amount:m=>m.amount, profitAmount:m=>m.profitAmount, renewalType:m=>m.renewalType, salesRep:m=>m.salesRep});
    const totalAmt = list.reduce((s,m)=>s+Number(m.amount||0),0);
    const totalProfit = list.reduce((s,m)=>s+Number(m.profitAmount||0),0);
    const expiring = expiringMaintenance();
    return `
      <div class="page-title">유지보수관리</div>

  function openMtModal(m, fromContract){
    const isNew=!m;
    let base = {id:'mt_'+Date.now(), name:'', contractId:'', startDate:todayStr(), endDate:'', billingCycle:BILLING_CYCLES[0], amount:0, profitAmount:0, renewalType:RENEWAL_TYPES[0], salesRep:state.user, alertDays:30, remarks:'', regDate:todayStr()};
    if(fromContract){ base = {...base, name:fromContract.name+' 유지보수', contractId:fromContract.id, salesRep:fromContract.salesRep, amount:fromContract.amount||0, profitAmount:fromContract.profitAmount||0}; }
    const data = m? {...m} : base;
    const linkedContract = state.contracts.find(x=>x.id===data.contractId);
    state.modal = {
      type:'maintenance', title: isNew?'유지보수 계약 추가':'유지보수 계약 수정',
      data, isNew,
      infoLine: linkedContract ? `연결된 계약: ${linkedContract.code} · ${linkedContract.name} (${custName(linkedContract.customerId)})` : '',
      fields:[
        {k:'name',label:'유지보수명',type:'text'},
        {k:'startDate',label:'유지보수 시작일',type:'date'},
        {k:'endDate',label:'유지보수 종료일',type:'date'},
        {k:'alertDays',label:'만료 알림 (며칠 전부터 표시)',type:'number'},
        {k:'billingCycle',label:'결제주기',type:'select',opts:BILLING_CYCLES},
        {k:'amount',label:'유지보수 금액',type:'number'},
        {k:'profitAmount',label:'이익금액',type:'number'},
        {k:'renewalType',label:'갱신여부',type:'select',opts:RENEWAL_TYPES},
        {k:'salesRep',label:'담당자',type:'select',opts:buildRepOpts(data.salesRep),disabled:!state.isAdmin},
        {k:'remarks',label:'비고',type:'remarkslog'},
      ]
    };
    render();
  }
  function renderMtPicker(){

        list.map(c=>`<div class="pick-row"><div class="info"><div class="name">${esc(c.name)}</div><div class="sub">${esc(custName(c.customerId))} · ${esc(c.bizType)} · ${won(c.amount)}</div></div><button class="btn-sm pickCtrBtn" data-id="${c.id}">이 계약으로 유지보수 생성</button></div>`).join('')}

      const ctr = state.contracts.find(c=>c.id===b.dataset.id);

  function renderAttachViewModal(){
    const {kind, id} = state.attachViewModal;
    const rec = kind==='ctr' ? state.contracts.find(x=>x.id===id) : state.maintenance.find(x=>x.id===id);
    if(!rec || !rec.attachmentUrl) return '';
    const url = rec.attachmentUrl, name = rec.attachmentName||'첨부파일';
    const ext = (name.split('.').pop()||'').toLowerCase();
    let body;
    if(ext==='pdf'){
      body = `<iframe src="${esc(url)}" style="width:100%; height:82vh; border:1px solid var(--grid);"></iframe>`;
    } else if(['png','jpg','jpeg','gif','webp'].includes(ext)){
      body = `<div style="max-height:82vh; overflow:auto; text-align:center;"><img src="${esc(url)}" style="max-width:100%;"/></div>`;
    } else {
      body = `<div style="text-align:center; padding:60px 30px;"><p style="margin-bottom:14px;">미리보기를 지원하지 않는 파일 형식입니다.</p><a href="${esc(url)}" target="_blank" class="btn-primary" style="display:inline-block; width:auto; padding:10px 20px; text-decoration:none;">${esc(name)} 다운로드</a></div>`;
    }
    return `<div class="modal-bg" id="attachViewBg" style="z-index:300; padding:20px 0;"><div class="modal" style="width:96vw; max-width:1400px;">
      <div class="modal-head"><h3 style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(name)}</h3>
        <div style="display:flex; gap:8px; align-items:center;">
          <button class="icon-btn danger" id="attachDeleteBtn" title="첨부 삭제">&minus;</button>
          <button class="modal-close" id="attachViewClose">&times;</button>
        </div>
      </div>
      <div class="modal-body" style="max-height:86vh; padding:14px;">${body}</div>
    </div></div>`;
  }

  // ================= GENERIC MODAL (contract / maintenance) =================
  function renderModal(){
    const m = state.modal, d = m.data;
    return `<div class="modal-bg" id="genModalBg"><div class="modal">
      <div class="modal-head"><h3>${esc(m.title)}</h3><button class="modal-close" id="genModalClose">&times;</button></div>
      <div class="modal-body">
        ${m.infoLine?`<div class="hint" style="background:var(--header-fill); padding:8px 10px; border-radius:var(--radius); margin-bottom:14px;">${esc(m.infoLine)}</div>`:''}
        ${m.fields.map(f=>{
          const val = d[f.k];
          if(f.type==='select'){
            return `<div class="field"><label>${f.label}</label><select data-k="${f.k}" ${f.disabled?'disabled':''}>
              ${f.opts.map(o=>`<option value="${esc(o)}" ${String(val)===String(o)?'selected':''}>${esc(o)}</option>`).join('')}
            </select>${f.disabled?'<p class="hint">일반 담당자는 본인 이름으로 고정됩니다.</p>':''}</div>`;
          }
          if(f.type==='remarkslog'){
            return `<div class="field"><label>${f.label}</label>
              <div id="genRemarksLog" style="border:1px solid var(--grid-strong); border-radius:var(--radius); padding:8px 10px; max-height:120px; overflow-y:auto; font-size:12.5px; margin-bottom:6px; background:#fbfbfa;"></div>
              <textarea id="genRemarksInput" class="omField" rows="1" placeholder="비고를 입력하고 Enter를 누르세요 (줄바꿈은 Shift+Enter)"></textarea>
            </div>`;
          }
          if(f.type==='customersearch'){
            return `<div class="field" style="position:relative;"><label>${f.label}</label>
              <input type="text" id="cs_${f.k}" class="omField" placeholder="고객사명을 입력하세요" value="${val?esc(custName(val)):esc(d._newCustomerName||'')}" autocomplete="off"/>
              <div id="cs_${f.k}_sugg" style="display:none; position:absolute; top:100%; left:0; right:0; background:#fff; border:1px solid var(--grid-strong); max-height:190px; overflow-y:auto; z-index:50; border-radius:0 0 var(--radius) var(--radius); box-shadow:0 6px 14px rgba(0,0,0,.12);"></div>
            </div>`;
          }
          return `<div class="field"><label>${f.label}</label><input data-k="${f.k}" type="${f.type}" value="${esc(val)}"/></div>`;
        }).join('')}
      </div>
      <div class="modal-actions">
        <button class="btn-sm btn-ghost" id="genModalCancel">취소</button>
        <button class="btn-primary" style="width:auto; padding:8px 20px;" id="genModalSave">저장</button>
      </div>
    </div></div>`;
  }
  function bindModal(){
    const m = state.modal; if(!m) return;
    const bg=document.getElementById('genModalBg'), close=document.getElementById('genModalClose'), cancel=document.getElementById('genModalCancel'), save=document.getElementById('genModalSave');
    const closeFn=()=>{ state.modal=null; render(); };
    if(close) close.onclick=closeFn;
    if(cancel) cancel.onclick=closeFn;
    if(bg) bg.addEventListener('click', e=>{ if(e.target.id==='genModalBg') closeFn(); });
    document.querySelectorAll('[data-k]').forEach(el=>{
      el.addEventListener(el.tagName==='SELECT'?'change':'input', e=>{ m.data[e.target.dataset.k]=e.target.value; });
    });
    const remarksLogField = m.fields.find(f=>f.type==='remarkslog');
    if(remarksLogField){
      const logEl=document.getElementById('genRemarksLog'), inputEl=document.getElementById('genRemarksInput');
      if(logEl && inputEl) bindRemarksLogField(m.data, remarksLogField.k, logEl, inputEl);
    }
    m.fields.filter(f=>f.type==='customersearch').forEach(f=>{
      bindCustomerSearchField(m.data, f.k, document.getElementById('cs_'+f.k), document.getElementById('cs_'+f.k+'_sugg'));
    });
    if(save) save.onclick=async ()=>{
      const d = m.data;
      if(!String(d.name||'').trim()){ alert('이름을 입력하세요.'); return; }
      m.fields.forEach(f=>{ if(f.type==='number') d[f.k]=Number(d[f.k])||0; });
      // 계약: 목록에 없는 고객사명을 입력했으면 새 고객사로 등록 후 연결
      if(m.type==='contract' && !d.customerId && d._newCustomerName){
        const existing = state.customers.find(c=>c.name===d._newCustomerName);
        if(existing){ d.customerId = existing.id; }
        else {
          const nc = makeCustomer(d._newCustomerName, state.customers);
          const { error: ce } = await sb.from('customers').insert(custToRow(nc));
          if(ce){ alert('고객사 등록 실패: '+ce.message); return; }
          state.customers.unshift(nc);
          d.customerId = nc.id;
        }
      }
      delete d._newCustomerName;
      const cfg = m.type==='contract'
        ? {table:'contracts', field:'contracts', toRow:ctrToRow}
        : {table:'maintenance_contracts', field:'maintenance', toRow:mtToRow};
      const row = cfg.toRow(d);
      if(m.isNew){
        const { error } = await sb.from(cfg.table).insert(row);
        if(error){ alert('저장 실패: '+error.message); return; }
        state[cfg.field].unshift(d);
      } else {
        const { error } = await sb.from(cfg.table).update(row).eq('id', d.id);
        if(error){ alert('저장 실패: '+error.message); return; }
        const i=state[cfg.field].findIndex(x=>x.id===d.id); if(i>-1) state[cfg.field][i]=d;
      }
      state.modal=null;
      showToast('저장되었습니다.');
    };
  }

  // ================= SHELL BINDING =================
  function bindShell(){
    if(state.loading) return;
    document.querySelectorAll('.nav-item').forEach(el=>{ el.onclick=()=>{ state.tab=el.dataset.tab; state.filterText=''; state.ctrStage='전체'; Object.keys(state.selected).forEach(k=>state.selected[k].clear()); Object.keys(state.pagination).forEach(k=>state.pagination[k]=1); render(); }; });
    document.querySelectorAll('.sort-th').forEach(el=>{
      el.onclick=()=>{
        const table = el.dataset.table, col = el.dataset.col;
        const st = state.sortState[table] || (state.sortState[table]={key:null,dir:'asc'});
        if(st.key===col){ st.dir = st.dir==='asc'?'desc':'asc'; } else { st.key=col; st.dir='asc'; }
        render();
      };
    });
    document.querySelectorAll('.alertToggle').forEach(el=>{ el.onclick=()=>{ const k=el.dataset.kind; state.alertCollapsed[k] = !state.alertCollapsed[k]; render(); }; });
    document.querySelectorAll('.alertDismissBtn').forEach(el=>{ el.onclick=(e)=>{ e.stopPropagation(); dismissExpiryAlert(el.dataset.kind, el.dataset.id); }; });
    document.querySelectorAll('.pageBtn').forEach(btn=>{ btn.onclick=()=>{ state.pagination[btn.dataset.table]=Number(btn.dataset.page); render(); }; });
    document.querySelectorAll('.attachBtn').forEach(btn=>{
      btn.onclick=()=>{
        state.attachUploadTarget = {kind:btn.dataset.kind, id:btn.dataset.id};
        const fileInput = document.getElementById('attachFileInput');
        if(fileInput) fileInput.click();
      };
    });
    const attachFileInput = document.getElementById('attachFileInput');
    if(attachFileInput) attachFileInput.onchange = async (e)=>{
      const file = e.target.files[0]; if(!file || !state.attachUploadTarget) return;
      const { kind, id } = state.attachUploadTarget;
      const table = kind==='ctr' ? 'contracts' : 'maintenance_contracts';
      const path = `${kind}/${id}/${Date.now()}_${file.name}`;
      const { error: upErr } = await sb.storage.from('attachments').upload(path, file, {upsert:true});
      if(upErr){ alert('업로드 실패: '+upErr.message); attachFileInput.value=''; return; }
      const { data: urlData } = sb.storage.from('attachments').getPublicUrl(path);
      const url = urlData.publicUrl;
      const { error: dbErr } = await sb.from(table).update({attachment_url:url, attachment_name:file.name, attachment_path:path}).eq('id', id);
      if(dbErr){ alert('저장 실패: '+dbErr.message); attachFileInput.value=''; return; }
      const arr = kind==='ctr' ? state.contracts : state.maintenance;
      const rec = arr.find(x=>x.id===id);
      if(rec){ rec.attachmentUrl=url; rec.attachmentName=file.name; rec.attachmentPath=path; }
      attachFileInput.value='';
      showToast('첨부파일이 등록되었습니다.');
    };
    document.querySelectorAll('.attachViewBtn').forEach(btn=>{ btn.onclick=()=>{ state.attachViewModal = {kind:btn.dataset.kind, id:btn.dataset.id}; render(); }; });
    const attachViewBg=document.getElementById('attachViewBg'), attachViewClose=document.getElementById('attachViewClose'), attachDeleteBtn=document.getElementById('attachDeleteBtn');
    const closeAttachView=()=>{ state.attachViewModal=null; render(); };
    if(attachViewClose) attachViewClose.onclick=closeAttachView;
    if(attachViewBg) attachViewBg.addEventListener('click', e=>{ if(e.target.id==='attachViewBg') closeAttachView(); });
    if(attachDeleteBtn) attachDeleteBtn.onclick=()=>{
      const { kind, id } = state.attachViewModal;
      askConfirm('첨부된 문서를 삭제할까요?', async ()=>{
        const table = kind==='ctr' ? 'contracts' : 'maintenance_contracts';
        const arr = kind==='ctr' ? state.contracts : state.maintenance;
        const rec = arr.find(x=>x.id===id);
        if(rec && rec.attachmentPath){ await sb.storage.from('attachments').remove([rec.attachmentPath]); }
        await sb.from(table).update({attachment_url:null, attachment_name:null, attachment_path:null}).eq('id', id);
        if(rec){ rec.attachmentUrl=''; rec.attachmentName=''; rec.attachmentPath=''; }
        state.attachViewModal=null;
        showToast('첨부파일이 삭제되었습니다.');
      });
    };
    const notifyBtn=document.getElementById('notifyToggleBtn');
    if(notifyBtn) notifyBtn.onclick=async ()=>{
      const p = notifyPermission();
      if(p==='denied'){ alert('알림이 차단되어 있어요.\n브라우저 주소창 왼쪽 자물쇠 아이콘 → 사이트 권한 → 알림을 "허용"으로 바꾼 뒤 새로고침해주세요.'); return; }
      if(p==='default'){ await Notification.requestPermission(); render(); if(notifyPermission()==='granted'){ showToast('만료 알림이 켜졌습니다.'); checkExpiryNotifications(true); } return; }
      checkExpiryNotifications(true);
    };
    const logout=document.getElementById('logoutBtn'); if(logout) logout.onclick=async ()=>{ await sb.auth.signOut(); state.view='login'; state.user=null; render(); };
    const excelBtn=document.getElementById('excelExportBtn');
    if(excelBtn) excelBtn.onclick=(e)=>{ e.stopPropagation(); state.excelMenuOpen = !state.excelMenuOpen; render(); };
    document.querySelectorAll('.excelMenuItem').forEach(btn=>{
      btn.onclick=(e)=>{
        e.stopPropagation();
        state.excelMenuOpen=false;
        if(btn.dataset.action==='export'){ exportCurrentPage(); render(); }
        else if(btn.dataset.action==='template'){ downloadTemplate(); render(); }
        else { const input = document.getElementById('ctrExcelInput'); if(input) input.click(); }
      };
    });
    if(state.excelMenuOpen){
      document.addEventListener('click', function closeExcelMenu(e){
        if(!e.target.closest('#excelMenuBox') && e.target.id!=='excelExportBtn'){ state.excelMenuOpen=false; render(); }
      }, {once:true});
    }
    if(state.tab==='contracts') bindContracts();
    if(state.tab==='maintenance') bindMaintenance();
    bindModal();
    bindMtPicker();
    bindMergePicker();
    bindConfirm();
  }

  async function init(){
    const { data } = await sb.auth.getSession();
    if(data && data.session){
      const u = data.session.user;
      state.user = (u.user_metadata && u.user_metadata.name) || u.email;
      state.userEmail = u.email;
      state.view='main';
      await loadAll();
    } else {
      render();
    }
  }
  init();
  // 페이지를 열어둔 동안 1시간마다 다시 확인 (같은 계약은 하루 한 번만 알림)
  setInterval(()=>{ if(state.view==='main' && !state.loading) checkExpiryNotifications(); }, 60*60*1000);
})();
</script>
</body>
</html>
