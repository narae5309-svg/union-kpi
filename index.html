<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>UNION 사업관리</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg:#f4f7f8; --grid:#dbe4e6; --grid-strong:#b7c6c9; --header-fill:#e3f6f5;
    --accent:#0fb4ae; --accent-dark:#0b8f8a; --accent2:#2d6ae3;
    --warn:#b3261e; --warn-bg:#fdecea; --orange:#c25e00; --orange-bg:#fff0e0; --gold:#8a6d1f; --gold-bg:#fff6d9;
    --ink:#1f2b2b; --ink-soft:#5c7273; --card:#ffffff; --radius:6px;
  }
  *{box-sizing:border-box;} body{margin:0; background:var(--bg);}
  .app{font-family:'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif; color:var(--ink); background:var(--bg); min-height:100vh; font-size:13px;}
  .num{font-family:Consolas,'SF Mono',monospace; font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap;}
  h1,h2,h3,h4{margin:0; font-weight:600;}
  button{font-family:inherit;}

  /* login */
  .login-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(160deg,#eaf7f6 0%,#f4f7f8 55%,#eef2f0 100%); padding:16px;}
  .login-card{background:#fff; width:380px; max-width:100%; padding:44px 36px; border-radius:14px; box-shadow:0 20px 45px rgba(15,180,174,.14), 0 2px 8px rgba(0,0,0,.04); text-align:center;}
  .login-card .logo{font-size:26px; font-weight:800; letter-spacing:1px; margin-bottom:22px; font-style:italic;}
  .login-card h1{font-size:17px; font-weight:700;}
  .login-card p.sub{color:var(--ink-soft); font-size:12px; margin:6px 0 24px;}
  .login-card input{width:100%; padding:12px 14px; font-size:14px; border:1px solid transparent; background:#eef4f5; margin-bottom:12px; border-radius:8px; font-family:inherit;}
  .login-card input:focus{outline:none; border-color:var(--accent); background:#fff;}

  .btn-primary{background:var(--accent); color:#fff; border:none; padding:9px 16px; font-size:13px; font-weight:700; cursor:pointer; border-radius:var(--radius);}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-primary.block{width:100%; padding:11px; font-size:14px;}
  .btn-sm{background:#fff; border:1.5px solid var(--accent); color:var(--accent-dark); font-weight:700; padding:5px 11px; cursor:pointer; font-size:12px; border-radius:var(--radius); white-space:nowrap;}
  .btn-sm:hover{background:var(--accent); color:#fff;}
  .btn-sm.ghost{border-color:var(--grid-strong); color:var(--ink-soft);}
  .btn-sm.ghost:hover{background:var(--ink-soft); color:#fff; border-color:var(--ink-soft);}
  .btn-sm.danger{border-color:var(--warn); color:var(--warn);}
  .btn-sm.danger:hover{background:var(--warn); color:#fff;}
  .btn-sm.blue{border-color:var(--accent2); color:var(--accent2);}
  .btn-sm.blue:hover{background:var(--accent2); color:#fff;}
  .btn-sm:disabled{opacity:.4; cursor:default;}
  .icon-btn{width:26px; height:26px; display:inline-flex; align-items:center; justify-content:center; border-radius:4px; border:1.5px solid var(--accent); background:#fff; color:var(--accent-dark); cursor:pointer; font-size:12px; padding:0; line-height:1; vertical-align:middle; position:relative;}
  .icon-btn:hover{background:var(--accent); color:#fff;}
  .icon-btn.danger{border-color:var(--warn); color:var(--warn); font-weight:800; font-size:15px;}
  .icon-btn.danger:hover{background:var(--warn); color:#fff;}
  .icon-btn .cnt-dot{position:absolute; top:-7px; right:-7px; background:var(--warn); color:#fff; border-radius:8px; font-size:9px; padding:1px 4px; line-height:1.2; font-weight:700;}

  /* shell */
  .shell{display:flex; min-height:100vh;}
  .sidebar{width:196px; background:#1b2733; color:#cfd6dd; flex-shrink:0; display:flex; flex-direction:column; padding:20px 0; position:sticky; top:0; height:100vh;}
  .brand{padding:0 18px 16px; border-bottom:1px solid #2e3c4a; margin-bottom:6px;}
  .brand h2{font-size:16px; color:#fff; font-style:italic; letter-spacing:.5px;}
  .brand .who{font-size:11px; color:#8b95a1; margin-top:5px;}
  .nav{display:flex; flex-direction:column;}
  .nav-item{padding:10px 18px; cursor:pointer; font-size:13px; border-left:3px solid transparent; display:flex; justify-content:space-between; align-items:center; white-space:nowrap;}
  .nav-item:hover{background:#243342;}
  .nav-item.active{background:#243342; color:#fff; border-left-color:var(--accent);}
  .nav-group{padding:10px 18px; font-size:13px; color:#cfd6dd; cursor:pointer; display:flex; justify-content:space-between; align-items:center; border-left:3px solid transparent; user-select:none;}
  .nav-group:hover{background:#243342;}
  .nav-group .caret{font-size:10px; color:#8b95a1;}
  .nav-item.sub{padding-left:30px;}
  .tab-btn.warn-tab:not(.active){border-color:#f0b5b0; color:var(--warn);}
  .nav-badge{background:var(--warn); color:#fff; border-radius:10px; font-size:10.5px; font-weight:700; padding:1px 7px; min-width:20px; text-align:center;}
  .nav-badge.soft{background:#3a4b5c; color:#dfe6ec;}
  .side-bottom{margin-top:auto;}
  .notify-btn{margin:10px 14px 0; padding:7px 10px; border:1px solid #2e3c4a; border-radius:var(--radius); font-size:12px; cursor:pointer;}
  .notify-btn:hover{background:#243342;}
  .nav-footer{padding:12px 18px 0; margin-top:12px; border-top:1px solid #2e3c4a;}
  .logout-link{color:#8b95a1; font-size:11px; cursor:pointer;}
  .logout-link:hover{color:#fff;}

  .main{flex:1; padding:24px 30px 80px; min-width:0;}
  .page-head{display:flex; justify-content:space-between; align-items:flex-end; gap:12px; margin-bottom:18px; flex-wrap:wrap;}
  .page-title{font-size:19px; font-weight:700;}
  .page-sub{color:var(--ink-soft); font-size:12px; margin-top:3px;}

  .card{background:var(--card); border:1px solid var(--grid); border-radius:var(--radius); padding:18px; margin-bottom:16px;}
  .card.flush{padding:0; overflow-x:auto;}
  .card-title{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--accent-dark); margin-bottom:12px; display:flex; justify-content:space-between; align-items:center;}

  .setup-banner{background:var(--gold-bg); border:1px solid #e3c873; color:#5d4a12; border-radius:var(--radius); padding:12px 16px; margin-bottom:16px; font-size:12.5px; line-height:1.6;}

  /* toolbar & tabs */
  .toolbar{display:flex; gap:8px; margin-bottom:12px; align-items:center; flex-wrap:wrap;}
  .toolbar .spacer{flex:1;}
  .toolbar input, .toolbar select{padding:7px 9px; border:1px solid var(--grid-strong); border-radius:var(--radius); font-family:inherit; font-size:12.5px; background:#fff;}
  .chk{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; color:var(--ink-soft); cursor:pointer; user-select:none;}
  .tabs{display:flex; gap:4px; margin-bottom:12px; flex-wrap:wrap;}
  .tab-btn{padding:7px 14px; background:#fff; border:1px solid var(--grid); cursor:pointer; font-size:12.5px; font-weight:600; color:var(--ink-soft); border-radius:16px;}
  .tab-btn .cnt{color:var(--accent-dark); font-family:Consolas,monospace; margin-left:3px;}
  .tab-btn.active{background:var(--accent-dark); color:#fff; border-color:var(--accent-dark);}
  .tab-btn.active .cnt{color:#d8fffc;}

  /* tables */
  table{width:100%; border-collapse:separate; border-spacing:0; font-size:12.5px;}
  th{text-align:left; padding:8px 7px; background:var(--header-fill); border-bottom:1px solid var(--grid); font-weight:700; color:var(--accent-dark); font-size:11.5px; white-space:nowrap;}
  td{padding:7px; border-bottom:1px solid var(--grid); vertical-align:middle;}
  tbody tr:hover > td{background:#effaf9;}
  tr.row-warn > td{background:#fff8f0;}
  tr.row-over > td{background:#fdf1f0;}
  tr.detail > td{background:#fafcfb !important; padding:0;}
  tr.total > td{font-weight:700; background:#f7fbfb;}
  .sort-th{cursor:pointer; user-select:none; display:inline-flex; align-items:center; gap:4px;}
  .sort-arrow{font-size:8px; color:#c3ccce;}
  .sort-arrow.on{color:var(--accent-dark);}
  .link{cursor:pointer; color:var(--accent-dark); text-decoration:underline dotted; text-underline-offset:3px;}
  .muted{color:var(--ink-soft);}
  .small{font-size:11.5px;}
  .nowrap{white-space:nowrap;}
  .clip{max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .detail-box{padding:14px 18px; font-size:12.5px; line-height:1.6;}
  .detail-box table{border:1px solid var(--grid); margin:6px 0 10px; background:#fff;}
  .detail-box th{background:#f2f7f7;}
  .detail-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:4px 18px; margin-bottom:8px;}

  .badge{display:inline-block; padding:2px 8px; border-radius:10px; font-size:10.5px; font-weight:700; white-space:nowrap;}
  .badge.blue{background:#e8edfb; color:var(--accent2);}
  .badge.green{background:#e3f4ee; color:var(--accent-dark);}
  .badge.warn{background:var(--warn-bg); color:var(--warn);}
  .badge.orange{background:var(--orange-bg); color:var(--orange);}
  .badge.gold{background:var(--gold-bg); color:var(--gold);}
  .badge.gray{background:#eef1f2; color:#5c6b6c;}
  .badge.purple{background:#f0eafc; color:#6a3fc1;}

  .empty{text-align:center; padding:36px 20px; color:var(--ink-soft); font-size:12.5px;}
  .pager{display:flex; justify-content:center; align-items:center; gap:10px; padding:12px; border-top:1px solid var(--grid);}

  /* dashboard */
  .kpis{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:16px;}
  .kpi{background:#fff; border:1px solid var(--grid); border-radius:var(--radius); padding:14px 16px; cursor:default;}
  .kpi.click{cursor:pointer;}
  .kpi.click:hover{border-color:var(--accent);}
  .kpi .lbl{font-size:11.5px; color:var(--ink-soft); font-weight:600;}
  .kpi .val{font-size:22px; font-weight:800; margin-top:6px; font-family:Consolas,'SF Mono',monospace;}
  .kpi .sub{font-size:11px; color:var(--ink-soft); margin-top:3px;}
  .kpi.alert .val{color:var(--warn);}
  .board{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px;}
  .lane{background:#f7f9f9; border:1px solid var(--grid); border-radius:var(--radius); padding:10px; min-height:120px;}
  .lane-head{display:flex; justify-content:space-between; align-items:center; font-weight:700; font-size:12.5px; padding:2px 4px 10px;}
  .lane-head .count{font-family:Consolas,monospace; font-size:12px; padding:1px 8px; border-radius:10px;}
  .lane.over .lane-head{color:var(--warn);} .lane.over .count{background:var(--warn); color:#fff;}
  .lane.w1 .lane-head{color:var(--orange);} .lane.w1 .count{background:var(--orange); color:#fff;}
  .lane.m1 .lane-head{color:var(--gold);} .lane.m1 .count{background:#d9b23c; color:#fff;}
  .lane.m2 .lane-head{color:var(--ink-soft);} .lane.m2 .count{background:#9aa9ab; color:#fff;}
  .lane-list{max-height:430px; overflow-y:auto; display:flex; flex-direction:column; gap:8px;}
  .rcard{background:#fff; border:1px solid var(--grid); border-radius:var(--radius); padding:9px 10px; border-left:4px solid var(--grid-strong);}
  .lane.over .rcard{border-left-color:var(--warn);}
  .lane.w1 .rcard{border-left-color:var(--orange);}
  .lane.m1 .rcard{border-left-color:#d9b23c;}
  .rcard .t{font-weight:700; font-size:12.5px; margin:4px 0 2px; word-break:keep-all;}
  .rcard .s{font-size:11.5px; color:var(--ink-soft);}
  .rcard .row{display:flex; justify-content:space-between; align-items:center; gap:6px;}
  .rcard .acts{display:flex; gap:5px; margin-top:8px;}
  .dday{font-family:Consolas,monospace; font-weight:800; font-size:12px;}
  .lane.over .dday{color:var(--warn);} .lane.w1 .dday{color:var(--orange);} .lane.m1 .dday{color:var(--gold);}

  .kakao-mini{width:26px; height:26px; border:none; border-radius:7px; background:#fee500; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; padding:0; flex-shrink:0;}
  .kakao-mini:hover{background:#f5dc00;}
  .kakao-btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:13px; border:none; border-radius:8px; background:#fee500; color:#191919; font-size:15px; font-weight:800; cursor:pointer;}
  .kakao-btn:hover{background:#f5dc00;}
  .share-more summary{cursor:pointer; font-size:12.5px; color:var(--ink-soft); user-select:none;}
  /* calendar */
  .cal-nav{display:inline-flex; align-items:center; gap:6px; text-transform:none; letter-spacing:0;}
  .cal-nav b{font-size:14px; color:var(--ink); min-width:96px; text-align:center;}
  .cal-legend{display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; color:var(--ink-soft); margin-bottom:10px;}
  .cal-legend i, .cal-dots i{display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:4px; vertical-align:-1px;}
  .cal-wrap{display:grid; grid-template-columns:minmax(0,1fr) 280px; gap:14px;}
  .cal{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); border:1px solid var(--grid); border-radius:var(--radius); overflow:hidden; background:#fff;}
  .cal-head{padding:6px; font-size:11.5px; font-weight:700; text-align:center; background:var(--header-fill); color:var(--accent-dark);}
  .cal-head.sun, .cal-cell.sun .cal-num{color:var(--warn);} .cal-head.sat, .cal-cell.sat .cal-num{color:var(--accent2);}
  .cal-cell{min-height:96px; padding:4px; border-top:1px solid var(--grid); border-right:1px solid var(--grid); cursor:pointer; overflow:hidden;}
  .cal-cell:nth-child(7n){border-right:none;}
  .cal-cell.blank{background:#fafbfb; cursor:default;}
  .cal-cell:not(.blank):hover{background:#f3fbfa;}
  .cal-cell.sel{background:#e9f8f7; box-shadow:inset 0 0 0 2px var(--accent);}
  .cal-num{font-size:11.5px; font-weight:700; margin-bottom:3px;}
  .cal-cell.today .cal-num{display:inline-block; background:var(--accent); color:#fff !important; border-radius:10px; padding:0 6px;}
  .chip{font-size:10.5px; padding:2px 5px; border-radius:3px; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; border-left:3px solid;}
  .chip.end, .cal-legend .end, .cal-dots .end{border-color:var(--orange); background:var(--orange-bg); color:var(--orange);}
  .chip.mtend, .cal-legend .mtend, .cal-dots .mtend{border-color:#6a3fc1; background:#f0eafc; color:#6a3fc1;}
  .chip.sign, .cal-legend .sign, .cal-dots .sign{border-color:var(--accent2); background:#e8edfb; color:var(--accent2);}
  .chip.done, .cal-legend .done, .cal-dots .done{border-color:#aab5b6; background:#f1f3f3; color:#8a9697;}
  .chip.done{text-decoration:line-through;}
  .chip.more{border:none; color:var(--ink-soft); background:none; padding-left:2px;}
  .cal-legend .end, .cal-legend .mtend, .cal-legend .sign, .cal-legend .done, .cal-dots i{background:currentColor;}
  .cal-legend .end{color:var(--orange);} .cal-legend .mtend{color:#6a3fc1;} .cal-legend .sign{color:var(--accent2);} .cal-legend .done{color:#aab5b6;}
  .cal-dots .end{color:var(--orange);} .cal-dots .mtend{color:#6a3fc1;} .cal-dots .sign{color:var(--accent2);} .cal-dots .done{color:#aab5b6;}
  .cal-dots{display:none;}
  .cal-day{background:#f7f9f9; border:1px solid var(--grid); border-radius:var(--radius); padding:12px; max-height:620px; overflow-y:auto;}
  .cal-day-title{font-weight:700; margin-bottom:10px;}
  .cal-item{background:#fff; border:1px solid var(--grid); border-radius:var(--radius); padding:9px 10px; margin-bottom:8px; border-left:4px solid var(--grid-strong);}
  .cal-item.end{border-left-color:var(--orange);} .cal-item.mtend{border-left-color:#6a3fc1;} .cal-item.sign{border-left-color:var(--accent2);}
  .cal-item .t{font-weight:700; margin:5px 0 2px;} .cal-item .s{font-size:11.5px; color:var(--ink-soft);}
  .cal-item .row{display:flex; justify-content:space-between; align-items:center;}
  .cal-item .acts{display:flex; gap:5px; margin-top:6px; flex-wrap:wrap;}
  .cal-item .t{margin:3px 0 1px;}

  /* forms & modal */
  .modal-bg{position:fixed; inset:0; background:rgba(20,25,30,.55); display:flex; align-items:flex-start; justify-content:center; z-index:200; overflow-y:auto; padding:30px 12px;}
  .modal{background:#fff; width:680px; max-width:100%; border-radius:var(--radius); position:relative;}
  .modal.wide{width:1040px;}
  .modal-head{display:flex; justify-content:space-between; align-items:center; padding:14px 20px; border-bottom:1px solid var(--grid); background:var(--header-fill); border-radius:var(--radius) var(--radius) 0 0;}
  .modal-head h3{font-size:14px;}
  .modal-close{cursor:pointer; font-size:20px; color:var(--ink-soft); background:none; border:none; line-height:1;}
  .modal-body{padding:20px;}
  .modal-actions{padding:12px 20px; border-top:1px solid var(--grid); display:flex; justify-content:flex-end; gap:8px; align-items:center;}
  .modal-actions .left{margin-right:auto;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:0 14px;}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:0 14px;}
  .field{margin-bottom:12px; position:relative;}
  .field label{display:block; font-size:11px; color:var(--ink-soft); margin-bottom:4px; font-weight:600;}
  .field input, .field select, .field textarea, .cell-in{width:100%; padding:7px 9px; border:1px solid var(--grid-strong); font-size:13px; border-radius:var(--radius); font-family:inherit; background:#fff;}
  .field input:focus, .field select:focus, .field textarea:focus, .cell-in:focus{outline:none; border-color:var(--accent);}
  .field input:disabled, .field select:disabled{background:#f2f4f4; color:var(--ink-soft);}
  .field textarea{resize:vertical; min-height:64px;}
  .req{color:var(--warn);}
  .section-title{font-size:12px; font-weight:700; color:var(--accent-dark); margin:6px 0 8px; display:flex; justify-content:space-between; align-items:center;}
  .items-table{border:1px solid var(--grid); border-radius:var(--radius);}
  .items-table td{padding:4px; border-bottom:1px solid var(--grid);}
  .items-table th{padding:6px;}
  .cell-in{padding:5px 6px; font-size:12.5px;}
  .cell-in.n{text-align:right; font-family:Consolas,monospace;}
  .totals{display:flex; gap:18px; justify-content:flex-end; padding:10px 4px 0; font-size:12.5px; flex-wrap:wrap;}
  .totals b{font-family:Consolas,monospace; font-size:13.5px;}
  .sugg{display:none; position:absolute; top:100%; left:0; right:0; background:#fff; border:1px solid var(--grid-strong); max-height:200px; overflow-y:auto; z-index:50; border-radius:0 0 var(--radius) var(--radius); box-shadow:0 6px 14px rgba(0,0,0,.12);}
  .sugg div{padding:8px 10px; cursor:pointer; font-size:12.5px; border-bottom:1px solid var(--grid);}
  .sugg div:hover{background:var(--header-fill);}
  .hint{font-size:11px; color:var(--ink-soft); margin-top:5px; line-height:1.5;}
  .info-line{background:var(--header-fill); padding:8px 10px; border-radius:var(--radius); margin-bottom:14px; font-size:12px;}
  .contact-row{display:grid; grid-template-columns:1.1fr 1fr 1.1fr 1.4fr 30px; gap:6px; margin-bottom:6px; align-items:center;}

  .toast{position:fixed; bottom:26px; left:50%; transform:translateX(-50%); background:#1b2733; color:#fff; padding:11px 20px; border-radius:var(--radius); font-size:13px; z-index:500; box-shadow:0 8px 24px rgba(0,0,0,.3);}
  .excel-wrap{position:fixed; bottom:18px; right:18px; z-index:150;}
  .excel-fab{width:34px; height:34px; border-radius:50%; background:#1d6f42; color:#fff; border:none; cursor:pointer; box-shadow:0 3px 8px rgba(0,0,0,.28); font-size:9.5px; font-weight:800;}
  .excel-menu{position:absolute; bottom:42px; right:0; background:#fff; border:1px solid var(--grid-strong); border-radius:var(--radius); box-shadow:0 8px 20px rgba(0,0,0,.18); overflow:hidden; width:150px;}
  .excel-menu button{display:block; width:100%; text-align:left; padding:9px 12px; border:none; background:#fff; cursor:pointer; font-size:12.5px; border-bottom:1px solid var(--grid);}
  .excel-menu button:last-child{border-bottom:none;}
  .excel-menu button:hover{background:var(--header-fill);}

  @media (max-width: 1100px){ .cal-wrap{grid-template-columns:minmax(0,1fr);} }
  @media (max-width: 1100px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr));} .board{grid-template-columns:repeat(2,minmax(0,1fr));} }
  @media (max-width: 760px){
    .shell{flex-direction:column;}
    .sidebar{width:100%; height:auto; position:static; padding:10px 0 0;}
    .brand{display:flex; justify-content:space-between; align-items:center; padding:0 16px 10px; margin:0;}
    .nav{flex-direction:row; overflow-x:auto;}
    .nav-item{border-left:none; border-bottom:3px solid transparent; padding:10px 14px; gap:6px;}

<script>
(function(){

  const LS = { get:k=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set:(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} }, del:k=>{ try{ localStorage.removeItem(k); }catch(e){} } };

  const state = {
    view:'login', user:null, userEmail:null, isAdmin:false, tab:'dashboard', loading:true, setupMissing:[],

    q:{}, f:{ctrType:'전체', ctrTab:'전체', ctrRep:'전체', mtRep:'전체', mtTab:'전체', tkStatus:'미완료', tkAssignee:'전체', dashMine:false},

  };

  // ================= helpers =================
  const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const num = v => { const n = Number(String(v==null?'':v).replace(/,/g,'')); return isFinite(n)?n:0; };
  const won = n => Math.round(num(n)).toLocaleString('ko-KR');
  const pct = n => (isFinite(n) ? (Math.round(n*10)/10).toFixed(1) : '0.0')+'%';
  const uid = p => p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  function fmt(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function todayStr(){ return fmt(new Date()); }
  function parseD(s){ const [y,m,d]=String(s).split('-').map(Number); return new Date(y,(m||1)-1,d||1); }
  function addDays(s,n){ const d=parseD(s); d.setDate(d.getDate()+n); return fmt(d); }
  function addMonths(s,n){ const d=parseD(s); const day=d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n); const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); d.setDate(Math.min(day,last)); return fmt(d); }
  function daysUntil(s){ if(!s) return null; return Math.round((parseD(s)-parseD(todayStr()))/86400000); }
  function ddayLabel(d){ return d===0?'D-Day':d>0?'D-'+d:'D+'+(-d); }
  function nextCode(prefix, list){ const compact=todayStr().replace(/-/g,'').slice(2); const n=list.filter(x=>x.code && String(x.code).startsWith(prefix+compact)).length+1; return prefix+compact+'-'+String(n).padStart(3,'0'); }
  function excelDate(val){
    if(val===undefined||val===null||val==='') return '';
    if(val instanceof Date && !isNaN(val)) return fmt(val);
    const s=String(val).trim();
    if(/^\d+(\.\d+)?$/.test(s)){ const n=Number(s); if(n>20000&&n<80000){ const d=new Date(Date.UTC(1899,11,30)+n*86400000); return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0'); } }
    return s.replace(/\./g,'-').replace(/\//g,'-');
  }
  function showToast(m){ state.toast=m; render(); clearTimeout(showToast._t); showToast._t=setTimeout(()=>{state.toast=null; render();},2200); }
  function askConfirm(message,onYes,label,danger){ state.confirm={message,onYes,label:label||'삭제',danger:danger!==false}; render(); }
  function fail(prefix, error){ alert(prefix+': '+(error && error.message || error)); }

  // ---- lookups ----
  const customer = id => state.customers.find(c=>c.id===id);
  const custName = id => { const c=customer(id); return c?c.name:'-'; };
  const isSupplier = c => c && c.kind==='supplier';
  const partnersOf = kind => state.customers.filter(c=> kind==='supplier' ? isSupplier(c) : !isSupplier(c));
  const sortedSuppliers = () => partnersOf('supplier').sort((a,b)=>String(a.name).localeCompare(String(b.name),'ko'));
  const supplierByName = n => partnersOf('supplier').find(c=>c.name===String(n||'').trim());
  function supplierLabel(id, name){ const c=customer(id); return c?c.name:(name||''); }
  function repDisplay(v){ if(!v) return ''; const r=state.reps.find(x=>x.name===v || (x.email && String(x.email).toLowerCase()===String(v).toLowerCase())); return r && r.name ? r.name : v; }
  const isMine = v => !!v && (v===state.user || (state.userEmail && String(v).toLowerCase()===state.userEmail.toLowerCase()) || repDisplay(v)===state.user);
  const contact = id => state.contacts.find(c=>c.id===id);
  const contactsOf = cid => state.contacts.filter(c=>c.customer_id===cid);
  const contractById = id => state.contracts.find(c=>c.id===id);
  const itemsOf = cid => state.items.filter(i=>i.contract_id===cid).sort((a,b)=>(a.sort||0)-(b.sort||0));
  const sortedCustomers = () => partnersOf('customer').sort((a,b)=>String(a.name).localeCompare(String(b.name),'ko'));
  function repNames(){ const s=new Set(state.reps.map(r=>r.name).filter(Boolean)); if(state.user) s.add(state.user); return [...s].sort((a,b)=>a.localeCompare(b,'ko')); }
  function repOptions(cur){ const curName=repDisplay(cur); return [...new Set([...repNames(), curName].filter(Boolean))].map(o=>`<option value="${esc(o)}" ${curName===o?'selected':''}>${esc(o)}</option>`).join(''); }
  function contractTotals(c){
    const its = itemsOf(c.id);
    if(its.length===0){ const sale=num(c.amount), profit=num(c.profit_amount); return {sale, purchase:sale-profit, profit, margin: sale? profit/sale*100 : 0, count:0}; }
    const sale = its.reduce((s,i)=>s+num(i.sale_amount),0), purchase = its.reduce((s,i)=>s+num(i.purchase_amount),0);
    return {sale, purchase, profit:sale-purchase, margin: sale? (sale-purchase)/sale*100 : 0, count:its.length};
  }
  function mtTotals(m){ const sale=num(m.amount); const purchase = m.purchase_amount==null||m.purchase_amount==='' ? sale-num(m.profit_amount) : num(m.purchase_amount); return {sale, purchase, profit:sale-purchase, margin: sale?(sale-purchase)/sale*100:0}; }
  function mtCustomerId(m){ if(m.customer_id) return m.customer_id; const c=contractById(m.contract_id); return c?c.customer_id:null; }
  function productOptionsFor(cid){
    const set = new Set();
    state.contracts.filter(c=>c.customer_id===cid).forEach(c=>itemsOf(c.id).forEach(i=>{ if(i.product) set.add(i.product); }));
    state.maint.filter(m=>mtCustomerId(m)===cid).forEach(m=>{ if(m.name) set.add(m.name); });
    return [...set];
  }

  // ---- renewal / expiry ----
  function periodState(end, renewed, dismissed){
    if(!end) return 'perm';
    if(renewed) return 'renewed';
    if(dismissed) return 'closed';
    const d = daysUntil(end);
    if(d<0) return 'expired';
    return 'active';
  }
  function renewalList(){
    const out=[];
    state.contracts.forEach(c=>{
      if(c.renewed||c.alert_dismissed||!c.expiry_date) return;
      const d=daysUntil(c.expiry_date); if(d<-90||d>60) return;
      out.push({kind:'ctr', rec:c, id:c.id, name:c.name, customerId:c.customer_id, end:c.expiry_date, d, rep:c.sales_rep, alertDays:num(c.alert_days)||30, amount:contractTotals(c).sale});
    });
    state.maint.forEach(m=>{
      if(m.renewed||m.alert_dismissed||!m.end_date) return;
      const d=daysUntil(m.end_date); if(d<-90||d>60) return;
      out.push({kind:'mt', rec:m, id:m.id, name:m.name, customerId:mtCustomerId(m), end:m.end_date, d, rep:m.sales_rep, alertDays:num(m.alert_days)||30, amount:num(m.amount)});
    });
    return out.sort((a,b)=>a.d-b.d);
  }
  function periodTabMatch(tab, end, renewed, dismissed){
    if(tab==='전체') return true;
    const st=periodState(end,renewed,dismissed), d=daysUntil(end);
    if(tab==='갱신임박(30일)') return st==='active' && d<=30;
    if(tab==='진행중') return st==='active' || st==='perm';
    if(tab==='미처리') return st==='expired';
    if(tab==='완료(종료)') return st==='renewed' || st==='closed';
    return true;
  }
  function periodTabsHTML(list, endKey, cur, cls){
    const cnt = t => list.filter(x=>periodTabMatch(t, x[endKey], x.renewed, x.alert_dismissed)).length;
    return `<div class="tabs">${PERIOD_TABS.map(t=>`<div class="tab-btn ${cls} ${cur===t?'active':''} ${t==='미처리'&&cnt(t)?'warn-tab':''}" data-t="${t}">${t}<span class="cnt">${cnt(t)}</span></div>`).join('')}</div>`;
  }
  const bucketOf = d => d<0?'over':d<=7?'w1':d<=30?'m1':'m2';
  function renewalBadgeCount(){ return renewalList().filter(x=>x.d<=30 && (!state.f.dashMine || isMine(x.rep))).length; }
  function openTicketsCount(mineOnly){ return state.tickets.filter(t=>t.status!=='완료' && (!mineOnly || isMine(t.assignee))).length; }
  function ddayBadge(end, renewed, dismissed, alertDays){
    const st = periodState(end, renewed, dismissed);
    if(st==='perm') return '<span class="badge purple">영구</span>';
    if(st==='renewed') return '<span class="badge green">갱신완료</span>';
    if(st==='closed') return '<span class="badge gray">종료</span>';
    const d = daysUntil(end);
    if(d<0) return `<span class="badge warn">만료 ${ddayLabel(d)}</span>`;
    if(d<=7) return `<span class="badge orange">${ddayLabel(d)}</span>`;
    if(d<=(alertDays||30)) return `<span class="badge gold">${ddayLabel(d)}</span>`;
    return `<span class="muted small">${ddayLabel(d)}</span>`;
  }
  function rowClassFor(end, renewed, dismissed){
    if(!end||renewed||dismissed) return '';
    const d=daysUntil(end); if(d<0 && d>=-90) return 'row-over'; if(d>=0 && d<=30) return 'row-warn'; return '';
  }

  // ---- row builders (only known columns are sent) ----
  const dn = v => v ? v : null;
  function custRow(c){ return {id:c.id, code:c.code, name:c.name, kind:c.kind||'customer', tax_email:c.tax_email||'', biz_reg_no:c.biz_reg_no||'', sales_rep:c.sales_rep||state.user, reg_date:dn(c.reg_date)}; }
  function contactRow(x){ return {id:x.id, customer_id:x.customer_id, name:x.name||'', dept:x.dept||'', phone:x.phone||'', email:x.email||''}; }
  function ctrRow(c){ return {id:c.id, code:c.code, name:c.name, customer_id:c.customer_id||null, contact_id:c.contact_id||null, end_user_name:c.end_user_name||'', deal_type:c.deal_type||'신규', stage:c.stage||STAGES[0], request:c.request||'없음', contract_date:dn(c.contract_date), start_date:dn(c.start_date), expiry_date:dn(c.expiry_date), alert_days:num(c.alert_days)||30, alert_dismissed:!!c.alert_dismissed, renewed:!!c.renewed, amount:num(c.amount), profit_amount:num(c.profit_amount), biz_type:c.biz_type||'', invoice_date:dn(c.invoice_date), sales_rep:c.sales_rep||state.user, remarks:c.remarks||'', attachment_url:c.attachment_url||null, attachment_name:c.attachment_name||null, attachment_path:c.attachment_path||null, reg_date:dn(c.reg_date)}; }
  function itemRow(i){ return {id:i.id, contract_id:i.contract_id, product:i.product||'', vendor:i.vendor||'', qty:num(i.qty)||1, sale_amount:num(i.sale_amount), supplier_id:i.supplier_id||null, supplier:i.supplier||'', purchase_amount:num(i.purchase_amount), sort:num(i.sort)}; }
  function mtRow(m){ const t=mtTotals(m); return {id:m.id, name:m.name, contract_id:m.contract_id||null, customer_id:m.customer_id||null, deal_type:m.deal_type||'신규', start_date:dn(m.start_date), end_date:dn(m.end_date), billing_cycle:m.billing_cycle||BILLING[0], amount:num(m.amount), supplier_id:m.supplier_id||null, supplier:m.supplier||'', purchase_amount:t.purchase, profit_amount:t.profit, renewal_type:m.renewal_type||'수동갱신', sales_rep:m.sales_rep||state.user, alert_days:num(m.alert_days)||30, alert_dismissed:!!m.alert_dismissed, renewed:!!m.renewed, remarks:m.remarks||'', attachment_url:m.attachment_url||null, attachment_name:m.attachment_name||null, attachment_path:m.attachment_path||null, reg_date:dn(m.reg_date)}; }
  function tkRow(t){ return {id:t.id, code:t.code, customer_id:t.customer_id||null, contact_id:t.contact_id||null, contract_id:t.contract_id||null, product:t.product||'', request:t.request||'', received_date:dn(t.received_date), assignee:t.assignee||'', status:t.status||'접수', method:t.method||'', action:t.action||'', done_date:dn(t.done_date), created_by:t.created_by||state.user}; }
  function repRow(r){ return {id:r.id, name:r.name, phone:r.phone||'', email:r.email||'', dept:r.dept||'', is_admin:!!r.is_admin}; }

  // ================= data =================
  async function loadAll(){
    state.loading=true; render();
    const tables = [['reps','reps'],['customers','customers'],['contacts','customer_contacts'],['contracts','contracts'],['items','contract_items'],['maint','maintenance_contracts'],['tickets','support_tickets']];
    const res = await Promise.all(tables.map(([,t])=>sb.from(t).select('*').order('created_at',{ascending:false})));
    state.setupMissing = [];
    res.forEach((r,i)=>{
      const [key,t]=tables[i];
      if(r.error){ state[key]=[]; state.setupMissing.push(t+': '+r.error.message); }
      else state[key]=r.data||[];
    });
    let me = state.reps.find(r=>r.email && state.userEmail && r.email.toLowerCase()===state.userEmail.toLowerCase());
    if(!me && state.userEmail && !state.setupMissing.some(s=>s.startsWith('reps'))){
      const metaName = state.user && !String(state.user).includes('@') ? String(state.user).trim() : '';
      const byName = metaName && state.reps.find(r=>r.name===metaName);
      if(byName){
        // 가입할 때 넣은 이름과 같은 담당자가 이미 있으면 새로 만들지 않고 그 담당자에 로그인 이메일을 연결
        byName.email = state.userEmail;
        const { error } = await sb.from('reps').update({email:state.userEmail}).eq('id', byName.id);
        if(!error) me = byName;
      } else {
        // 처음 로그인한 사람을 담당자로 자동 등록 (담당자가 한 명도 없으면 관리자로)
        const r = {id:uid('rp'), name:metaName || state.userEmail, phone:'', email:state.userEmail, dept:'', is_admin: state.reps.length===0};
        const { error } = await sb.from('reps').insert(repRow(r));
        if(!error){ state.reps.unshift(r); me = r; }
      }
    }
    if(me && me.name) state.user = me.name;
    state.isAdmin = !!(me && me.is_admin) || !state.reps.some(r=>r.is_admin);
    state.loading=false;
    if(me && (!me.name || me.name.includes('@'))) openRepModal(me, '담당자 이름이 이메일로 되어 있어요. 계약·기술지원 화면에 보일 이름을 입력해 주세요. 담당자관리에 이미 본인 이름이 있다면 같은 이름을 입력하면 하나로 합쳐집니다.');
    render();
    checkNotifications();
  }
  async function dbUpsert(table, rows){ const { error } = await sb.from(table).upsert(rows); return error; }
  async function dbDelete(table, ids){ if(!ids.length) return null; const { error } = await sb.from(table).delete().in('id', ids); return error; }

  // ================= notifications =================
  function notifyPerm(){ return typeof window.Notification==='undefined' ? 'unsupported' : Notification.permission; }
  function notifiedKey(id){ return 'notified-'+id+'-'+todayStr(); }
  function wasNotified(id){ try{ return !!localStorage.getItem(notifiedKey(id)); }catch(e){ return false; } }
  function markNotified(id){ try{ localStorage.setItem(notifiedKey(id),'1'); }catch(e){} }
  function goToRenewal(item){
    try{ window.focus(); }catch(e){}
    if(item){ state.tab = item.kind==='ctr'?'contracts':'maint'; state.expanded = item.id; state.q[state.tab]=''; }
    else state.tab='dashboard';
    render();
  }
  function checkNotifications(force){
    if(notifyPerm()!=='granted') return;
    const due = renewalList().filter(x=>x.d<=x.alertDays);
    const targets = force ? due : due.filter(x=>!wasNotified(x.kind+x.id));
    if(targets.length===0){ if(force) new Notification('갱신 알림', {body:'갱신이 필요한 계약·유지보수가 없습니다.', tag:'renew-none'}); return; }
    if(targets.length>3){
      const n = new Notification(`갱신 필요 ${targets.length}건`, { body: targets.slice(0,3).map(x=>`· [${x.kind==='ctr'?'제품':'유지보수'}] ${x.name} ${ddayLabel(x.d)}`).join('\n')+`\n외 ${targets.length-3}건`, tag:'renew-summary', requireInteraction:true });
      n.onclick=()=>{ n.close(); goToRenewal(null); };
    } else {
      targets.forEach(x=>{
        const n = new Notification(`${x.kind==='ctr'?'제품 계약':'유지보수'} 갱신 ${x.d<0?'만료됨 ':''}${ddayLabel(x.d)}`, { body:`${x.name} · ${custName(x.customerId)}\n종료일 ${x.end} · 담당 ${x.rep||'-'}`, tag:'renew-'+x.id, requireInteraction:true });
        n.onclick=()=>{ n.close(); goToRenewal(x); };
      });
    }
    targets.forEach(x=>markNotified(x.kind+x.id));
  }

  // ================= generic table helpers =================
  function cmp(a,b){ const an=Number(a), bn=Number(b); if(a!==''&&b!==''&&a!=null&&b!=null&&!isNaN(an)&&!isNaN(bn)) return an-bn; return String(a==null?'':a).localeCompare(String(b==null?'':b),'ko'); }
  function applySort(list, key, getters){ const st=state.sort[key]; if(!st||!getters[st.col]) return list; const g=getters[st.col]; return [...list].sort((a,b)=>{ const r=cmp(g(a),g(b)); return st.dir==='asc'?r:-r; }); }
  function sortTh(label, key, col, style){ const st=state.sort[key]||{}; const on=st.col===col; return `<th style="${style||''}"><span class="sort-th" data-table="${key}" data-col="${col}">${label}<span class="sort-arrow ${on?'on':''}">${on?(st.dir==='asc'?'▲':'▼'):'▵'}</span></span></th>`; }
  function paginate(list, key){ const total=Math.max(1,Math.ceil(list.length/PAGE_SIZE)); let p=state.page[key]||1; if(p>total) p=total; state.page[key]=p; return {items:list.slice((p-1)*PAGE_SIZE,p*PAGE_SIZE), page:p, total}; }
  function pager(key, pg, count){ if(pg.total<=1) return ''; return `<div class="pager"><button class="btn-sm ghost pageBtn" data-table="${key}" data-page="${pg.page-1}" ${pg.page<=1?'disabled':''}>이전</button><span class="muted">${pg.page} / ${pg.total} 페이지 · 전체 ${count}건</span><button class="btn-sm ghost pageBtn" data-table="${key}" data-page="${pg.page+1}" ${pg.page>=pg.total?'disabled':''}>다음</button></div>`; }
  function checkAllTh(key){ return `<th style="width:30px;"><input type="checkbox" class="checkAll" data-table="${key}"/></th>`; }
  function checkTd(key,id){ return `<td><input type="checkbox" class="rowCheck" data-table="${key}" data-id="${id}" ${state.sel[key].has(id)?'checked':''}/></td>`; }
  function bulkDelBtn(key){ const n=state.sel[key].size; return `<button class="icon-btn danger bulkDel" data-table="${key}" title="선택 삭제">&minus;${n?`<span class="cnt-dot">${n}</span>`:''}</button>`; }
  function searchInput(key, ph){ return `<input id="search_${key}" class="searchBox" data-table="${key}" placeholder="${ph}" value="${esc(state.q[key]||'')}" style="width:210px;"/>`; }
  function selectFilter(id, label, opts, val){ return `<select id="${id}" class="fsel"><option value="전체">${label} 전체</option>${opts.map(o=>`<option value="${esc(o)}" ${val===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`; }
  const qmatch = (key, ...fields) => { const q=(state.q[key]||'').trim().toLowerCase(); if(!q) return true; return fields.some(f=>String(f||'').toLowerCase().includes(q)); };

  // ================= render root =================

    async function go(){
      const email=$('loginEmail').value.trim(), password=$('loginPassword').value, err=$('loginError'), btn=$('loginBtn');
      if(!email||!password){ err.textContent='이메일과 비밀번호를 입력하세요.'; return; }
      LS.set('union-keep-login', $('keepLogin').checked?'1':'0');

          const { data, error } = await sb.auth.signUp({ email, password, options:{ data:{ name:name||email } } });
          if(error){ err.textContent=error.message; return; }
          if(!data.session){ err.textContent='가입 완료. 이메일 인증 후 로그인해주세요.'; return; }
          state.user=name||email; state.userEmail=email;
        } else {
          const { data, error } = await sb.auth.signInWithPassword({ email, password });
          if(error){ err.textContent='로그인 실패: '+error.message; return; }
          state.user=(data.user.user_metadata && data.user.user_metadata.name) || data.user.email; state.userEmail=data.user.email;

  function bindDashboard(){

  function startRenewal(kind,id){

  function closeWithoutRenewal(kind,id){

  function periodRenewal(start, end){
    const newStart = addDays(end,1);
    let months = 12;
    if(start && end){ const days=(parseD(end)-parseD(start))/86400000+1; months = Math.max(1, Math.round(days/30.44)); }
    return {start:newStart, end:addDays(addMonths(newStart,months),-1)};
  }

  // ================= CALENDAR =================
  const KAKAO_ICON = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="#191919" d="M12 3.5C6.75 3.5 2.5 6.86 2.5 11c0 2.66 1.76 5 4.42 6.33l-.9 3.3c-.08.29.25.52.5.35l3.94-2.6c.5.06 1.01.1 1.54.1 5.25 0 9.5-3.36 9.5-7.48S17.25 3.5 12 3.5z"/></svg>';
  function calEvents(mine){
    const ev=[];
    state.contracts.forEach(c=>{
      if(mine && !isMine(c.sales_rep)) return;
      if(c.contract_date) ev.push({date:c.contract_date, type:'sign', kind:'ctr', id:c.id, name:c.name, cust:custName(c.customer_id), label:'계약'});
      if(c.expiry_date){ const done=c.renewed||c.alert_dismissed; ev.push({date:c.expiry_date, type:done?'done':'end', kind:'ctr', id:c.id, name:c.name, cust:custName(c.customer_id), label:c.renewed?'갱신완료':c.alert_dismissed?'종료':'만료'}); }
    });
    state.maint.forEach(m=>{
      if(mine && !isMine(m.sales_rep)) return;
      if(m.end_date){ const done=m.renewed||m.alert_dismissed; ev.push({date:m.end_date, type:done?'done':'mtend', kind:'mt', id:m.id, name:m.name, cust:custName(mtCustomerId(m)), label:m.renewed?'갱신완료':m.alert_dismissed?'종료':'유지보수 만료'}); }
    });
    return ev;
  }
  function renderCalendar(){
    const mine=state.f.dashMine;
    const ym = state.cal || todayStr().slice(0,7);
    const [y,mo] = ym.split('-').map(Number);
    const first = new Date(y,mo-1,1), startDow=first.getDay(), days=new Date(y,mo,0).getDate();
    const evs = calEvents(mine).filter(e=>e.date && e.date.startsWith(ym));
    const byDay = {}; evs.forEach(e=>{ (byDay[e.date]=byDay[e.date]||[]).push(e); });
    const order={end:0, mtend:1, sign:2, done:3};
    Object.values(byDay).forEach(l=>l.sort((a,b)=>order[a.type]-order[b.type]));
    const today=todayStr();
    const sel = state.calDay && state.calDay.startsWith(ym) ? state.calDay : (today.startsWith(ym)?today:null);
    const cells=[];
    for(let i=0;i<startDow;i++) cells.push('<div class="cal-cell blank"></div>');
    for(let d=1; d<=days; d++){
      const ds=`${ym}-${String(d).padStart(2,'0')}`, l=byDay[ds]||[], dow=(startDow+d-1)%7;
      cells.push(`<div class="cal-cell ${ds===today?'today':''} ${ds===sel?'sel':''} ${dow===0?'sun':dow===6?'sat':''}" data-day="${ds}">
        <div class="cal-num">${d}</div>
        ${l.slice(0,3).map(e=>`<div class="chip ${e.type}" title="${esc(e.label+' · '+e.name+' · '+e.cust)}">${esc(e.name)}</div>`).join('')}

  function shareText(kind, id, withAmount){

      L.push(`■ 구분: ${c.deal_type||'신규'}`);
      L.push(`■ 계약일: ${c.contract_date||'-'}`);
      L.push(`■ 만료일: ${c.expiry_date ? c.expiry_date+(c.renewed?' (갱신완료)':d!=null?` (${ddayLabel(d)})`:'') : '영구'}`);
      if(its.length){ L.push('■ 품목:'); its.forEach(i=>L.push(`  - ${i.product}${num(i.qty)>1?' × '+num(i.qty):''}${withAmount?' / ₩'+won(i.sale_amount):''}`)); }
      if(withAmount) L.push(`■ 계약금액: ₩${won(t.sale)}`);
      L.push(`■ 영업담당: ${repDisplay(c.sales_rep)||'-'}`);
    } else {
      const m=state.maint.find(x=>x.id===id); if(!m) return '';
      const d=daysUntil(m.end_date), ctr=contractById(m.contract_id);
      L.push('[UNION 유지보수 안내]');
      L.push(`■ 유지보수명: ${m.name}`);
      L.push(`■ 고객사: ${custName(mtCustomerId(m))}`);
      if(ctr) L.push(`■ 관련 계약: ${ctr.name}`);

  const KAKAO_SDK = 'https://t1.kakaocdn.net/kakao_js_sdk/2.8.3/kakao.min.js';
  let kakaoLoading = null;
  function loadKakao(){
    if(window.Kakao && window.Kakao.isInitialized && window.Kakao.isInitialized()) return Promise.resolve(window.Kakao);
    if(kakaoLoading) return kakaoLoading;
    kakaoLoading = new Promise((resolve, reject)=>{
      const done=()=>{ try{ if(!window.Kakao.isInitialized()) window.Kakao.init(KAKAO_JS_KEY); resolve(window.Kakao); }catch(e){ reject(e); } };
      if(window.Kakao) return done();
      const sc=document.createElement('script'); sc.src=KAKAO_SDK; sc.crossOrigin='anonymous'; sc.onload=done; sc.onerror=()=>{ kakaoLoading=null; reject(new Error('카카오 SDK를 불러오지 못했습니다')); };
      document.head.appendChild(sc);
    });
    return kakaoLoading;
  }
  const clip = (v,n) => { v=String(v==null?'':v); return v.length>n ? v.slice(0,n-1)+'…' : v; };
  function shortWon(n){ const w='₩'+won(n); if(w.length<=11) return w; const man=Math.round(num(n)/10000); const m=man.toLocaleString('ko-KR')+'만원'; return m.length<=11 ? m : Math.round(num(n)/100000000).toLocaleString('ko-KR')+'억원'; }
  function kakaoCard(kind, id, withAmount){
    const url = location.origin + location.pathname;
    const link = {webUrl:url, mobileWebUrl:url};
    if(kind==='ctr'){
      const c=contractById(id); if(!c) return null;
      const d=daysUntil(c.expiry_date), its=itemsOf(c.id), t=contractTotals(c);
      const endTxt = c.expiry_date ? c.expiry_date+(c.renewed?' 갱신완료':d!=null?' ('+ddayLabel(d)+')':'') : '영구';

      const card = {objectType:'feed',
        content:{title: clip(`[계약] ${c.name}`,60), description: clip(`${custName(c.customer_id)}${prod?' · '+prod:''}`,80), link},
        itemContent:{profileText:'UNION 사업관리', items:[
          {item:'고객사', itemOp:clip(custName(c.customer_id),20)},
          {item:'구분', itemOp:c.deal_type||'신규'},

      return card;
    }
    const m=state.maint.find(x=>x.id===id); if(!m) return null;
    const d=daysUntil(m.end_date);
    const card = {objectType:'feed',
      content:{title: clip(`[유지보수] ${m.name}`,60), description: clip(`${custName(mtCustomerId(m))} · ${m.billing_cycle||'연납'}`,80), link},
      itemContent:{profileText:'UNION 사업관리', items:[
        {item:'고객사', itemOp:clip(custName(mtCustomerId(m)),20)},

        {item:'담당', itemOp:clip(repDisplay(m.sales_rep)||'-',20)},
      ]},
      buttons:[{title:'시스템에서 보기', link}]};
    if(withAmount){ card.itemContent.sum='금액'; card.itemContent.sumOp=shortWon(m.amount); }
    return card;
  }

  async function copyText(text){

  }

  async function saveCustomer(m){
    const d=m.data; d.name=String(d.name||'').trim();
    const label = d.kind==='supplier'?'매입처':'고객사';
    if(!d.name) return alert('업체명을 입력하세요.');
    if(partnersOf(d.kind).some(c=>c.name===d.name && c.id!==d.id)) return alert(`같은 이름의 ${label}가 이미 있습니다.`);
    const contacts = d._contacts.filter(x=>String(x.name||'').trim()||x.phone||x.email).map(x=>({...x, customer_id:d.id, name:String(x.name||'').trim()}));
    let err = await dbUpsert('customers',[custRow(d)]); if(err) return fail('저장 실패',err);
    if(contacts.length){ err = await dbUpsert('customer_contacts', contacts.map(contactRow)); if(err) return fail('담당자 저장 실패',err); }
    if(d._removed.length){ err = await dbDelete('customer_contacts', d._removed); if(err) return fail('담당자 삭제 실패',err); }
    const clean = {...d}; delete clean._contacts; delete clean._removed;
    const i=state.customers.findIndex(c=>c.id===d.id); if(i>-1) state.customers[i]=clean; else state.customers.unshift(clean);
    state.contacts = state.contacts.filter(x=>x.customer_id!==d.id).concat(contacts);
    state.modal=null; showToast('저장되었습니다.');
  }

  function bindCustomerSearch(d, onPick){
    const input=document.getElementById('f_cust'), box=document.getElementById('f_cust_sugg'); if(!input) return;
    let composing=false;
    function show(){
      const q=input.value.trim(); if(!q){ box.style.display='none'; return; }
      const hits=sortedCustomers().filter(c=>c.name.toLowerCase().includes(q.toLowerCase())).slice(0,10);
      box.innerHTML = hits.length? hits.map(c=>`<div data-id="${c.id}">${esc(c.name)}</div>`).join('') : `<div style="cursor:default; color:var(--ink-soft);">일치하는 고객사가 없습니다 · 저장하면 새로 등록됩니다</div>`;
      box.querySelectorAll('[data-id]').forEach(it=>it.addEventListener('mousedown',e=>{ e.preventDefault(); d.customer_id=it.dataset.id; d._newCustomerName=''; box.style.display='none'; onPick&&onPick(); render(); }));
      box.style.display='block';
    }
    input.addEventListener('compositionstart',()=>composing=true);
    input.addEventListener('compositionend',()=>{ composing=false; d.customer_id=''; d._newCustomerName=input.value.trim(); show(); });
    input.addEventListener('input',()=>{ d.customer_id=''; d._newCustomerName=input.value.trim(); show(); });

  async function saveContract(m){
    const d=m.data; d.name=String(d.name||'').trim();
    if(!d.name) return alert('계약명을 입력하세요.');
    const items = d._items.filter(i=>String(i.product||'').trim()||num(i.sale_amount)||num(i.purchase_amount)).map((i,idx)=>{ const sp=supplierByName(i.supplier); return {...i, contract_id:d.id, sort:idx, supplier_id: sp?sp.id:null, supplier: sp?sp.name:String(i.supplier||'').trim()}; });
    if(!validateSuppliers(items.map(i=>i.supplier))) return;
    if(d.contract_date && d.expiry_date && d.expiry_date<d.contract_date) return alert('만료일이 계약일보다 빠릅니다.');
    if(!(await ensureCustomer(d))) return;
    if(!(await ensureContact(d,'contact_id'))) return;
    if(d.contact_id==='__new') d.contact_id=null;
    const sale=items.reduce((s,i)=>s+num(i.sale_amount),0), purchase=items.reduce((s,i)=>s+num(i.purchase_amount),0);
    d.amount=sale; d.profit_amount=sale-purchase; d.start_date=d.contract_date;
    d.biz_type=[...new Set(items.map(i=>i.supplier).filter(Boolean))].join(', ');
    if(!d.sales_rep) d.sales_rep=state.user;
    let err=await dbUpsert('contracts',[ctrRow(d)]); if(err) return fail('저장 실패',err);
    if(items.length){ err=await dbUpsert('contract_items',items.map(itemRow)); if(err) return fail('품목 저장 실패',err); }
    if(d._removedItems.length){ err=await dbDelete('contract_items',d._removedItems); if(err) return fail('품목 삭제 실패',err); }
    if(d._renewFromId){ const o=contractById(d._renewFromId); if(o){ o.renewed=true; const e2=await dbUpsert('contracts',[ctrRow(o)]); if(e2) fail('기존 계약 갱신완료 표시 실패',e2); } }
    const clean={...d}; ['_items','_removedItems','_renewFromId','_newCustomerName','_nc'].forEach(k=>delete clean[k]);
    const i=state.contracts.findIndex(c=>c.id===d.id); if(i>-1) state.contracts[i]=clean; else state.contracts.unshift(clean);
    state.items = state.items.filter(x=>x.contract_id!==d.id).concat(items);
    state.modal=null; showToast(d._renewFromId?'갱신 계약이 등록되었습니다.':'저장되었습니다.');
  }

  async function saveTicket(m, complete){
    const d=m.data;
    if(!String(d.request||'').trim()) return alert('요청 내용을 입력하세요.');
    if(complete){
      if(!d.method) return alert('완료 처리하려면 지원 방식(방문/원격/전화)을 선택하세요.');

    } else {
      if(d.status==='완료' && !d.done_date) d.done_date=todayStr();
      if(d.status==='접수' && d.assignee && d.action) d.status='처리중';

    if(!(await ensureCustomer(d))) return;
    if(!(await ensureContact(d,'contact_id'))) return;
    if(d.contact_id==='__new') d.contact_id=null;
    const hit = state.contracts.filter(c=>c.customer_id===d.customer_id).find(c=>itemsOf(c.id).some(i=>i.product===d.product));
    d.contract_id = hit ? hit.id : (d.contract_id||null);
    const err=await dbUpsert('support_tickets',[tkRow(d)]); if(err) return fail('저장 실패',err);
    const clean={...d}; ['_newCustomerName','_nc'].forEach(k=>delete clean[k]);
    const i=state.tickets.findIndex(x=>x.id===d.id); if(i>-1) state.tickets[i]=clean; else state.tickets.unshift(clean);
    state.modal=null; showToast(complete?'완료 처리되었습니다.':'저장되었습니다.');
  }

  async function saveRep(m){
    const d=m.data; d.name=String(d.name||'').trim(); if(!d.name) return alert('이름을 입력하세요.');
    if(d.name.includes('@')) return alert('이메일 말고 실제 이름을 입력해주세요. (예: 최나래)');
    const twin = state.reps.find(r=>r.name===d.name && r.id!==d.id);
    const isMe = d.email && state.userEmail && d.email.toLowerCase()===state.userEmail.toLowerCase();
    if(twin){
      if(!isMe) return alert('같은 이름의 담당자가 이미 있습니다.');
      if(twin.email && twin.email.toLowerCase()!==state.userEmail.toLowerCase() && !confirm(`"${twin.name}" 담당자에는 다른 이메일(${twin.email})이 적혀 있어요.\n이 로그인(${state.userEmail})으로 바꾸고 하나로 합칠까요?`)) return;
      return mergeIntoRep(d, twin);
    }
    const ad=document.getElementById('f_admin'); if(ad && state.isAdmin) d.is_admin=ad.checked;
    const old=state.reps.find(r=>r.id===d.id);
    const err=await dbUpsert('reps',[repRow(d)]); if(err) return fail('저장 실패',err);
    // 이름이 바뀌면 이전 이름(또는 이메일)으로 저장된 기록도 새 이름으로 바꿈
    await renameRecords([old&&old.name, d.email], d.name);
    const i=state.reps.findIndex(r=>r.id===d.id); if(i>-1) state.reps[i]=d; else state.reps.unshift(d);
    if(d.email && state.userEmail && d.email.toLowerCase()===state.userEmail.toLowerCase()) state.user=d.name;

  // 같은 사람이 두 줄로 생긴 경우: 이메일로 만들어진 줄(dup)을 기존 담당자(keep)에 합치기
  async function renameRecords(from, to){
    for(const ov of [...new Set(from.filter(v=>v && v!==to))]){
      await sb.from('contracts').update({sales_rep:to}).eq('sales_rep',ov);
      await sb.from('maintenance_contracts').update({sales_rep:to}).eq('sales_rep',ov);
      await sb.from('support_tickets').update({assignee:to}).eq('assignee',ov);
      state.contracts.forEach(c=>{ if(c.sales_rep===ov) c.sales_rep=to; });
      state.maint.forEach(x=>{ if(x.sales_rep===ov) x.sales_rep=to; });
      state.tickets.forEach(t=>{ if(t.assignee===ov) t.assignee=to; });
    }
  }
  async function mergeIntoRep(dup, keep){
    const merged = {...keep, email:dup.email, is_admin: !!(keep.is_admin || dup.is_admin), phone: keep.phone||dup.phone||'', dept: keep.dept||dup.dept||''};
    let err = await dbUpsert('reps',[repRow(merged)]); if(err) return fail('합치기 실패',err);
    const orig = state.reps.find(r=>r.id===dup.id);
    if(dup.id!==keep.id){ err = await dbDelete('reps',[dup.id]); if(err) return fail('중복 담당자 삭제 실패',err); }
    await renameRecords([orig && orig.name, dup.email], merged.name);
    state.reps = state.reps.filter(r=>r.id!==dup.id).map(r=>r.id===keep.id?merged:r);
    state.user = merged.name;
    state.isAdmin = !!merged.is_admin || !state.reps.some(r=>r.is_admin);
    state.modal=null; showToast(`"${merged.name}" 담당자로 합쳤습니다.`);
  }

    });
    ({customer:bindCustomerForm, contract:bindContractForm, maint:bindMaintForm, ticket:bindTicketForm, rep:()=>{}})[m.type](d);
    const save=document.getElementById('modalSave');
    save.onclick=async ()=>{ save.disabled=true; try{ await ({customer:saveCustomer, contract:saveContract, maint:saveMaint, ticket:saveTicket, rep:saveRep})[m.type](m); } finally{ if(document.body.contains(save)) save.disabled=false; } };
    const comp=document.getElementById('modalComplete'); if(comp) comp.onclick=()=>saveTicket(m,true);
    const del=document.getElementById('modalDelete'); if(del) del.onclick=()=>{ const key={customer:isSupplier(d)?'suppliers':'customers',contract:'contracts',maint:'maint',ticket:'support',rep:'reps'}[m.type]; deleteRecords(key,[d.id],()=>{ state.modal=null; }); };
  }

  // ================= delete =================
  const TABLES = {customers:['customers','customers','고객사'], suppliers:['customers','customers','매입처'], contracts:['contracts','contracts','계약'], maint:['maintenance_contracts','maint','유지보수'], support:['support_tickets','tickets','기술지원'], reps:['reps','reps','담당자']};
  function deleteRecords(key, ids, after){
    const [table, field, label] = TABLES[key];
    if(key==='customers'){
      const used = ids.filter(id=>state.contracts.some(c=>c.customer_id===id) || state.maint.some(m=>mtCustomerId(m)===id) || state.tickets.some(t=>t.customer_id===id));
      if(used.length) return alert(`계약·유지보수·기술지원 기록이 있는 고객사 ${used.length}곳은 삭제할 수 없습니다.\n관련 기록을 먼저 정리해주세요.`);
    }
    if(key==='suppliers'){
      const used = ids.filter(id=>{ const c=customer(id); return c && partnerStats(c).its.length + partnerStats(c).mts.length > 0; });
      if(used.length) return alert(`계약 품목이나 유지보수에 쓰인 매입처 ${used.length}곳은 삭제할 수 없습니다.`);
    }
    askConfirm(`${label} ${ids.length}건을 삭제할까요?${key==='contracts'?'\n품목 정보도 함께 삭제됩니다.':''}`, async ()=>{
      let err=await dbDelete(table, ids); if(err) return fail('삭제 실패',err);
      if(key==='contracts'){ const itIds=state.items.filter(i=>ids.includes(i.contract_id)).map(i=>i.id); await dbDelete('contract_items',itIds); state.items=state.items.filter(i=>!ids.includes(i.contract_id)); }
      if(key==='customers'||key==='suppliers'){ const cIds=state.contacts.filter(x=>ids.includes(x.customer_id)).map(x=>x.id); await dbDelete('customer_contacts',cIds); state.contacts=state.contacts.filter(x=>!ids.includes(x.customer_id)); }
      state[field]=state[field].filter(x=>!ids.includes(x.id));
      ids.forEach(id=>state.sel[key].delete(id));
      after&&after(); showToast('삭제되었습니다.');
    });
  }

  // ================= attachments =================
  function renderAttachView(){
    const {kind,id}=state.attachView; const rec = kind==='ctr'?contractById(id):state.maint.find(x=>x.id===id);
    if(!rec||!rec.attachment_url) return '';
    const url=rec.attachment_url, name=rec.attachment_name||'첨부파일', ext=(name.split('.').pop()||'').toLowerCase();
    const body = ext==='pdf' ? `<iframe src="${esc(url)}" style="width:100%; height:78vh; border:1px solid var(--grid);"></iframe>`
      : ['png','jpg','jpeg','gif','webp'].includes(ext) ? `<div style="text-align:center;"><img src="${esc(url)}" style="max-width:100%;"/></div>`
      : `<div class="empty"><p>미리보기를 지원하지 않는 형식입니다.</p><a class="btn-primary" style="text-decoration:none; display:inline-block;" href="${esc(url)}" target="_blank">${esc(name)} 다운로드</a></div>`;
    return `<div class="modal-bg" id="attBg" style="z-index:300;"><div class="modal wide"><div class="modal-head"><h3>${esc(name)}</h3><div style="display:flex; gap:8px; align-items:center;"><a class="btn-sm ghost" style="text-decoration:none;" href="${esc(url)}" target="_blank">새 창</a><button class="btn-sm danger" id="attDel">첨부 삭제</button><button class="modal-close" id="attClose">&times;</button></div></div><div class="modal-body">${body}</div></div></div>`;
  }
  function bindAttachments(){
    const fileInput=document.getElementById('attachFileInput');
    document.querySelectorAll('.attachAdd').forEach(b=>b.onclick=()=>{ state.attachTarget={kind:b.dataset.kind,id:b.dataset.id}; fileInput.click(); });
    document.querySelectorAll('.attachView').forEach(b=>b.onclick=()=>{ state.attachView={kind:b.dataset.kind,id:b.dataset.id}; render(); });
    fileInput.onchange=async ()=>{
      const file=fileInput.files[0]; if(!file||!state.attachTarget) return;
      const {kind,id}=state.attachTarget, table=kind==='ctr'?'contracts':'maintenance_contracts';
      const safe=file.name.replace(/[^\w.\-가-힣]/g,'_'); const path=`${kind}/${id}/${Date.now()}_${safe}`;
      const up=await sb.storage.from('attachments').upload(path,file,{upsert:true}); if(up.error){ fileInput.value=''; return fail('업로드 실패',up.error); }
      const url=sb.storage.from('attachments').getPublicUrl(path).data.publicUrl;
      const { error } = await sb.from(table).update({attachment_url:url, attachment_name:file.name, attachment_path:path}).eq('id',id); if(error){ fileInput.value=''; return fail('저장 실패',error); }
      const rec=(kind==='ctr'?state.contracts:state.maint).find(x=>x.id===id); if(rec){ rec.attachment_url=url; rec.attachment_name=file.name; rec.attachment_path=path; }
      fileInput.value=''; showToast('첨부되었습니다.');
    };
    const bg=document.getElementById('attBg');
    if(bg){
      document.getElementById('attClose').onclick=()=>{ state.attachView=null; render(); };
      bg.addEventListener('click',e=>{ if(e.target===bg){ state.attachView=null; render(); } });
      document.getElementById('attDel').onclick=()=>{ const {kind,id}=state.attachView; askConfirm('첨부된 문서를 삭제할까요?', async ()=>{
        const table=kind==='ctr'?'contracts':'maintenance_contracts', rec=(kind==='ctr'?state.contracts:state.maint).find(x=>x.id===id);
        if(rec && rec.attachment_path) await sb.storage.from('attachments').remove([rec.attachment_path]);
        await sb.from(table).update({attachment_url:null, attachment_name:null, attachment_path:null}).eq('id',id);
        if(rec){ rec.attachment_url=null; rec.attachment_name=null; rec.attachment_path=null; }
        state.attachView=null; showToast('첨부가 삭제되었습니다.');
      }); };
    }
  }

  // ================= excel =================
  function exportExcel(){
    let rows=[], name='';
    if(state.tab==='customers'||state.tab==='suppliers'){ const kind=state.tab==='suppliers'?'supplier':'customer'; name=kind==='supplier'?'매입처':'고객사'; partnersOf(kind).forEach(c=>{ const cs=contactsOf(c.id); (cs.length?cs:[{}]).forEach(x=>rows.push({'업체명':c.name,'사업자번호':c.biz_reg_no||'','세금계산서메일':c.tax_email||'','담당자명':x.name||'','부서':x.dept||'','연락처':x.phone||'','이메일':x.email||''})); }); }
    if(state.tab==='contracts'){ name='계약관리'; state.contracts.forEach(c=>{ const its=itemsOf(c.id); const ct=contact(c.contact_id); (its.length?its:[{}]).forEach(i=>rows.push({'계약코드':c.code,'구분':c.deal_type||'신규','계약명':c.name,'고객사':custName(c.customer_id),'고객담당자':ct?ct.name:'','앤드유저':c.end_user_name||'','제품':i.product||'','수량':i.qty||'','매출':num(i.sale_amount),'매입처':supplierLabel(i.supplier_id,i.supplier),'매입':num(i.purchase_amount),'이익':num(i.sale_amount)-num(i.purchase_amount),'단계':c.stage,'계약일':c.contract_date||'','만료일':c.expiry_date||'','영업담당':repDisplay(c.sales_rep),'갱신완료':c.renewed?'Y':''})); }); }
    if(state.tab==='maint'){ name='유지보수관리'; state.maint.forEach(m=>{ const t=mtTotals(m); rows.push({'구분':m.deal_type||'신규','유지보수명':m.name,'고객사':custName(mtCustomerId(m)),'결제주기':m.billing_cycle||'','시작일':m.start_date||'','만료일':m.end_date||'','매출':t.sale,'매입처':supplierLabel(m.supplier_id,m.supplier),'매입':t.purchase,'이익':t.profit,'담당':repDisplay(m.sales_rep),'갱신완료':m.renewed?'Y':''}); }); }
    if(state.tab==='support'){ name='기술지원'; state.tickets.forEach(t=>{ const ct=contact(t.contact_id); rows.push({'번호':t.code,'접수일':t.received_date||'','고객사':custName(t.customer_id),'고객담당자':ct?ct.name:'','제품':t.product||'','요청내용':t.request||'','엔지니어':repDisplay(t.assignee),'방식':t.method||'','지원내용':t.action||'','상태':t.status||'','완료일':t.done_date||''}); }); }
    if(!rows.length) return alert('내보낼 데이터가 없습니다.');
    const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), name); XLSX.writeFile(wb, `${name}_${todayStr()}.xlsx`);
  }
  function downloadPartnerTemplate(){
    const sup = state.tab==='suppliers';
    const ex = sup ? ['(예) ○○총판','123-45-67890','tax@dist.co.kr','이영업','파트너영업팀','010-1234-5678','lee@dist.co.kr'] : ['(예) 유니온테크','123-45-67890','tax@union.co.kr','홍길동','IT팀 과장','010-1234-5678','hong@union.co.kr'];
    const ws=XLSX.utils.aoa_to_sheet([['업체명','사업자번호','세금계산서메일','담당자명','부서','연락처','이메일'], ex, [ex[0],'','','김영희','구매팀','010-2222-3333','kim@example.com']]);
    ws['!cols']=[{wch:18},{wch:14},{wch:22},{wch:10},{wch:12},{wch:15},{wch:22}];
    const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, sup?'매입처':'고객사'); XLSX.writeFile(wb, sup?'매입처_가져오기_양식.xlsx':'고객사_가져오기_양식.xlsx');
  }
  function importPartners(file, kind){
    const label = kind==='supplier'?'매입처':'고객사';
    const reader=new FileReader();
    reader.onload=async ev=>{
      try{
        const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
        const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
        const existing=partnersOf(kind), newCusts=[], updCusts=[], newContacts=[];
        rows.forEach(r=>{
          const name=String(r['업체명']||'').trim(); if(!name || name.startsWith('(예)')) return;
          let c=existing.find(x=>x.name===name)||newCusts.find(x=>x.name===name);
          if(!c){ c={id:uid(kind==='supplier'?'sp':'cu'), code:nextCode(kind==='supplier'?'SP':'CT',[...existing,...newCusts]), name, kind, tax_email:'', biz_reg_no:'', sales_rep:state.user, reg_date:todayStr()}; newCusts.push(c); }
          const tax=String(r['세금계산서메일']||'').trim(), biz=String(r['사업자번호']||'').trim();
          let changed=false; if(tax && !c.tax_email){ c.tax_email=tax; changed=true; } if(biz && !c.biz_reg_no){ c.biz_reg_no=biz; changed=true; }
          if(changed && !newCusts.includes(c) && !updCusts.includes(c)) updCusts.push(c);
          const cn=String(r['담당자명']||'').trim();
          if(cn && ![...state.contacts,...newContacts].some(x=>x.customer_id===c.id && x.name===cn)) newContacts.push({id:uid('cc'), customer_id:c.id, name:cn, dept:String(r['부서']||'').trim(), phone:String(r['연락처']||'').trim(), email:String(r['이메일']||'').trim()});
        });
        if(!newCusts.length && !newContacts.length && !updCusts.length) return alert('새로 등록할 데이터가 없습니다. "업체명" 열을 확인해주세요.');
        let err; if(newCusts.length||updCusts.length){ err=await dbUpsert('customers',[...newCusts,...updCusts].map(custRow)); if(err) return fail(`${label} 등록 실패`,err); }
        if(newContacts.length){ err=await dbUpsert('customer_contacts',newContacts.map(contactRow)); if(err) return fail('담당자 등록 실패',err); }
        state.customers.unshift(...newCusts); state.contacts.push(...newContacts);
        showToast(`${label} ${newCusts.length}곳, 담당자 ${newContacts.length}명 등록${updCusts.length?` · ${updCusts.length}곳 정보 보완`:''}`);
      }catch(e){ alert('엑셀 파일을 읽지 못했습니다: '+e.message); }
    };
    reader.readAsArrayBuffer(file);
  }

  // ================= shell binding =================
  function bindShell(){
    document.querySelectorAll('.nav-item').forEach(el=>el.onclick=()=>{ state.tab=el.dataset.tab; state.expanded=null; state.excelMenu=false; Object.values(state.sel).forEach(s=>s.clear()); render(); window.scrollTo(0,0); });
    document.querySelectorAll('.nav-group').forEach(el=>el.onclick=()=>{ const g=el.dataset.group; const open=el.classList.contains('open'); LS.set('union-nav-'+g, open?'0':'1'); if(open && NAV.find(n=>n.group===g).items.some(([k])=>k===state.tab)){ state.tab='dashboard'; } render(); });
    document.querySelectorAll('[data-goto]').forEach(el=>el.onclick=()=>{ state.tab=el.dataset.goto; render(); });
    document.getElementById('logoutBtn').onclick=async ()=>{ await sb.auth.signOut(); state.view='login'; state.user=null; render(); };
    const nb=document.getElementById('notifyBtn');
    if(nb) nb.onclick=async ()=>{
      const p=notifyPerm();
      if(p==='denied') return alert('알림이 차단되어 있어요.\n주소창 왼쪽 자물쇠 아이콘 → 사이트 권한 → 알림을 "허용"으로 바꾼 뒤 새로고침해주세요.');
      if(p==='default'){ await Notification.requestPermission(); render(); if(notifyPerm()==='granted'){ showToast('갱신 알림이 켜졌습니다.'); checkNotifications(true); } return; }
      checkNotifications(true);
    };
    // table common
    document.querySelectorAll('.sort-th').forEach(el=>el.onclick=()=>{ const k=el.dataset.table, c=el.dataset.col; const st=state.sort[k]; state.sort[k] = st&&st.col===c ? {col:c, dir:st.dir==='asc'?'desc':'asc'} : {col:c, dir:'asc'}; render(); });
    document.querySelectorAll('.pageBtn').forEach(el=>el.onclick=()=>{ state.page[el.dataset.table]=+el.dataset.page; render(); });
    document.querySelectorAll('.toggleRow').forEach(el=>el.onclick=()=>{ state.expanded = state.expanded===el.dataset.id?null:el.dataset.id; render(); });
    document.querySelectorAll('.rowCheck').forEach(el=>el.onchange=()=>{ const s=state.sel[el.dataset.table]; el.checked?s.add(el.dataset.id):s.delete(el.dataset.id); render(); });
    document.querySelectorAll('.checkAll').forEach(el=>{ const k=el.dataset.table; const ids=[...document.querySelectorAll(`.rowCheck[data-table="${k}"]`)].map(x=>x.dataset.id); el.checked=ids.length>0 && ids.every(id=>state.sel[k].has(id)); el.onchange=()=>{ ids.forEach(id=>el.checked?state.sel[k].add(id):state.sel[k].delete(id)); render(); }; });
    document.querySelectorAll('.bulkDel').forEach(el=>el.onclick=()=>{ const k=el.dataset.table; if(!state.sel[k].size) return alert('삭제할 항목을 먼저 체크해주세요.'); deleteRecords(k,[...state.sel[k]]); });
    document.querySelectorAll('.searchBox').forEach(el=>{
      const k=el.dataset.table; let composing=false, t=null;
      const apply=()=>{ state.q[k]=el.value; state.page[k]=1; clearTimeout(t); t=setTimeout(()=>{ if(!composing) render(); },220); };
      el.addEventListener('compositionstart',()=>{ composing=true; });
      el.addEventListener('compositionend',()=>{ composing=false; apply(); });
      el.addEventListener('input',()=>{ if(!composing) apply(); else state.q[k]=el.value; });
    });
    document.querySelectorAll('.editTk').forEach(b=>b.onclick=()=>openTicketModal(state.tickets.find(t=>t.id===b.dataset.id)));
    document.querySelectorAll('.shareBtn').forEach(b=>b.onclick=e=>{ e.stopPropagation(); openShare(b.dataset.kind,b.dataset.id); });
    // excel
    const fab=document.getElementById('excelFab'); if(fab) fab.onclick=e=>{ e.stopPropagation(); state.excelMenu=!state.excelMenu; render(); };
    document.querySelectorAll('#excelMenu [data-x]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); state.excelMenu=false; const x=b.dataset.x; render(); if(x==='export') exportExcel(); if(x==='template') downloadPartnerTemplate(); if(x==='import') document.getElementById('importFileInput').click(); });
    const imp=document.getElementById('importFileInput'); imp.onchange=()=>{ const f=imp.files[0]; imp.value=''; if(f) importPartners(f, state.tab==='suppliers'?'supplier':'customer'); };
    if(state.excelMenu) setTimeout(()=>document.addEventListener('click', function h(e){ if(!e.target.closest('.excel-wrap')){ state.excelMenu=false; render(); } }, {once:true}),0);
    // confirm
    if(state.confirm){ document.getElementById('cfNo').onclick=()=>{ state.confirm=null; render(); }; document.getElementById('cfYes').onclick=()=>{ const fn=state.confirm.onYes; state.confirm=null; render(); fn&&fn(); }; }
    ({dashboard:bindDashboard, customers:()=>bindPartners('customer'), suppliers:()=>bindPartners('supplier'), contracts:bindContracts, maint:bindMaint, support:bindSupport, reps:bindReps})[state.tab]();
    bindAttachments();
    bindModal();
    bindShare();
  }

  async function init(){
    try{
      const { data } = await sb.auth.getSession();
      if(data && data.session){ const u=data.session.user; state.user=(u.user_metadata&&u.user_metadata.name)||u.email; state.userEmail=u.email; state.view='main'; await loadAll(); return; }
    }catch(e){}
    render();
  }
  init();
  setInterval(()=>{ if(state.view==='main' && !state.loading) checkNotifications(); }, 60*60*1000);
})();
</script>
</body>
