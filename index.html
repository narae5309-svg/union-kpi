<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>UNION 사업관리</title>
<link rel="manifest" href="/manifest.webmanifest"/>
<meta name="theme-color" content="#1c2834"/>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png"/>
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="UNION"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg:#f4f7f8; --grid:#dbe4e6; --grid-strong:#b7c6c9; --header-fill:#e3f6f5;
    --accent:#0fb4ae; --accent-dark:#0b8f8a; --accent2:#2d6ae3;
    --warn:#b3261e; --warn-bg:#fdecea; --orange:#c25e00; --orange-bg:#fff0e0; --gold:#8a6d1f; --gold-bg:#fff6d9;
    --ink:#1f2b2b; --ink-soft:#5c7273; --card:#ffffff; --radius:6px;
  }
  *{box-sizing:border-box;} body{margin:0; background:var(--bg);}
  .app{font-family:'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif; color:var(--ink); background:var(--bg); min-height:100vh; font-size:13px;}
  .num{font-family:Consolas,'SF Mono',monospace; font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap;}
  h1,h2,h3,h4{margin:0; font-weight:600;}
  button{font-family:inherit;}

  /* login */
  .login-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(160deg,#eaf7f6 0%,#f4f7f8 55%,#eef2f0 100%); padding:16px;}
  .login-card{background:#fff; width:380px; max-width:100%; padding:44px 36px; border-radius:14px; box-shadow:0 20px 45px rgba(15,180,174,.14), 0 2px 8px rgba(0,0,0,.04); text-align:center;}
  .login-card .logo{font-size:26px; font-weight:800; letter-spacing:1px; margin-bottom:22px; font-style:italic;}
  .login-card h1{font-size:17px; font-weight:700;}
  .login-card p.sub{color:var(--ink-soft); font-size:12px; margin:6px 0 24px;}
  .login-card input{width:100%; padding:12px 14px; font-size:14px; border:1px solid transparent; background:#eef4f5; margin-bottom:12px; border-radius:8px; font-family:inherit;}
  .login-card input:focus{outline:none; border-color:var(--accent); background:#fff;}
  .login-card .keep-login{display:flex; justify-content:flex-start; align-items:center; gap:6px; margin:2px 2px 14px; font-size:13px; text-align:left;}
  .login-card .keep-login input{width:auto; margin:0; padding:0;}

  .btn-primary{background:var(--accent); color:#fff; border:none; padding:9px 16px; font-size:13px; font-weight:700; cursor:pointer; border-radius:var(--radius);}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-primary.block{width:100%; padding:11px; font-size:14px;}
  .btn-sm{background:#fff; border:1.5px solid var(--accent); color:var(--accent-dark); font-weight:700; padding:5px 11px; cursor:pointer; font-size:12px; border-radius:var(--radius); white-space:nowrap;}
  .btn-sm:hover{background:var(--accent); color:#fff;}
  .btn-sm.ghost{border-color:var(--grid-strong); color:var(--ink-soft);}
  .btn-sm.ghost:hover{background:var(--ink-soft); color:#fff; border-color:var(--ink-soft);}
  .btn-sm.danger{border-color:var(--warn); color:var(--warn);}
  .btn-sm.danger:hover{background:var(--warn); color:#fff;}
  .btn-sm.blue{border-color:var(--accent2); color:var(--accent2);}
  .btn-sm.blue:hover{background:var(--accent2); color:#fff;}
  .btn-sm:disabled{opacity:.4; cursor:default;}
  .icon-btn{width:26px; height:26px; display:inline-flex; align-items:center; justify-content:center; border-radius:4px; border:1.5px solid var(--accent); background:#fff; color:var(--accent-dark); cursor:pointer; font-size:12px; padding:0; line-height:1; vertical-align:middle; position:relative;}
  .icon-btn:hover{background:var(--accent); color:#fff;}
  .icon-btn.danger{border-color:var(--warn); color:var(--warn); font-weight:800; font-size:15px;}
  .icon-btn.danger:hover{background:var(--warn); color:#fff;}
  .icon-btn .cnt-dot{position:absolute; top:-7px; right:-7px; background:var(--warn); color:#fff; border-radius:8px; font-size:9px; padding:1px 4px; line-height:1.2; font-weight:700;}

  /* shell */
  .shell{display:flex; min-height:100vh;}
  .sidebar{width:196px; background:#1b2733; color:#cfd6dd; flex-shrink:0; display:flex; flex-direction:column; padding:20px 0; position:sticky; top:0; height:100vh;}
  .brand{padding:0 18px 16px; border-bottom:1px solid #2e3c4a; margin-bottom:6px;}
  .brand h2{font-size:16px; color:#fff; font-style:italic; letter-spacing:.5px;}
  .brand .who{font-size:11px; color:#8b95a1; margin-top:5px;}
  .nav{display:flex; flex-direction:column;}
  .nav-item{padding:10px 18px; cursor:pointer; font-size:13px; border-left:3px solid transparent; display:flex; justify-content:space-between; align-items:center; white-space:nowrap;}
  .nav-item:hover{background:#243342;}
  .nav-item.active{background:#243342; color:#fff; border-left-color:var(--accent);}
  .nav-group{padding:10px 18px; font-size:13px; color:#cfd6dd; cursor:pointer; display:flex; justify-content:space-between; align-items:center; border-left:3px solid transparent; user-select:none;}
  .nav-group:hover{background:#243342;}
  .nav-group .caret{font-size:10px; color:#8b95a1;}
  .nav-item.sub{padding-left:30px;}
  .tab-btn.warn-tab:not(.active){border-color:#f0b5b0; color:var(--warn);}
  .nav-badge{background:var(--warn); color:#fff; border-radius:10px; font-size:10.5px; font-weight:700; padding:1px 7px; min-width:20px; text-align:center;}
  .nav-badge.soft{background:#3a4b5c; color:#dfe6ec;}
  .side-bottom{margin-top:auto;}
  .stats-nav{margin:6px 0 2px; border-top:1px solid #2e3c4a; padding-top:12px !important;}
  .st-filter{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px;}
  .st-filter select, .st-filter input{padding:7px 9px; border:1px solid var(--grid-strong); border-radius:var(--radius); font-size:13px; font-family:inherit; background:#fff;}
  .st-grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin-bottom:14px;}
  @media (max-width:1100px){ .st-grid{grid-template-columns:1fr;} }
  .st-card{background:#fff; border:1px solid var(--grid); border-radius:var(--radius); padding:14px 16px;}
  .st-card h4{margin:0 0 10px; font-size:13px; color:var(--ink);}
  .st-row{display:grid; grid-template-columns:88px 1fr auto; gap:10px; align-items:center; padding:7px 8px; border-radius:6px; cursor:pointer; font-size:13px;}
  .st-row:hover{background:#f2f8f7;} .st-row.on{background:#e3f3f1; font-weight:700;}
  .st-row .amt{text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums;}
  .st-row .amt small{display:block; color:var(--ink-soft); font-weight:400; font-size:11px;}
  .st-bar{height:8px; background:#eef2f3; border-radius:4px; overflow:hidden;} .st-bar i{display:block; height:100%; background:var(--accent); border-radius:0 4px 4px 0;}
  .st-row .cnt{font-weight:700;}
  .st-month td .st-bar{min-width:80px;}
  .notify-btn{margin:10px 14px 0; padding:7px 10px; border:1px solid #2e3c4a; border-radius:var(--radius); font-size:12px; cursor:pointer;}
  .notify-btn:hover{background:#243342;}
  .nav-footer{padding:12px 18px 0; margin-top:12px; border-top:1px solid #2e3c4a;}
  .conn-info{margin-top:8px; font-size:10px; color:#6f7c88; line-height:1.5; word-break:break-all;}
  .logout-link{color:#8b95a1; font-size:11px; cursor:pointer;}
  .logout-link:hover{color:#fff;}

  .main{flex:1; padding:24px 30px 80px; min-width:0;}
  .page-head{display:flex; justify-content:space-between; align-items:flex-end; gap:12px; margin-bottom:18px; flex-wrap:wrap;}
  .page-title{font-size:19px; font-weight:700;}
  .page-sub{color:var(--ink-soft); font-size:12px; margin-top:3px;}

  .card{background:var(--card); border:1px solid var(--grid); border-radius:var(--radius); padding:18px; margin-bottom:16px;}
  .card.flush{padding:0; overflow-x:auto;}
  .card-title{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--accent-dark); margin-bottom:12px; display:flex; justify-content:space-between; align-items:center;}

  .setup-banner{background:var(--gold-bg); border:1px solid #e3c873; color:#5d4a12; border-radius:var(--radius); padding:12px 16px; margin-bottom:16px; font-size:12.5px; line-height:1.6;}

  /* toolbar & tabs */
  .toolbar{display:flex; gap:8px; margin-bottom:12px; align-items:center; flex-wrap:wrap;}
  .toolbar .spacer{flex:1;}
  .toolbar input, .toolbar select{padding:7px 9px; border:1px solid var(--grid-strong); border-radius:var(--radius); font-family:inherit; font-size:12.5px; background:#fff;}
  .chk{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; color:var(--ink-soft); cursor:pointer; user-select:none;}
  .tabs{display:flex; gap:4px; margin-bottom:12px; flex-wrap:wrap;}
  .tab-btn{padding:7px 14px; background:#fff; border:1px solid var(--grid); cursor:pointer; font-size:12.5px; font-weight:600; color:var(--ink-soft); border-radius:16px;}
  .tab-btn .cnt{color:var(--accent-dark); font-family:Consolas,monospace; margin-left:3px;}
  .tab-btn.active{background:var(--accent-dark); color:#fff; border-color:var(--accent-dark);}
  .tab-btn.active .cnt{color:#d8fffc;}

  /* tables */
  table{width:100%; border-collapse:separate; border-spacing:0; font-size:12.5px;}
  th{text-align:center; padding:8px 7px; background:var(--header-fill); border-bottom:1px solid var(--grid); font-weight:700; color:var(--accent-dark); font-size:11.5px; white-space:nowrap;}
  td{padding:7px; border-bottom:1px solid var(--grid); vertical-align:middle; text-align:center;}
  th.tl, td.tl{text-align:left;}
  th.num, td.num{text-align:right;}
  tr.detail > td{text-align:left;}
  td .clip{margin:0;}
  tbody tr:hover > td{background:#effaf9;}
  tr.row-warn > td{background:#fff8f0;}
  tr.row-over > td{background:#fdf1f0;}
  tr.detail > td{background:#fafcfb !important; padding:0;}
  tr.total > td{font-weight:700; background:#f7fbfb;}
  .date-th{cursor:pointer; user-select:none; padding:2px 6px; border-radius:5px; margin-right:2px;}
  .date-th:hover{background:#cdeeed;}
  .date-th.on{background:var(--accent-dark); color:#fff;}
  .range-chip{display:inline-flex; align-items:center; gap:6px; background:var(--accent-dark); color:#fff; border-radius:14px; padding:5px 6px 5px 12px; font-size:12px; font-weight:600; white-space:nowrap;}
  .range-chip button{border:none; background:rgba(255,255,255,.25); color:#fff; width:18px; height:18px; border-radius:50%; cursor:pointer; line-height:1; font-size:13px; padding:0;}
  .date-pop{position:fixed; z-index:260; width:330px; background:#fff; border:1px solid var(--grid-strong); border-radius:10px; box-shadow:0 12px 30px rgba(0,0,0,.18); padding:14px;}
  .dp-title{font-weight:700; font-size:13px; margin-bottom:10px;}
  .dp-quick{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;}
  .dp-quick button{border:1px solid var(--grid-strong); background:#fff; border-radius:14px; padding:4px 10px; font-size:12px; cursor:pointer;}
  .dp-quick button:hover{border-color:var(--accent); color:var(--accent-dark);}
  .dp-row{display:flex; align-items:center; gap:6px; margin-bottom:12px;}
  .dp-row input{flex:1; min-width:0; padding:6px 8px; border:1px solid var(--grid-strong); border-radius:var(--radius); font-family:inherit; font-size:12.5px;}
  .dp-acts{display:flex; justify-content:flex-end; gap:6px;}
  .sort-th{cursor:pointer; user-select:none; display:inline-flex; align-items:center; gap:4px;}
  .sort-arrow{font-size:8px; color:#c3ccce;}
  .sort-arrow.on{color:var(--accent-dark);}
  .link{cursor:pointer; color:var(--accent-dark); text-decoration:underline dotted; text-underline-offset:3px;}
  .muted{color:var(--ink-soft);}
  .small{font-size:11.5px;}
  .nowrap{white-space:nowrap;}
  .clip{max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .detail-box{padding:14px 18px; font-size:12.5px; line-height:1.6;}
  .detail-box table{border:1px solid var(--grid); margin:6px 0 10px; background:#fff;}
  .detail-box th{background:#f2f7f7;}
  .pr-preview{border:1px solid var(--grid-strong); border-radius:var(--radius); background:#fff; width:100%; height:440px; display:block;}
  .date-wrap{position:relative; display:inline-block; width:100%;}
  .date-wrap .date-txt{width:100%; padding-right:30px !important; font-variant-numeric:tabular-nums;}
  .date-wrap .date-txt.bad{border-color:#d0312d !important; background:#fff5f5 !important;}
  .date-wrap .date-pick{position:absolute; right:4px; bottom:2px; width:24px; height:0; padding:0; border:0; opacity:0; pointer-events:none;}
  .date-wrap .date-btn{position:absolute; right:4px; top:50%; transform:translateY(-50%); width:24px; height:24px; border:none; background:none; color:var(--ink-soft); cursor:pointer; padding:0; display:flex; align-items:center; justify-content:center; border-radius:4px;}
  .date-wrap .date-btn:hover{background:#eef4f4; color:var(--accent-dark);}
  .date-pop .date-wrap, .dp-row .date-wrap{width:auto; flex:1;}
  .plus-menu{position:fixed; z-index:400; background:#fff; border:1px solid var(--grid-strong); border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.14); padding:5px; min-width:220px;}
  .plus-menu button{display:flex; flex-direction:column; align-items:flex-start; gap:1px; width:100%; border:none; background:none; padding:8px 10px; border-radius:7px; cursor:pointer; text-align:left; font-family:inherit;}
  .plus-menu button:hover{background:#eef7f6;}
  .plus-menu b{font-size:13px; color:var(--ink);} .plus-menu span{font-size:11.5px; color:var(--ink-soft);}
  .icon-btn.plusBtn{font-size:17px; font-weight:700; line-height:1; color:var(--accent-dark);}
  .wtabs{display:flex; gap:4px; flex-wrap:wrap; margin:-6px 0 16px; padding-bottom:0; border-bottom:1px solid var(--grid-strong);}
  .wtab{display:flex; align-items:center; gap:6px; padding:7px 8px 7px 14px; font-size:12.5px; color:var(--ink-soft); background:#eef2f3; border:1px solid var(--grid-strong); border-bottom:none; border-radius:8px 8px 0 0; cursor:pointer; margin-bottom:-1px; user-select:none;}
  .wtab:hover{background:#f6f9f9; color:var(--ink);}
  .wtab.active{background:#fff; color:var(--accent-dark); font-weight:700; box-shadow:inset 0 2px 0 var(--accent);}
  .wtab-x{border:none; background:none; color:#9aa5ad; font-size:15px; line-height:1; width:18px; height:18px; border-radius:4px; cursor:pointer; padding:0;}
  .wtab-x:hover{background:#dde4e6; color:var(--ink);}
  .detail-box td.cs{background:#f5f9ff !important;} .detail-box th.cs, .detail-box tr.total td.cs{background:#ecf4fe !important;}
  .detail-box td.cb{background:#fffaf3 !important;} .detail-box th.cb, .detail-box tr.total td.cb{background:#fdf2e4 !important;}
  .detail-box td.cp{color:#d0312d !important;}
  .sup-new{color:var(--accent-dark); margin-top:2px; font-size:10.5px;}
  .money-sum{display:flex; gap:10px; flex-wrap:wrap; margin:6px 0 10px;}
  .money-sum > div{background:#fff; border:1px solid var(--grid); border-radius:var(--radius); padding:7px 12px; min-width:130px;}
  .money-sum span{display:block; font-size:11px; color:var(--ink-soft);}
  .money-sum b{font-family:Consolas,'SF Mono',monospace; font-size:14px;}
  .detail-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:4px 18px; margin-bottom:8px;}

  .badge{display:inline-block; padding:2px 8px; border-radius:10px; font-size:10.5px; font-weight:700; white-space:nowrap;}
  .badge.blue{background:#e8edfb; color:var(--accent2);}
  .badge.green{background:#e3f4ee; color:var(--accent-dark);}
  .badge.warn{background:var(--warn-bg); color:var(--warn);}
  .badge.orange{background:var(--orange-bg); color:var(--orange);}
  .badge.gold{background:var(--gold-bg); color:var(--gold);}
  .badge.gray{background:#eef1f2; color:#5c6b6c;}
  .badge.purple{background:#f0eafc; color:#6a3fc1;}

  .empty{text-align:center; padding:36px 20px; color:var(--ink-soft); font-size:12.5px;}
  .pager{display:flex; justify-content:center; align-items:center; gap:10px; padding:12px; border-top:1px solid var(--grid);}

  /* dashboard */
  .kpis{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:16px;}
  .kpi{background:#fff; border:1px solid var(--grid); border-radius:var(--radius); padding:14px 16px; cursor:default;}
  .kpi.click{cursor:pointer;}
  .kpi.click:hover{border-color:var(--accent);}
  .kpi .lbl{font-size:11.5px; color:var(--ink-soft); font-weight:600;}
  .kpi .val{font-size:22px; font-weight:800; margin-top:6px; font-family:Consolas,'SF Mono',monospace;}
  .kpi .sub{font-size:11px; color:var(--ink-soft); margin-top:3px;}
  .kpi.alert .val{color:var(--warn);}
  .board{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px;}
  .lane{background:#f7f9f9; border:1px solid var(--grid); border-radius:var(--radius); padding:10px; min-height:120px;}
  .lane-head{display:flex; justify-content:space-between; align-items:center; font-weight:700; font-size:12.5px; padding:2px 4px 10px;}
  .lane-head .count{font-family:Consolas,monospace; font-size:12px; padding:1px 8px; border-radius:10px;}
  .lane.over .lane-head{color:var(--warn);} .lane.over .count{background:var(--warn); color:#fff;}
  .lane.w1 .lane-head{color:var(--orange);} .lane.w1 .count{background:var(--orange); color:#fff;}
  .lane.m1 .lane-head{color:var(--gold);} .lane.m1 .count{background:#d9b23c; color:#fff;}
  .lane.m2 .lane-head{color:var(--ink-soft);} .lane.m2 .count{background:#9aa9ab; color:#fff;}
  .lane-list{max-height:430px; overflow-y:auto; display:flex; flex-direction:column; gap:8px;}
  .rcard{background:#fff; border:1px solid var(--grid); border-radius:var(--radius); padding:9px 10px; border-left:4px solid var(--grid-strong);}
  .lane.over .rcard{border-left-color:var(--warn);}
  .lane.w1 .rcard{border-left-color:var(--orange);}
  .lane.m1 .rcard{border-left-color:#d9b23c;}
  .rcard .t{font-weight:700; font-size:12.5px; margin:4px 0 2px; word-break:keep-all;}
  .rcard .s{font-size:11.5px; color:var(--ink-soft);}
  .rcard .row{display:flex; justify-content:space-between; align-items:center; gap:6px;}
  .rcard .acts{display:flex; gap:5px; margin-top:8px;}
  .dday{font-family:Consolas,monospace; font-weight:800; font-size:12px;}
  .lane.over .dday{color:var(--warn);} .lane.w1 .dday{color:var(--orange);} .lane.m1 .dday{color:var(--gold);}

  .icon-btn.shareBtn{border:none; color:#fff; background:linear-gradient(135deg,#3b7cf0 0%,#14b8a6 100%); box-shadow:0 2px 6px rgba(45,106,227,.28); border-radius:8px; transition:transform .12s, box-shadow .12s;}
  .icon-btn.shareBtn:hover{background:linear-gradient(135deg,#2f6be0 0%,#0fa597 100%); transform:translateY(-1px) rotate(-6deg); box-shadow:0 4px 10px rgba(45,106,227,.35);}
  .icon-btn.shareBtn svg{transform:translate(-1px,1px);}
  .modal-head h3 svg{color:#2d6ae3;}
  .ch-tabs{display:flex; gap:6px; margin-bottom:12px;}
  .ch-tab{flex:1; padding:10px; border:1.5px solid var(--grid-strong); border-radius:8px; background:#fff; font-size:13.5px; font-weight:700; color:var(--ink-soft); cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;}
  .ch-tab.on{border-color:var(--accent-dark); color:var(--accent-dark); background:var(--header-fill);}
  .kk{display:inline-flex; width:20px; height:20px; border-radius:6px; background:#fee500; align-items:center; justify-content:center;}
  .recips{border:1px solid var(--grid-strong); border-radius:var(--radius); max-height:170px; overflow-y:auto; padding:4px 8px;}
  .recip{display:flex; align-items:center; gap:6px; padding:5px 0; font-size:12.5px; cursor:pointer; border-bottom:1px dashed var(--grid);}
  .recip:last-child{border-bottom:none;}
  .field .recip{display:flex; margin:0; font-size:12.5px; color:var(--ink); font-weight:400;}
  .field .recip input{width:auto; padding:0; margin:0; flex-shrink:0;}
  .recip b{font-weight:600;}
  .mail-acts{display:flex; gap:8px; align-items:center; margin-bottom:6px;}
  .seg{display:flex; border:1px solid var(--grid-strong); border-radius:8px; overflow:hidden;}
  .seg-btn{flex:1; padding:9px; border:none; background:#fff; font-size:13px; font-weight:600; color:var(--ink-soft); cursor:pointer;}
  .seg-btn + .seg-btn{border-left:1px solid var(--grid-strong);}
  .seg-btn.on{background:var(--accent-dark); color:#fff;}

  const num = v => { const n = Number(String(v==null?'':v).replace(/,/g,'')); return isFinite(n)?n:0; };

  function fmt(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function todayStr(){ return fmt(new Date()); }
  function parseD(s){ const [y,m,d]=String(s).split('-').map(Number); return new Date(y,(m||1)-1,d||1); }
  function addDays(s,n){ const d=parseD(s); d.setDate(d.getDate()+n); return fmt(d); }
  function addMonths(s,n){ const d=parseD(s); const day=d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n); const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); d.setDate(Math.min(day,last)); return fmt(d); }
  function daysUntil(s){ if(!s) return null; return Math.round((parseD(s)-parseD(todayStr()))/86400000); }
  function ddayLabel(d){ return d===0?'D-Day':d>0?'D-'+d:'D+'+(-d); }
  function nextCode(prefix, list){ const compact=todayStr().replace(/-/g,'').slice(2); const n=list.filter(x=>x.code && String(x.code).startsWith(prefix+compact)).length+1; return prefix+compact+'-'+String(n).padStart(3,'0'); }
  function excelDate(val){

    return s.replace(/\./g,'-').replace(/\//g,'-');
  }

  function contractTotals(c){
    const its = itemsOf(c.id);

    const sale = its.reduce((s,i)=>s+num(i.sale_amount),0), purchase = its.reduce((s,i)=>s+num(i.purchase_amount),0);

  }

  // ---- renewal / expiry ----
  function periodState(end, renewed, dismissed){
    if(!end) return 'perm';
    if(renewed) return 'renewed';
    if(dismissed) return 'closed';
    const d = daysUntil(end);
    if(d<0) return 'expired';
    return 'active';
  }
  // ---- 품목별 만료일 ----
  const itemEnd = (i,c) => i.end_date || c.expiry_date || '';
  const itemDone = (i,c) => !!(i.renewed || i.closed || c.renewed || c.alert_dismissed);
  function ctrGroups(c){
    const its=itemsOf(c.id);
    if(its.length===0) return c.expiry_date ? [{end:c.expiry_date, items:[], done:!!(c.renewed||c.alert_dismissed), renewed:!!c.renewed}] : [];
    const map={};
    its.forEach(i=>{ const e=itemEnd(i,c); if(!e) return; (map[e]=map[e]||[]).push(i); });
    return Object.keys(map).sort().map(e=>{ const items=map[e]; const done=items.every(i=>itemDone(i,c)); return {end:e, items, done, renewed: done && items.some(i=>i.renewed||c.renewed)}; });
  }
  function ctrState(c){
    const g=ctrGroups(c);
    if(g.length===0) return {end:'', renewed:false, dismissed:false, extra:0, groups:g};
    const open=g.filter(x=>!x.done);
    if(open.length) return {end:open[0].end, renewed:false, dismissed:false, extra:open.length-1, groups:g};
    const anyRenewed=g.some(x=>x.renewed);
    return {end:g[g.length-1].end, renewed:anyRenewed, dismissed:!anyRenewed, extra:0, groups:g};
  }
  function groupLabel(c, g){
    const multi = ctrGroups(c).length>1;
    if(!multi || !g.items.length) return '';
    return g.items[0].product + (g.items.length>1?` 외 ${g.items.length-1}`:'');
  }
  function renewalList(){
    const out=[];
    state.contracts.forEach(c=>{
      ctrGroups(c).forEach(g=>{
        if(g.done) return;
        const d=daysUntil(g.end); if(d<-90||d>60) return;
        const amount = g.items.length ? g.items.reduce((s,i)=>s+num(i.sale_amount),0) : contractTotals(c).sale;
        out.push({kind:'ctr', rec:c, id:c.id, key:'ctr'+c.id+g.end, name:c.name, sub:groupLabel(c,g), customerId:c.customer_id, end:g.end, d, rep:c.sales_rep, alertDays:num(c.alert_days)||30, amount});
      });
    });
    state.maint.forEach(m=>{
      if(m.renewed||m.alert_dismissed||!m.end_date) return;
      const d=daysUntil(m.end_date); if(d<-90||d>60) return;
      out.push({kind:'mt', rec:m, id:m.id, key:'mt'+m.id, name:m.name, sub:'', customerId:mtCustomerId(m), end:m.end_date, d, rep:m.sales_rep, alertDays:num(m.alert_days)||30, amount:num(m.amount)});
    });
    return out.sort((a,b)=>a.d-b.d);
  }
  function periodTabMatch(tab, end, renewed, dismissed){
    if(tab==='전체') return true;
    const st=periodState(end,renewed,dismissed), d=daysUntil(end);
    if(tab==='갱신임박(30일)') return st==='active' && d<=30;
    if(tab==='진행중') return st==='active' || st==='perm';
    if(tab==='미처리') return st==='expired';
    if(tab==='완료(종료)') return st==='renewed' || st==='closed';
    return true;
  }
  function periodTabsHTML(list, getSt, cur, cls){
    const cnt = t => list.filter(x=>{ const st=getSt(x); return periodTabMatch(t, st.end, st.renewed, st.dismissed); }).length;
    return `<div class="tabs">${PERIOD_TABS.map(t=>`<div class="tab-btn ${cls} ${cur===t?'active':''} ${t==='미처리'&&cnt(t)?'warn-tab':''}" data-t="${t}">${t}<span class="cnt">${cnt(t)}</span></div>`).join('')}</div>`;
  }
  const bucketOf = d => d<0?'over':d<=7?'w1':d<=30?'m1':'m2';

  function ddayBadge(end, renewed, dismissed, alertDays){
    const st = periodState(end, renewed, dismissed);
    if(st==='perm') return '<span class="badge purple">영구</span>';
    if(st==='renewed') return '<span class="badge green">갱신완료</span>';
    if(st==='closed') return '<span class="badge gray">종료</span>';
    const d = daysUntil(end);
    if(d<0) return `<span class="badge warn">만료 ${ddayLabel(d)}</span>`;
    if(d<=7) return `<span class="badge orange">${ddayLabel(d)}</span>`;
    if(d<=(alertDays||30)) return `<span class="badge gold">${ddayLabel(d)}</span>`;
    return `<span class="muted small">${ddayLabel(d)}</span>`;
  }

  // ================= data =================
  async function loadAll(){
    state.loading=true; render();
    const tables = [['reps','reps'],['customers','customers'],['contacts','customer_contacts'],['contracts','contracts'],['items','contract_items'],['tickets','support_tickets'],['quotes','quotes'],['pos','purchase_orders'],['companyRows','company_info']];
    const fetchAll = () => Promise.all(tables.map(([,t])=> t==='company_info' ? sb.from(t).select('*') : sb.from(t).select('*').order('created_at',{ascending:false})));
    const isAuthErr = r => r.error && /JWT|jwt|token|issued at future|expired/i.test(r.error.message||'');
    let res = await fetchAll();
    // 로그인 토큰 시간 차이(JWT issued at future 등)는 잠깐 기다렸다 다시 불러오면 해결됩니다
    for(let k=0; k<4 && res.some(isAuthErr); k++){
      await new Promise(r=>setTimeout(r, 1500*(k+1)));
      if(res.some(r=>isAuthErr(r) && /expired/i.test(r.error.message))){ try{ await sb.auth.refreshSession(); }catch(e){} }
      res = await fetchAll();
    }
    state.setupMissing = []; state.authProblem = '';
    res.forEach((r,i)=>{
      const [key,t]=tables[i];
      if(r.error){ state[key]=[]; if(isAuthErr(r)) state.authProblem=r.error.message; else state.setupMissing.push(t+': '+r.error.message); }
      else state[key]=r.data||[];
    });
    state.maint = [];
    state.company = (state.companyRows||[]).find(r=>r.id==='main') || {};
    if(!state.setupMissing.some(x=>x.startsWith('contract_items'))){
      const probe = await sb.from('contract_items').select('end_date,renewed,closed,unit_price').limit(1);
      if(probe.error) state.setupMissing.push('contract_items: 품목 단가·만료일 칸이 없습니다 (setup.sql 다시 실행 필요)');
      const probe2 = await sb.from('contracts').select('billing_cycle').limit(1);
      if(probe2.error) state.setupMissing.push('contracts: 결제주기 칸이 없고 기존 유지보수 자료가 아직 옮겨지지 않았습니다 (setup.sql 다시 실행 필요)');
    }
    let me = state.reps.find(r=>r.email && state.userEmail && r.email.toLowerCase()===state.userEmail.toLowerCase());
    if(!me && state.userEmail && !state.setupMissing.some(s=>s.startsWith('reps'))){
      const metaName = state.user && !String(state.user).includes('@') ? String(state.user).trim() : '';
      const byName = metaName && state.reps.find(r=>r.name===metaName);
      if(byName){
        // 가입할 때 넣은 이름과 같은 담당자가 이미 있으면 새로 만들지 않고 그 담당자에 로그인 이메일을 연결
        byName.email = state.userEmail;
        const { error } = await sb.from('reps').update({email:state.userEmail}).eq('id', byName.id);
        if(!error) me = byName;
      } else {
        // 처음 로그인한 사람을 담당자로 자동 등록 (담당자가 한 명도 없으면 관리자로)
        const r = {id:uid('rp'), name:metaName || state.userEmail, phone:'', email:state.userEmail, dept:'', is_admin: state.reps.length===0};
        const { error } = await sb.from('reps').insert(repRow(r));
        if(!error){ state.reps.unshift(r); me = r; }
      }
    }
    if(me && me.name) state.user = me.name;
    state.isAdmin = !!(me && me.is_admin) || !state.reps.some(r=>r.is_admin);
    state.loading=false;
    if(me && (!me.name || me.name.includes('@'))) openRepModal(me, '담당자 이름이 이메일로 되어 있어요. 계약·기술지원 화면에 보일 이름을 입력해 주세요. 담당자관리에 이미 본인 이름이 있다면 같은 이름을 입력하면 하나로 합쳐집니다.');
    render();
    checkNotifications();
  }
  async function dbUpsert(table, rows){ const { error } = await sb.from(table).upsert(rows); return error; }
  async function dbDelete(table, ids){ if(!ids.length) return null; const { error } = await sb.from(table).delete().in('id', ids); return error; }

  // ================= notifications =================
  function notifyPerm(){ return typeof window.Notification==='undefined' ? 'unsupported' : Notification.permission; }
  function notifiedKey(id){ return 'notified-'+id+'-'+todayStr(); }
  function wasNotified(id){ try{ return !!localStorage.getItem(notifiedKey(id)); }catch(e){ return false; } }
  function markNotified(id){ try{ localStorage.setItem(notifiedKey(id),'1'); }catch(e){} }
  function goToRenewal(item){
    try{ window.focus(); }catch(e){}
    if(item){ state.tab = item.kind==='ctr'?'contracts':'maint'; state.expanded = item.id; state.q[state.tab]=''; }
    else state.tab='dashboard';
    render();
  }
  function checkNotifications(force){
    if(notifyPerm()!=='granted') return;
    const due = renewalList().filter(x=>x.d<=x.alertDays);
    const targets = force ? due : due.filter(x=>!wasNotified(x.key));
    if(targets.length===0){ if(force) new Notification('갱신 알림', {body:'갱신이 필요한 계약·유지보수가 없습니다.', tag:'renew-none'}); return; }
    if(targets.length>3){
      const n = new Notification(`갱신 필요 ${targets.length}건`, { body: targets.slice(0,3).map(x=>`· [${x.kind==='ctr'?'제품':'유지보수'}] ${x.name} ${ddayLabel(x.d)}`).join('\n')+`\n외 ${targets.length-3}건`, tag:'renew-summary', requireInteraction:true });
      n.onclick=()=>{ n.close(); goToRenewal(null); };
    } else {

  // ---- 날짜 칸: 숫자만 연달아 입력해도 (20261001 → 2026-10-01) 되게, 달력 버튼은 그대로 ----
  function fmtDateDigits(v){
    const d=String(v||'').replace(/\D/g,'').slice(0,8);
    if(d.length<=4) return d;
    if(d.length<=6) return d.slice(0,4)+'-'+d.slice(4);
    return d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6);
  }
  function normDate(v){
    v=String(v||'').trim(); if(!v) return '';
    let d=v.replace(/\D/g,'');
    const m=/^(\d{2,4})[.\-\/\s]+(\d{1,2})[.\-\/\s]+(\d{1,2})$/.exec(v);
    if(m){ const y=m[1].length===2?'20'+m[1]:m[1]; d=y+m[2].padStart(2,'0')+m[3].padStart(2,'0'); }
    else if(d.length===6) d='20'+d;
    if(d.length!==8) return null;
    const y=+d.slice(0,4), mo=+d.slice(4,6), da=+d.slice(6,8), t=new Date(y,mo-1,da);
    if(t.getFullYear()!==y || t.getMonth()!==mo-1 || t.getDate()!==da) return null;
    return d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8);
  }
  function enhanceDates(scope){
    scope.querySelectorAll('input[type="date"]').forEach(el=>{
      const wrap=document.createElement('span'); wrap.className='date-wrap';
      el.parentNode.insertBefore(wrap, el); wrap.appendChild(el);
      el.type='text'; el.classList.add('date-txt'); el.setAttribute('inputmode','numeric'); el.setAttribute('maxlength','10'); el.setAttribute('autocomplete','off');
      if(!el.placeholder) el.placeholder='YYYY-MM-DD';
      if(el.value && normDate(el.value)===null) el.classList.add('bad');
      const pick=document.createElement('input'); pick.type='date'; pick.className='date-pick'; pick.tabIndex=-1; pick.value=el.value||'';
      const btn=document.createElement('button'); btn.type='button'; btn.className='date-btn'; btn.tabIndex=-1; btn.title='달력에서 고르기';
      btn.innerHTML='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>';
      if(el.disabled){ btn.disabled=true; }
      wrap.appendChild(pick); wrap.appendChild(btn);
      const fire=()=>{ el.dispatchEvent(new Event('input',{bubbles:true})); el.dispatchEvent(new Event('change',{bubbles:true})); };
      btn.onclick=()=>{ pick.value=normDate(el.value)||''; try{ pick.showPicker(); }catch(e){ pick.focus(); pick.click(); } };
      pick.addEventListener('change',()=>{ el.value=pick.value; el.classList.remove('bad'); fire(); });
      el.addEventListener('input',e=>{
        if(!e.isTrusted) return;
        const raw=el.value;
        if(/^\d[\d\-]*$/.test(raw) || raw==='') { const f=fmtDateDigits(raw); if(f!==raw){ el.value=f; try{ el.setSelectionRange(f.length,f.length); }catch(x){} } }
        el.classList.remove('bad');
      });
      el.addEventListener('change',e=>{
        if(!e.isTrusted || !el.value) return;
        const n=normDate(el.value);
        if(n===null){ e.stopImmediatePropagation(); el.classList.add('bad'); return; }
        if(n!==el.value) el.value=n;
      });
      el.addEventListener('blur',()=>{
        if(!el.value) return;
        const n=normDate(el.value);
        if(n===null){ el.classList.add('bad'); showToast('날짜는 8자리 숫자로 입력해 주세요 (예: 20261001)'); return; }
        if(n!==el.value){ el.value=n; fire(); }
      });
      el.addEventListener('keydown',e=>{ if(e.key==='Enter'){ const n=normDate(el.value); if(n && n!==el.value){ el.value=n; fire(); } } });
    });
  }

  function bindDashboard(){
    const m=document.getElementById('dashMine'); if(m) m.onchange=e=>{ state.f.dashMine=e.target.checked; render(); };
    document.querySelectorAll('.renewBtn').forEach(b=>b.onclick=()=>startRenewal(b.dataset.kind,b.dataset.id,b.dataset.end));
    document.querySelectorAll('.closeBtn').forEach(b=>b.onclick=()=>closeWithoutRenewal(b.dataset.kind,b.dataset.id,b.dataset.end));
    document.querySelectorAll('.openRenewal').forEach(b=>b.onclick=()=>{ const r=b.dataset.kind==='ctr'?contractById(b.dataset.id):state.maint.find(x=>x.id===b.dataset.id); if(b.dataset.kind==='ctr') openContractModal(r); else openMaintModal(r); });
    const add=document.getElementById('dashAddTk'); if(add) add.onclick=()=>openTicketModal(null);
    bindCalendar();
  }
  function startRenewal(kind,id,end){
    if(kind==='ctr'){ const c=contractById(id); if(c) openContractModal(null,{renewFrom:c, end:end||''}); }
    else { const m=state.maint.find(x=>x.id===id); if(m) openMaintModal(null,{renewFrom:m}); }
  }
  function closeWithoutRenewal(kind,id,end){
    const rec = kind==='ctr'?contractById(id):state.maint.find(x=>x.id===id); if(!rec) return;
    if(kind==='ctr' && itemsOf(rec.id).length){
      const g = ctrGroups(rec).filter(x=>!x.done && (!end || x.end===end));
      const its = g.flatMap(x=>x.items); if(!its.length) return;
      const names = its.map(i=>i.product).join(', ');
      return askConfirm(`"${rec.name}"\n${names}\n위 품목을 갱신하지 않고 종료 처리할까요?\n갱신 목록과 알림에서 빠집니다.`, async ()=>{
        its.forEach(i=>i.closed=true);
        let err = await dbUpsert('contract_items', its.map(itemRow));
        if(err){ its.forEach(i=>i.closed=false); return fail('처리 실패',err); }
        const st=ctrState(rec);
        if(!ctrGroups(rec).some(x=>!x.done) && !st.renewed && !rec.alert_dismissed){ rec.alert_dismissed=true; await dbUpsert('contracts',[ctrRow(rec)]); }
        showToast('종료 처리했습니다.');
      }, '종료 처리', false);
    }
    askConfirm(`"${rec.name}"\n갱신하지 않고 종료 처리할까요?\n갱신 목록과 알림에서 빠집니다.`, async ()=>{
      rec.alert_dismissed=true;
      const err = kind==='ctr' ? await dbUpsert('contracts',[ctrRow(rec)]) : await dbUpsert('maintenance_contracts',[mtRow(rec)]);
      if(err){ rec.alert_dismissed=false; fail('처리 실패',err); return; }
      showToast('종료 처리했습니다.');
    }, '종료 처리', false);
  }
  function periodRenewal(start, end){
    const newStart = addDays(end,1);
    let months = 12;
    if(start && end){ const days=(parseD(end)-parseD(start))/86400000+1; months = Math.max(1, Math.round(days/30.44)); }
    return {start:newStart, end:addDays(addMonths(newStart,months),-1)};
  }

  // ================= CALENDAR =================
  const KAKAO_ICON = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="#191919" d="M12 3.5C6.75 3.5 2.5 6.86 2.5 11c0 2.66 1.76 5 4.42 6.33l-.9 3.3c-.08.29.25.52.5.35l3.94-2.6c.5.06 1.01.1 1.54.1 5.25 0 9.5-3.36 9.5-7.48S17.25 3.5 12 3.5z"/></svg>';
  function calEvents(mine){
    const ev=[];
    state.contracts.forEach(c=>{
      if(mine && !isMine(c.sales_rep)) return;
      if(c.contract_date) ev.push({date:c.contract_date, type:'sign', kind:'ctr', id:c.id, name:c.name, cust:custName(c.customer_id), label:'계약'});
      const isMtC = c.deal_type==='유지보수';
      ctrGroups(c).forEach(g=>{ const sub=groupLabel(c,g); ev.push({date:g.end, end:g.end, type:g.done?'done':(isMtC?'mtend':'end'), kind:'ctr', id:c.id, name:c.name+(sub?' · '+sub:''), cust:custName(c.customer_id), label:g.done?(g.renewed?'갱신완료':'종료'):(isMtC?'유지보수 만료':'만료')}); });
    });
    state.maint.forEach(m=>{
      if(mine && !isMine(m.sales_rep)) return;
      if(m.end_date){ const done=m.renewed||m.alert_dismissed; ev.push({date:m.end_date, type:done?'done':'mtend', kind:'mt', id:m.id, name:m.name, cust:custName(mtCustomerId(m)), label:m.renewed?'갱신완료':m.alert_dismissed?'종료':'유지보수 만료'}); }
    });
    return ev;
  }
  function renderCalendar(){
    const mine=state.f.dashMine;
    const ym = state.cal || todayStr().slice(0,7);
    const [y,mo] = ym.split('-').map(Number);
    const first = new Date(y,mo-1,1), startDow=first.getDay(), days=new Date(y,mo,0).getDate();
    const evs = calEvents(mine).filter(e=>e.date && e.date.startsWith(ym));
    const byDay = {}; evs.forEach(e=>{ (byDay[e.date]=byDay[e.date]||[]).push(e); });
    const order={end:0, mtend:1, sign:2, done:3};
    Object.values(byDay).forEach(l=>l.sort((a,b)=>order[a.type]-order[b.type]));
    const today=todayStr();
    const sel = state.calDay && state.calDay.startsWith(ym) ? state.calDay : (today.startsWith(ym)?today:null);
    const cells=[];
    for(let i=0;i<startDow;i++) cells.push('<div class="cal-cell blank"></div>');
    for(let d=1; d<=days; d++){
      const ds=`${ym}-${String(d).padStart(2,'0')}`, l=byDay[ds]||[], dow=(startDow+d-1)%7;
      cells.push(`<div class="cal-cell ${ds===today?'today':''} ${ds===sel?'sel':''} ${dow===0?'sun':dow===6?'sat':''}" data-day="${ds}">
        <div class="cal-num">${d}</div>
        ${l.slice(0,3).map(e=>`<div class="chip ${e.type}" title="${esc(e.label+' · '+e.name+' · '+e.cust)}">${esc(e.name)}</div>`).join('')}
        ${l.length>3?`<div class="chip more">+${l.length-3}건</div>`:''}
        ${l.length?`<div class="cal-dots">${l.slice(0,4).map(e=>`<i class="${e.type}"></i>`).join('')}</div>`:''}
      </div>`);
    }
    const dayList = sel ? (byDay[sel]||[]) : [];
    const cnt = t => evs.filter(e=>e.type===t).length;
    return `<div class="card">
      <div class="card-title"><span>계약 일정 캘린더</span>
        <span class="cal-nav"><button class="btn-sm ghost" id="calPrev">‹</button><b id="calTitle">${y}년 ${mo}월</b><button class="btn-sm ghost" id="calNext">›</button><button class="btn-sm ghost" id="calToday">오늘</button></span>
      </div>
      <div class="cal-legend"><span><i class="end"></i>제품 만료 ${cnt('end')}</span><span><i class="mtend"></i>유지보수 만료 ${cnt('mtend')}</span><span><i class="sign"></i>계약 ${cnt('sign')}</span><span><i class="done"></i>갱신완료·종료 ${cnt('done')}</span></div>
      <div class="cal-wrap">
        <div class="cal">
          ${['일','월','화','수','목','금','토'].map((w,i)=>`<div class="cal-head ${i===0?'sun':i===6?'sat':''}">${w}</div>`).join('')}
          ${cells.join('')}
        </div>
        <div class="cal-day">
          <div class="cal-day-title">${sel?`${Number(sel.slice(5,7))}월 ${Number(sel.slice(8))}일 일정`:'날짜를 눌러 일정을 보세요'}</div>
          ${sel && dayList.length===0?'<div class="muted small">일정이 없습니다.</div>':''}
          ${dayList.map(e=>`<div class="cal-item ${e.type}">
            <div class="row"><span><span class="badge ${e.type==='sign'?'blue':e.type==='end'?'orange':e.type==='mtend'?'purple':'gray'}">${esc(e.label)}</span>${e.type!=='done'&&e.type!=='sign'?` <span class="dday">${ddayLabel(daysUntil(e.date))}</span>`:''}</span><button class="icon-btn shareBtn" data-kind="${e.kind}" data-id="${e.id}" title="보내기 (카톡·메일)">${SEND_ICON}</button></div>
            <div class="t link calOpen" data-kind="${e.kind}" data-id="${e.id}">${esc(e.name)}</div>
            <div class="s">${esc(e.cust)}</div>
            ${(e.type==='end'||e.type==='mtend')?`<div class="acts">${e.kind==='ctr'?`<button class="btn-sm ghost renewQuote" data-id="${e.id}" data-end="${e.end||''}">견적</button>`:''}<button class="btn-sm renewBtn" data-kind="${e.kind}" data-id="${e.id}" data-end="${e.end||''}">갱신 등록</button></div>`:''}
          </div>`).join('')}
        </div>
      </div>
    </div>`;
  }
  function bindCalendar(){
    const shift=n=>{ const ym=state.cal||todayStr().slice(0,7); const [y,m]=ym.split('-').map(Number); const d=new Date(y,m-1+n,1); state.cal=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; state.calDay=null; render(); };
    const p=document.getElementById('calPrev'); if(p) p.onclick=()=>shift(-1);
    const n=document.getElementById('calNext'); if(n) n.onclick=()=>shift(1);
    const t=document.getElementById('calToday'); if(t) t.onclick=()=>{ state.cal=null; state.calDay=todayStr(); render(); };
    document.querySelectorAll('.cal-cell[data-day]').forEach(el=>el.onclick=()=>{ state.calDay=el.dataset.day; render(); });
    document.querySelectorAll('.calOpen').forEach(el=>el.onclick=()=>{ if(el.dataset.kind==='ctr') openContractModal(contractById(el.dataset.id)); else openMaintModal(state.maint.find(m=>m.id===el.dataset.id)); });
  }

  // ================= SHARE (카톡) =================
  function shareText(kind, id, withAmount){
    const L=[];
    if(kind==='ctr'){
      const c=contractById(id); if(!c) return '';
      const ct=contact(c.contact_id), its=itemsOf(c.id), t=contractTotals(c), d=daysUntil(c.expiry_date);

  }

  const QUOTE_OPT_COLS=['renew_of','renew_end','end_user_name'];
  async function upsertQuotes(rows){
    state.quoteMissingCols=state.quoteMissingCols||new Set();
    const strip=rs=>rs.map(r=>{ const x={...r}; state.quoteMissingCols.forEach(c=>delete x[c]); return x; });
    let err=await dbUpsert('quotes',strip(rows));
    for(let k=0; k<3 && err; k++){
      const msg=err.message||String(err); const col=QUOTE_OPT_COLS.find(c=>msg.includes(c));
      if(!col) break;
      state.quoteMissingCols.add(col);
      err=await dbUpsert('quotes',strip(rows));
      if(!err) showToast('저장했어요. (앤드유저·갱신 연결 정보까지 저장하려면 setup.sql을 한 번 더 실행해 주세요)');
    }
    return err;
  }
  async function saveQuote(m){
    const d=m.data;
    d.items=d.items.filter(it=>it.type==='group' ? String(it.name||'').trim() : (String(it.name||'').trim()||num(it.unit_price)));
    if(!d.items.some(it=>it.type!=='group')) return alert('품목을 하나 이상 입력하세요.');
    if(!(await ensureCustomer(d))) return;
    if(!(await ensureContact(d,'contact_id'))) return;
    if(d.contact_id==='__new') d.contact_id=null;
    if(d.contact_id && !d.ref_contact){ const ct=contact(d.contact_id); if(ct){ d.ref_contact=ct.name; d.ref_phone=d.ref_phone||ct.phone||''; d.ref_email=d.ref_email||ct.email||''; } }
    const row=quoteRow(d);
    const err=await upsertQuotes([row]); if(err) return fail('저장 실패',err);
    const clean={...row}; const i=state.quotes.findIndex(x=>x.id===d.id); if(i>-1) state.quotes[i]=clean; else state.quotes.unshift(clean);
    state.modal=null; state.docView={kind:'quote', id:d.id}; showToast('저장되었습니다. PDF로 저장하거나 메일로 보낼 수 있어요.');
  }

      if(opts.fromContract){
        const c=opts.fromContract, its=itemsOf(c.id).filter(i=> opts.supplierKey ? ((i.supplier_id||('n:'+(i.supplier||'')))===opts.supplierKey) : true);
        const sup = its[0] ? (customer(its[0].supplier_id) || supplierByName(its[0].supplier)) : null;
        data.supplier_id = sup ? sup.id : '';
        data._supName = sup ? sup.name : (its[0] && its[0].supplier || '');
        data.contract_id = c.id;
        data.title = c.name;
        data.delivery_place = custName(c.customer_id) + (c.end_user_name ? ` (${c.end_user_name})` : '');
        data.items = its.map(i=>{ const q=num(i.qty)||1; return {type:'item', name:i.product, spec:'', qty:q, unit_price:Math.round(num(i.purchase_amount)/q)}; });
        if(!data.items.length) data.items=[newPOItem()];
        const cs=data.supplier_id?contactsOf(data.supplier_id):[]; if(cs.length===1){ data.contact_id=cs[0].id; data.ref_contact=cs[0].name; data.ref_phone=cs[0].phone||''; data.ref_email=cs[0].email||''; }
      }
    }
    if(!data._supName) data._supName = data.supplier_id ? custName(data.supplier_id) : '';
    if(!data.items || !data.items.length) data.items=[newPOItem()];
    state.modal={type:'po', isNew:!p, data, title:p?`발주서 수정 · ${p.po_no}`:'발주서 작성', wide:true};

  function poRow(p){ const t=poCalc(p); return {id:p.id, po_no:p.po_no, title:p.title||'', po_date:dn(p.po_date), supplier_id:p.supplier_id||null, contact_id:p.contact_id||null, ref_contact:p.ref_contact||'', ref_phone:p.ref_phone||'', ref_email:p.ref_email||'', contract_id:p.contract_id||null, delivery_date:dn(p.delivery_date), delivery_place:p.delivery_place||'', payment_terms:p.payment_terms||'', sales_rep:p.sales_rep||'', sales_phone:p.sales_phone||'', sales_email:p.sales_email||'', items:p.items||[], tax_applied:!!p.tax_applied, subtotal:t.subtotal, tax:t.tax, total:t.total, remarks:p.remarks||'', status:p.status||'작성중', sent_at:p.sent_at||null, sent_to:p.sent_to||'', created_by:p.created_by||state.user}; }
  async function savePO(m){
    const d=m.data;
    const supInput=document.getElementById('f_psup'); if(supInput) d._supName=supInput.value.trim();
    if(!String(d._supName||'').trim()) return alert('매입처를 입력하세요.');
    d.items=d.items.filter(it=>String(it.name||'').trim()||num(it.unit_price));
    if(!d.items.length) return alert('품목을 하나 이상 입력하세요.');
    if(!(await ensureSuppliers([d._supName]))) return;
    const sp=supplierByName(d._supName); d.supplier_id=sp?sp.id:null;
    const row=poRow(d);
    const err=await dbUpsert('purchase_orders',[row]); if(err) return fail('저장 실패',err);
    const i=state.pos.findIndex(x=>x.id===d.id); if(i>-1) state.pos[i]=row; else state.pos.unshift(row);
    state.modal=null; state.docView={kind:'po', id:d.id}; showToast('저장되었습니다. PDF로 저장하거나 메일로 보낼 수 있어요.');
  }

  // ---- 메일 보내기 ----
  function docRecipients(kind, rec){
    const pid = kind==='quote' ? rec.customer_id : rec.supplier_id;
    const list = contactsOf(pid).filter(x=>x.email).map(x=>({key:'cc:'+x.id, email:x.email, label:x.name+(x.dept?' ('+x.dept+')':''), def: x.id===rec.contact_id || (rec.ref_email && x.email===rec.ref_email)}));
    if(rec.ref_email && !list.some(x=>x.email===rec.ref_email)) list.unshift({key:'ref', email:rec.ref_email, label:(rec.ref_contact||'참조')+' (문서에 적힌 참조)', def:true});
    const p=customer(pid); if(kind==='quote' && p && p.tax_email && !list.some(x=>x.email===p.tax_email)) list.push({key:'tax', email:p.tax_email, label:'세금계산서 메일', def:false});
    return list;
  }
  function openDocMail(kind,id){
    const rec=docRecord(kind,id); if(!rec) return;
    const me=myRep(), cname=shortCompany();
    const isQ = kind==='quote';
    const who = isQ ? custName(rec.customer_id) : custName(rec.supplier_id);
    const no = isQ ? rec.quote_no : rec.po_no;
    const subject = isQ ? `[${cname}] ${rec.title||'견적서'} 견적서 송부 (${no})` : `[${cname}] ${rec.title||'발주서'} 발주서 송부 (${no})`;
    const sender = rec.sales_rep || state.user;
    const body = isQ
      ? `안녕하세요, ${cname} ${sender}입니다.\n\n요청하신 ${rec.title?'"'+rec.title+'" ':''}견적서를 첨부와 같이 송부드립니다.\n검토 후 문의 사항 있으시면 편하게 연락 주세요.\n\n감사합니다.\n\n${sender} 드림\n${cname}${rec.sales_phone?'\nTel. '+rec.sales_phone:''}${rec.sales_email?'\n'+rec.sales_email:''}`
      : `안녕하세요, ${cname} ${sender}입니다.\n\n${rec.title?'"'+rec.title+'" ':''}발주서를 첨부와 같이 송부드립니다.\n${rec.delivery_date?'납기일은 '+rec.delivery_date+'입니다. ':''}확인 후 회신 부탁드립니다.\n\n감사합니다.\n\n${sender} 드림\n${cname}${rec.sales_phone?'\nTel. '+rec.sales_phone:''}${rec.sales_email?'\n'+rec.sales_email:''}`;
    const recips = docRecipients(kind, rec);
    state.docMail = {kind, id, subject, body, extra:'', sel:new Set(recips.filter(r=>r.def).map(r=>r.key)), ccMe:true, sending:false, error:'', who};
    render();
  }

      intro:`안녕하세요.\n${shortCompany()} ${myName}입니다.\n\n${custLabel} ${q.title||''} 건 세금계산서 요청드립니다.\n감사합니다.`,
      issueDate:'', taxEmail:cu.tax_email||'', payTerms:'납품후', note:'', special:q.remarks||'', endUser:q.end_user_name||(old?(old.end_user_name||''):'')};

  async function functionError(error){
    const name = error && error.name || '';
    const ctx = error && error.context;
    // 1) 함수까지 도달해서 응답이 온 경우 (상태코드로 원인 구분)
    if(ctx && typeof ctx.status==='number'){
      let body='';
      try{ body = await (ctx.clone? ctx.clone() : ctx).text(); }catch(e){}
      let j=null; try{ j=JSON.parse(body); }catch(e){}
      const raw = (j && (j.error||j.msg||j.message)) || body || '';
      const detail = j && j.detail && j.detail.message ? ' ('+j.detail.message+')' : '';
      if(ctx.status===404) return `[404] send-mail 함수를 찾을 수 없어요. Edge Functions에 이름이 정확히 send-mail 인 함수가 있는지 확인해 주세요.`;
      if(ctx.status===401 && /jwt|token/i.test(raw)) return `[401] 함수의 JWT 검증 설정 때문에 막혔어요. Supabase → Edge Functions → send-mail → Details에서 "Verify JWT"(JWT 검증)를 꺼주세요. (원문: ${raw})`;
      if(j && j.error) return `[${ctx.status}] ${j.error}${detail}`;
      return `[${ctx.status}] ${raw||'알 수 없는 오류'}`;
    }
    // 2) 응답 자체를 못 받은 경우
    const msg = error && error.message || String(error);
    const inner = ctx && ctx.message ? ' / '+ctx.message : '';
    if(name==='FunctionsFetchError' || /Failed to send a request/i.test(msg))
      return `서버 함수에 연결하지 못했어요. ① send-mail 함수가 등록됐는지 ② 함수 설정의 "Verify JWT"가 꺼져 있는지 확인해 주세요. (${name||'오류'}: ${msg}${inner})`;
    if(name==='FunctionsRelayError') return `Supabase 함수 중계 오류예요. 잠시 뒤 다시 시도해 주세요. (${msg})`;
    return msg + inner;
  }
  async function sendDocMail(m, rec){
    const to=docMailTo(m,rec);
    if(!to.length) return alert('받는 사람을 한 명 이상 선택하거나 이메일을 입력해주세요.');
    const myEmail=myRep().email||state.userEmail||'';
    m.sending=true; m.error=''; render();

      const pdf = await makePdf(m.kind, rec, 'base64');
      const html = `<div style="font-family:'Malgun Gothic',sans-serif; font-size:14px; line-height:1.7; color:#222;">${esc(m.body).replace(/\n/g,'<br/>')}</div>`;
      const { data, error } = await sb.functions.invoke('send-mail', { body:{
        to, cc: (m.ccMe && myEmail && !to.includes(myEmail)) ? [myEmail] : [],
        subject:m.subject, text:m.body, html, fromName:shortCompany(), replyTo: rec.sales_email || myEmail,
        attachments:[{filename:docFileName(m.kind,rec), content:pdf}] } });
      if(error || (data && data.error)) throw (error || new Error(data.error));
      rec.status = (rec.status==='계약전환'||rec.status==='입고완료') ? rec.status : '발송';
      rec.sent_at = new Date().toISOString(); rec.sent_to = to.join(', ');
      const err = m.kind==='quote' ? await upsertQuotes([quoteRow(rec)]) : await dbUpsert('purchase_orders',[poRow(rec)]);
      if(err) console.warn(err);
      state.docMail=null; showToast(`메일을 보냈어요 → ${to.join(', ')}`);
    }catch(e){
      m.sending=false; m.error = await functionError(e); render();
    }
  }

    const d=m.data; d.name=String(d.name||'').trim();
    const label = d.kind==='supplier'?'매입처':'고객사';
    if(!d.name) return alert('업체명을 입력하세요.');
    if(partnersOf(d.kind).some(c=>c.name===d.name && c.id!==d.id)) return alert(`같은 이름의 ${label}가 이미 있습니다.`);
    const contacts = d._contacts.filter(x=>String(x.name||'').trim()||x.phone||x.email).map(x=>({...x, customer_id:d.id, name:String(x.name||'').trim()}));
    let err = await dbUpsert('customers',[custRow(d)]); if(err) return fail('저장 실패',err);
    if(contacts.length){ err = await dbUpsert('customer_contacts', contacts.map(contactRow)); if(err) return fail('담당자 저장 실패',err); }
    if(d._removed.length){ err = await dbDelete('customer_contacts', d._removed); if(err) return fail('담당자 삭제 실패',err); }
    const clean = {...d}; delete clean._contacts; delete clean._removed;
    const i=state.customers.findIndex(c=>c.id===d.id); if(i>-1) state.customers[i]=clean; else state.customers.unshift(clean);
    state.contacts = state.contacts.filter(x=>x.customer_id!==d.id).concat(contacts);
    state.modal=null; showToast('저장되었습니다.');
  }

  // ---- customer search field (shared by contract / maint / ticket) ----

      ${!d.customer_id && d._newCustomerName?`<div class="hint">목록에 없는 업체입니다. 저장하면 새 고객사로 등록됩니다.</div>`:''}
    </div>`;
  }
  function bindCustomerSearch(d, onPick){
    const input=document.getElementById('f_cust'), box=document.getElementById('f_cust_sugg'); if(!input) return;
    let composing=false;
    function show(){
      const q=input.value.trim(); if(!q){ box.style.display='none'; return; }
      const hits=sortedCustomers().filter(c=>c.name.toLowerCase().includes(q.toLowerCase())).slice(0,10);
      box.innerHTML = hits.length? hits.map(c=>`<div data-id="${c.id}">${esc(c.name)}</div>`).join('') : `<div style="cursor:default; color:var(--ink-soft);">일치하는 고객사가 없습니다 · 저장하면 새로 등록됩니다</div>`;
      box.querySelectorAll('[data-id]').forEach(it=>it.addEventListener('mousedown',e=>{ e.preventDefault(); d.customer_id=it.dataset.id; d._newCustomerName=''; box.style.display='none'; onPick&&onPick(); render(); }));
      box.style.display='block';
    }
    input.addEventListener('compositionstart',()=>composing=true);
    input.addEventListener('compositionend',()=>{ composing=false; d.customer_id=''; d._newCustomerName=input.value.trim(); show(); });
    input.addEventListener('input',()=>{ d.customer_id=''; d._newCustomerName=input.value.trim(); show(); });
    input.addEventListener('blur',()=>setTimeout(()=>{ box.style.display='none'; const exact=partnersOf('customer').find(c=>c.name===input.value.trim()); if(exact && d.customer_id!==exact.id){ d.customer_id=exact.id; d._newCustomerName=''; onPick&&onPick(); render(); }
      else if(!exact && d._newCustomerName && input.dataset.mode!=='new'){ input.dataset.mode='new'; render(); } },160));
  }

  function endInRange(key, end){

    return `<th style="white-space:nowrap;"><span class="date-th ${on?'on':''}" data-table="${key}" title="눌러서 ${dateLabel(key)} 기간으로 조회">${dateLabel(key)} <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="vertical-align:-1px;"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg></span><span class="sort-th" data-table="${key}" data-col="end" title="정렬"><span class="sort-arrow ${sorted?'on':''}">${sorted?(st.dir==='asc'?'▲':'▼'):'▵'}</span></span></th>`;
  }
  function rangeChip(key){

    return `<div class="date-pop" id="datePop">

  function attachSuggest(input, getNames, onPick, emptyText){
    let box=null, idx=-1;
    const close=()=>{ if(box){ box.remove(); box=null; } idx=-1; };
    const pick=v=>{ input.value=v; onPick(v); close(); };
    const show=()=>{
      const q=input.value.trim().toLowerCase(); if(!q){ close(); return; }
      const hits=getNames().filter(n=>n.toLowerCase().includes(q)).slice(0,10);
      if(!box){ box=document.createElement('div'); box.className='sugg-float'; document.body.appendChild(box); }
      box.innerHTML = hits.length ? hits.map(n=>`<div data-v="${esc(n)}">${esc(n)}</div>`).join('') : `<div class="none">${esc(emptyText||'일치하는 항목이 없습니다')}</div>`;
      const r=input.getBoundingClientRect(); box.style.left=r.left+'px'; box.style.top=(r.bottom+2)+'px'; box.style.width=Math.max(r.width,220)+'px';
      box.querySelectorAll('[data-v]').forEach(it=>it.addEventListener('mousedown',e=>{ e.preventDefault(); pick(it.dataset.v); }));
      idx=-1;
    };
    input.addEventListener('input',show);
    input.addEventListener('focus',show);
    input.addEventListener('blur',()=>setTimeout(close,150));
    input.addEventListener('keydown',e=>{
      if(!box) return; const items=[...box.querySelectorAll('[data-v]')]; if(!items.length) return;
      if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); idx=(idx+(e.key==='ArrowDown'?1:-1)+items.length)%items.length; items.forEach((x,k)=>x.classList.toggle('on',k===idx)); }
      else if(e.key==='Enter' && idx>=0){ e.preventDefault(); pick(items[idx].dataset.v); }
      else if(e.key==='Escape') close();
    });
  }

  async function saveTicket(m, complete){
    const d=m.data;
    if(!String(d.request||'').trim()) return alert('요청 내용을 입력하세요.');
    if(complete) d.status='완료';

    if(d.status!=='완료') d.done_date='';
    if(!(await ensureCustomer(d))) return;
    if(!(await ensureContact(d,'contact_id'))) return;
    if(d.contact_id==='__new') d.contact_id=null;
    const hit = state.contracts.filter(c=>c.customer_id===d.customer_id).find(c=>itemsOf(c.id).some(i=>i.product===d.product));
    d.contract_id = hit ? hit.id : (d.contract_id||null);

    if(m.isNew){ openShare('tk', d.id); showToast('접수했어요. 담당 엔지니어에게 보내세요.'); }

  async function saveRep(m){
    const d=m.data; d.name=String(d.name||'').trim(); if(!d.name) return alert('이름을 입력하세요.');
    if(d.name.includes('@')) return alert('이메일 말고 실제 이름을 입력해주세요. (예: 최나래)');
    const twin = state.reps.find(r=>r.name===d.name && r.id!==d.id);
    const isMe = d.email && state.userEmail && d.email.toLowerCase()===state.userEmail.toLowerCase();
    if(twin){
      if(!isMe) return alert('같은 이름의 담당자가 이미 있습니다.');
      if(twin.email && twin.email.toLowerCase()!==state.userEmail.toLowerCase() && !confirm(`"${twin.name}" 담당자에는 다른 이메일(${twin.email})이 적혀 있어요.\n이 로그인(${state.userEmail})으로 바꾸고 하나로 합칠까요?`)) return;
      return mergeIntoRep(d, twin);
    }
    const ad=document.getElementById('f_admin'); if(ad && state.isAdmin) d.is_admin=ad.checked;
    const old=state.reps.find(r=>r.id===d.id);
    const err=await dbUpsert('reps',[repRow(d)]); if(err) return fail('저장 실패',err);
    // 이름이 바뀌면 이전 이름(또는 이메일)으로 저장된 기록도 새 이름으로 바꿈
    await renameRecords([old&&old.name, d.email], d.name);
    const i=state.reps.findIndex(r=>r.id===d.id); if(i>-1) state.reps[i]=d; else state.reps.unshift(d);
    if(d.email && state.userEmail && d.email.toLowerCase()===state.userEmail.toLowerCase()) state.user=d.name;
    state.modal=null; showToast('저장되었습니다.');
  }

  // 같은 사람이 두 줄로 생긴 경우: 이메일로 만들어진 줄(dup)을 기존 담당자(keep)에 합치기
  async function renameRecords(from, to){
    for(const ov of [...new Set(from.filter(v=>v && v!==to))]){
      await sb.from('contracts').update({sales_rep:to}).eq('sales_rep',ov);
      await sb.from('maintenance_contracts').update({sales_rep:to}).eq('sales_rep',ov);
      await sb.from('support_tickets').update({assignee:to}).eq('assignee',ov);
      state.contracts.forEach(c=>{ if(c.sales_rep===ov) c.sales_rep=to; });
      state.maint.forEach(x=>{ if(x.sales_rep===ov) x.sales_rep=to; });
      state.tickets.forEach(t=>{ if(t.assignee===ov) t.assignee=to; });
    }
  }
  async function mergeIntoRep(dup, keep){
    const merged = {...keep, email:dup.email, is_admin: !!(keep.is_admin || dup.is_admin), phone: keep.phone||dup.phone||'', dept: keep.dept||dup.dept||''};
    let err = await dbUpsert('reps',[repRow(merged)]); if(err) return fail('합치기 실패',err);
    const orig = state.reps.find(r=>r.id===dup.id);
    if(dup.id!==keep.id){ err = await dbDelete('reps',[dup.id]); if(err) return fail('중복 담당자 삭제 실패',err); }
    await renameRecords([orig && orig.name, dup.email], merged.name);
    state.reps = state.reps.filter(r=>r.id!==dup.id).map(r=>r.id===keep.id?merged:r);
    state.user = merged.name;
    state.isAdmin = !!merged.is_admin || !state.reps.some(r=>r.is_admin);
    state.modal=null; showToast(`"${merged.name}" 담당자로 합쳤습니다.`);
  }

  // ================= delete =================
  const TABLES = {customers:['customers','customers','고객사'], suppliers:['customers','customers','매입처'], contracts:['contracts','contracts','계약'], maint:['contracts','contracts','유지보수 계약'], support:['support_tickets','tickets','기술지원'], reps:['reps','reps','담당자'], quotes:['quotes','quotes','견적서'], pos:['purchase_orders','pos','발주서']};
  function deleteRecords(key, ids, after){
    const [table, field, label] = TABLES[key];
    if(key==='customers'){
      const used = ids.filter(id=>state.contracts.some(c=>c.customer_id===id) || state.maint.some(m=>mtCustomerId(m)===id) || state.tickets.some(t=>t.customer_id===id));
      if(used.length) return alert(`계약·유지보수·기술지원 기록이 있는 고객사 ${used.length}곳은 삭제할 수 없습니다.\n관련 기록을 먼저 정리해주세요.`);
    }
    if(key==='suppliers'){
      const used = ids.filter(id=>{ const c=customer(id); return c && partnerStats(c).its.length + partnerStats(c).mts.length > 0; });
      if(used.length) return alert(`계약 품목이나 유지보수에 쓰인 매입처 ${used.length}곳은 삭제할 수 없습니다.`);
    }
    askConfirm(`${label} ${ids.length}건을 삭제할까요?${key==='contracts'||key==='maint'?'\n품목 정보도 함께 삭제됩니다.':''}`, async ()=>{
      let err=await dbDelete(table, ids); if(err) return fail('삭제 실패',err);
      if(key==='contracts'||key==='maint'){ const itIds=state.items.filter(i=>ids.includes(i.contract_id)).map(i=>i.id); await dbDelete('contract_items',itIds); state.items=state.items.filter(i=>!ids.includes(i.contract_id)); }
      if(key==='customers'||key==='suppliers'){ const cIds=state.contacts.filter(x=>ids.includes(x.customer_id)).map(x=>x.id); await dbDelete('customer_contacts',cIds); state.contacts=state.contacts.filter(x=>!ids.includes(x.customer_id)); }
      state[field]=state[field].filter(x=>!ids.includes(x.id));
      ids.forEach(id=>state.sel[key].delete(id));
      after&&after(); showToast('삭제되었습니다.');
    });
  }

  function renderAttachView(){

  function bindAttachments(){
    const fileInput=document.getElementById('attachFileInput');
    document.querySelectorAll('.attachAdd').forEach(b=>b.onclick=()=>{ state.attachTarget={kind:b.dataset.kind,id:b.dataset.id}; fileInput.click(); });

    fileInput.onchange=async ()=>{

  async function importContracts(file){
    let rows; try{ rows=await readSheetRows(file); }catch(e){ return alert('엑셀 파일을 읽지 못했습니다: '+e.message); }
    const isMt=state.tab==='maint', ctx=importCtx(), groups=new Map(); let bad=0;
    rows.forEach(r=>{
      const name=pick(r,'계약명'), cname=pick(r,'고객사'), prod=pick(r,'제품','제품명','품명');
      if(name.startsWith('(예)')||cname.startsWith('(예)')) return;
      if(!name && !cname && !prod) return;
      if(!name || !cname){ bad++; return; }
      const key=(pick(r,'계약코드')||'')+'|'+name+'|'+cname;
      if(!groups.has(key)) groups.set(key,{r, name, cname, code:pick(r,'계약코드'), items:[]});
      if(prod) groups.get(key).items.push(r);
    });
    const ctrs=[], items=[], skipped=[];
    for(const g of groups.values()){
      const r=g.r;
      if((g.code && state.contracts.some(c=>c.code===g.code)) || state.contracts.some(c=>c.name===g.name && custName(c.customer_id)===g.cname)){ skipped.push(g.name); continue; }
      const cu=ctx.cust(g.cname), ct=ctx.contact(cu, pick(r,'고객담당자','담당자'));
      let deal=pick(r,'분류','구분')||(isMt?'유지보수':'신규'); if(!DEAL_TYPES.includes(deal)) deal=isMt?'유지보수':'신규';
      const its=g.items.map((x,i)=>{ const qty=xNum(pick(x,'수량'))||1; let unit=xNum(pick(x,'단가')); let sale=xNum(pick(x,'매출','매출금액','금액')); if(!sale) sale=qty*unit; if(!unit && sale) unit=Math.round(sale/qty); const sp=ctx.sup(pick(x,'매입처')); return {id:uid('it'), product:pick(x,'제품','제품명','품명'), qty, unit_price:unit, sale_amount:sale, supplier:sp?sp.name:'', supplier_id:sp?sp.id:null, purchase_amount:xNum(pick(x,'매입','매입금액')), end_date:xDate(pick(x,'품목만료일')), sort:i, renewed:false, closed:false}; });
      let exp=xDate(pick(r,'만료일','만료일(기본)'));
      if(!exp){ const ends=its.map(i=>i.end_date).filter(Boolean).sort(); exp=ends[ends.length-1]||''; }
      its.forEach(i=>{ if(i.end_date===exp) i.end_date=''; });
      const c={id:uid('cr'), code:nextCode('CR',[...state.contracts,...ctrs]), name:g.name, customer_id:cu.id, contact_id:ct?ct.id:null, end_user_name:pick(r,'앤드유저'), deal_type:deal, billing_cycle:pick(r,'결제주기')||BILLING[0], stage:normStage(pick(r,'단계')||STAGES[0]), contract_date:xDate(pick(r,'계약일'))||todayStr(), expiry_date:exp, alert_days:30, sales_rep:repName(pick(r,'영업담당','담당')), remarks:pick(r,'비고'), reg_date:todayStr(), renewed:false, alert_dismissed:false};
      its.forEach(i=>i.contract_id=c.id);
      ctrs.push(c); items.push(...its);
    }
    if(!ctrs.length) return alert(`넣을 계약이 없어요.${skipped.length?`\n이미 있는 계약 ${skipped.length}건은 건너뛰었어요.`:''}${bad?`\n계약명·고객사가 빠진 줄 ${bad}개가 있어요.`:''}\n양식의 열 이름(계약명, 고객사, 제품…)을 확인해 주세요.`);
    const sum=ctrs.reduce((a,c)=>a+items.filter(i=>i.contract_id===c.id).reduce((b,i)=>b+i.sale_amount,0),0);
    askConfirm(`${isMt?'유지보수':'계약'} ${ctrs.length}건 (품목 ${items.length}개, 매출 합계 ₩${won(sum)})을 넣을까요?`+
      (ctx.newCusts.length?`\n새 고객사 ${ctx.newCusts.length}곳: ${ctx.newCusts.slice(0,5).map(x=>x.name).join(', ')}${ctx.newCusts.length>5?' 외':''}`:'')+
      (ctx.newSups.length?`\n새 매입처 ${ctx.newSups.length}곳: ${ctx.newSups.slice(0,5).map(x=>x.name).join(', ')}${ctx.newSups.length>5?' 외':''}`:'')+
      (skipped.length?`\n이미 있어서 건너뛸 계약 ${skipped.length}건`:'')+(bad?`\n계약명·고객사가 빠진 줄 ${bad}개는 빠집니다`:''), async ()=>{
      try{
        await ctx.save();
        let e=await chunkUpsert('contracts', ctrs.map(ctrRow)); if(e) throw e;
        e=await chunkUpsert('contract_items', items.map(itemRow)); if(e) throw e;
        state.contracts.unshift(...ctrs); state.items.push(...items);
        showToast(`${ctrs.length}건을 넣었어요.`);
      }catch(e){ fail('가져오기 실패',e); }
    }, '넣기', false);
  }
  async function importQuotes(file){
    let rows; try{ rows=await readSheetRows(file); }catch(e){ return alert('엑셀 파일을 읽지 못했습니다: '+e.message); }
    const ctx=importCtx(), groups=new Map(); let bad=0;
    rows.forEach(r=>{
      const cname=pick(r,'고객사'), title=pick(r,'건명'), item=pick(r,'품명','제품'), no=pick(r,'견적번호');
      if(cname.startsWith('(예)')||no.startsWith('(예)')) return;
      if(!cname && !title && !item) return;
      if(!cname || !title){ bad++; return; }
      const key=no || (title+'|'+cname+'|'+xDate(pick(r,'견적일')));
      if(!groups.has(key)) groups.set(key,{r, no, items:[]});
      if(item) groups.get(key).items.push(r);
    });
    const qs=[], skipped=[];
    for(const g of groups.values()){
      const r=g.r;
      if(g.no && state.quotes.some(q=>q.quote_no===g.no)){ skipped.push(g.no); continue; }
      const cu=ctx.cust(pick(r,'고객사')), refName=pick(r,'참조','고객담당자'), ct=ctx.contact(cu, refName);
      const date=xDate(pick(r,'견적일'))||todayStr();
      const rep=repName(pick(r,'영업담당')), rr=repByName(rep)||{};
      const tax=pick(r,'부가세'); let st=pick(r,'상태')||'작성중'; if(!['작성중','발송','계약전환'].includes(st)) st='작성중';
      const its=g.items.map(x=>({type:'item', name:pick(x,'품명','제품'), spec:pick(x,'규격'), qty:xNum(pick(x,'수량'))||1, list_price:xNum(pick(x,'소비자가','소비자가격')), unit_price:xNum(pick(x,'공급단가','단가')), cost_price:xNum(pick(x,'매입단가')), lic_start:xDate(pick(x,'시작일')), lic_end:xDate(pick(x,'종료일'))}));
      qs.push({id:uid('q'), quote_no:g.no||docNo('Q',[...state.quotes,...qs],'quote_no',date), title:pick(r,'건명'), quote_date:date, customer_id:cu.id, contact_id:ct?ct.id:null, ref_contact:refName||'', ref_phone:ct?ct.phone||'':'', ref_email:ct?ct.email||'':'', valid_days:'15', delivery:'주문 후 협의', sales_rep:rep, sales_phone:rr.phone||'', sales_email:rr.email||'', end_user_name:pick(r,'앤드유저'), items:its.length?its:[newQuoteItem()], tax_applied:!/없음|미포함|N/i.test(tax), remarks:pick(r,'비고'), status:st, created_by:state.user});
    }
    if(!qs.length) return alert(`넣을 견적이 없어요.${skipped.length?`\n이미 있는 견적번호 ${skipped.length}건은 건너뛰었어요.`:''}${bad?`\n고객사·건명이 빠진 줄 ${bad}개가 있어요.`:''}\n양식의 열 이름(고객사, 건명, 품명…)을 확인해 주세요.`);
    const n=qs.reduce((a,q)=>a+q.items.length,0);
    askConfirm(`견적 ${qs.length}건 (품목 ${n}개)을 넣을까요?`+(ctx.newCusts.length?`\n새 고객사 ${ctx.newCusts.length}곳: ${ctx.newCusts.slice(0,5).map(x=>x.name).join(', ')}${ctx.newCusts.length>5?' 외':''}`:'')+(skipped.length?`\n이미 있어서 건너뛸 견적 ${skipped.length}건`:'')+(bad?`\n고객사·건명이 빠진 줄 ${bad}개는 빠집니다`:''), async ()=>{
      try{
        await ctx.save();
        const rowsQ=qs.map(quoteRow);
        for(let i=0;i<rowsQ.length;i+=300){ const e=await upsertQuotes(rowsQ.slice(i,i+300)); if(e) throw e; }
        state.quotes.unshift(...rowsQ);
        showToast(`견적 ${qs.length}건을 넣었어요.`);
      }catch(e){ fail('가져오기 실패',e); }
    }, '넣기', false);
  }
  // ================= shell binding =================
  function bindShell(){
    document.querySelectorAll('.nav-item').forEach(el=>el.onclick=()=>goTab(el.dataset.tab));
    document.querySelectorAll('.nav-group').forEach(el=>el.onclick=()=>{ const g=el.dataset.group; const open=el.classList.contains('open'); state.navOpen=state.navOpen||{}; state.navOpen[g]=!open; if(open && NAV.find(n=>n.group===g).items.some(([k])=>k===state.tab)){ state.tab='dashboard'; } render(); });
    document.querySelectorAll('[data-goto]').forEach(el=>el.onclick=()=>{ state.tab=el.dataset.goto; render(); });
    document.getElementById('pwBtn').onclick=()=>{ state.modal={type:'pw', isNew:true, data:{}, title:'비밀번호 변경'}; render(); setTimeout(()=>{ const e=document.getElementById('pw1'); if(e) e.focus(); },0); };
    document.getElementById('logoutBtn').onclick=async ()=>{ await sb.auth.signOut(); state.view='login'; state.user=null; render(); };
    const nb=document.getElementById('notifyBtn');
    if(nb) nb.onclick=async ()=>{
      const p=notifyPerm();
      if(p==='denied') return alert('알림이 차단되어 있어요.\n주소창 왼쪽 자물쇠 아이콘 → 사이트 권한 → 알림을 "허용"으로 바꾼 뒤 새로고침해주세요.');
      if(p==='default'){ await Notification.requestPermission(); render(); if(notifyPerm()==='granted'){ showToast('갱신 알림이 켜졌습니다.'); checkNotifications(true); } return; }
      checkNotifications(true);
    };
    // table common
    document.querySelectorAll('.sort-th').forEach(el=>el.onclick=()=>{ const k=el.dataset.table, c=el.dataset.col; const st=state.sort[k]; state.sort[k] = st&&st.col===c ? {col:c, dir:st.dir==='asc'?'desc':'asc'} : {col:c, dir:'asc'}; render(); });
    document.querySelectorAll('.pageBtn').forEach(el=>el.onclick=()=>{ state.page[el.dataset.table]=+el.dataset.page; render(); });
    document.querySelectorAll('.toggleRow').forEach(el=>el.onclick=()=>{ state.expanded = state.expanded===el.dataset.id?null:el.dataset.id; render(); });
    document.querySelectorAll('.rowCheck').forEach(el=>el.onchange=()=>{ const s=state.sel[el.dataset.table]; el.checked?s.add(el.dataset.id):s.delete(el.dataset.id); render(); });
    document.querySelectorAll('.checkAll').forEach(el=>{ const k=el.dataset.table; const ids=[...document.querySelectorAll(`.rowCheck[data-table="${k}"]`)].map(x=>x.dataset.id); el.checked=ids.length>0 && ids.every(id=>state.sel[k].has(id)); el.onchange=()=>{ ids.forEach(id=>el.checked?state.sel[k].add(id):state.sel[k].delete(id)); render(); }; });
    document.querySelectorAll('.bulkDel').forEach(el=>el.onclick=()=>{ const k=el.dataset.table; if(!state.sel[k].size) return alert('삭제할 항목을 먼저 체크해주세요.'); deleteRecords(k,[...state.sel[k]]); });
    document.querySelectorAll('.searchBox').forEach(el=>{
      const k=el.dataset.table; let composing=false, t=null;
      const apply=()=>{ state.q[k]=el.value; state.page[k]=1; clearTimeout(t); t=setTimeout(()=>{ if(!composing) render(); },220); };
      el.addEventListener('compositionstart',()=>{ composing=true; });
      el.addEventListener('compositionend',()=>{ composing=false; apply(); });
      el.addEventListener('input',()=>{ if(!composing) apply(); else state.q[k]=el.value; });
    });
    document.querySelectorAll('.editTk').forEach(b=>b.onclick=()=>openTicketModal(state.tickets.find(t=>t.id===b.dataset.id)));
    document.querySelectorAll('.shareBtn').forEach(b=>b.onclick=e=>{ e.stopPropagation(); openShare(b.dataset.kind,b.dataset.id); });
    // excel
    const fab=document.getElementById('excelFab'); if(fab) fab.onclick=e=>{ e.stopPropagation(); state.excelMenu=!state.excelMenu; render(); };
    document.querySelectorAll('#excelMenu [data-x]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); state.excelMenu=false; const x=b.dataset.x; render(); if(x==='export') exportExcel(); if(x==='template') (['contracts','maint','quotes'].includes(state.tab)?downloadDealTemplate():downloadPartnerTemplate()); if(x==='import') document.getElementById('importFileInput').click(); });
    const imp=document.getElementById('importFileInput'); imp.onchange=()=>{ const f=imp.files[0]; imp.value=''; if(!f) return; if(state.tab==='quotes') importQuotes(f); else if(state.tab==='contracts'||state.tab==='maint') importContracts(f); else importPartners(f, state.tab==='suppliers'?'supplier':'customer'); };
    if(state.excelMenu) setTimeout(()=>document.addEventListener('click', function h(e){ if(!e.target.closest('.excel-wrap')){ state.excelMenu=false; render(); } }, {once:true}),0);
    // confirm
    if(state.confirm){ document.getElementById('cfNo').onclick=()=>{ state.confirm=null; render(); }; document.getElementById('cfYes').onclick=()=>{ const fn=state.confirm.onYes; state.confirm=null; render(); fn&&fn(); }; }
    ({dashboard:bindDashboard, customers:()=>bindPartners('customer'), suppliers:()=>bindPartners('supplier'), contracts:()=>bindContracts('contracts'), maint:()=>bindContracts('maint'), support:bindSupport, reps:bindReps, quotes:bindQuotes, pos:bindPOs, company:bindCompany, stats:bindStats})[state.tab]();
    bindAttachments();
    bindModal();
    bindShare();
    bindDateFilter();
    document.querySelectorAll('.renewQuote').forEach(b=>b.onclick=e=>{ e.stopPropagation(); openRenewalQuote(b.dataset.id, b.dataset.end); });
    document.querySelectorAll('.plusBtn').forEach(b=>b.onclick=e=>{ e.stopPropagation(); showPlusMenu(b); });
    document.querySelectorAll('.wtab').forEach(el=>el.onclick=()=>{ goTab(el.dataset.tab); });
    document.querySelectorAll('.wtab-x').forEach(el=>el.onclick=e=>{ e.stopPropagation(); closeWTab(el.dataset.tab); });
    bindDocView(); bindDocMail(); bindPoReq();
    document.querySelectorAll('.docView').forEach(b=>b.onclick=()=>{ state.docView={kind:b.dataset.kind, id:b.dataset.id}; render(); });
    document.querySelectorAll('.docMail').forEach(b=>b.onclick=e=>{ e.stopPropagation(); openDocMail(b.dataset.kind, b.dataset.id); });
    document.querySelectorAll('.docPdf').forEach(b=>b.onclick=()=>{ const r=docRecord(b.dataset.kind,b.dataset.id); if(r) savePdf(b.dataset.kind,r); });
    document.querySelectorAll('.poFromCtr').forEach(b=>b.onclick=()=>{ const c=contractById(b.dataset.ctr); if(c) openPOModal(null,{fromContract:c, supplierKey:b.dataset.sup}); });
  }

  async function init(){
    try{ sb.auth.onAuthStateChange((ev, session)=>{ if(ev==='PASSWORD_RECOVERY'){ if(session&&session.user) state.userEmail=session.user.email; state.view='recovery'; render(); } }); }catch(e){}
    try{
      const { data } = await sb.auth.getSession();
      if(IS_RECOVERY && data && data.session){ state.userEmail=data.session.user.email; state.view='recovery'; render(); return; }
      if(data && data.session){ const u=data.session.user; state.user=(u.user_metadata&&u.user_metadata.name)||u.email; state.userEmail=u.email; state.view='main'; await loadAll(); return; }
    }catch(e){}
    render();
  }
  init();
  if('serviceWorker' in navigator && location.protocol==='https:'){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('/sw.js').catch(()=>{}); }); }
  setInterval(()=>{ if(state.view==='main' && !state.loading) checkNotifications(); }, 60*60*1000);
})();
</script>
